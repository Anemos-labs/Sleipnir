html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg1);color:var(--ink);
  font:13px/1.4 var(--f-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled,[aria-disabled="true"]{cursor:not-allowed}
a{color:var(--a-be1)}
code,kbd,pre,samp,.mono{font-family:var(--f-code)}
::selection{background:rgba(255,158,100,.28)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:1px;border-radius:var(--r1)}
.tr:focus-visible,.row-btn:focus-visible{outline-offset:-2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:13px;height:13px}
svg.i.xs{width:11px;height:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skiplink{position:absolute;left:8px;top:-60px;z-index:300;background:var(--ember);color:var(--ink-on-ember);padding:6px 10px;border-radius:var(--r2);font-weight:600}
.skiplink:focus{top:8px}
.dim{color:var(--ink3)} .dim2{color:var(--ink2)}
.ember{color:var(--ember)} .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .info{color:var(--info)}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sp{flex:1 1 auto}
.micro{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:6px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}

/* agent colour hooks: set --c from data-ag */
[data-ag="mgr"]{--c:var(--a-mgr)}
[data-ag="be-1"]{--c:var(--a-be1)}
[data-ag="be-2"]{--c:var(--a-be2)}
[data-ag="fe-1"]{--c:var(--a-fe1)}
[data-ag="sc-1"],[data-ag="sc-2"],[data-ag="sc-3"]{--c:var(--a-sc)}
[data-ag="ts-1"]{--c:var(--a-ts)}
[data-ag="you"]{--c:var(--a-you)}
[data-ag="harness"]{--c:var(--ink3)}
.ag{color:var(--c,var(--ink2));font-weight:500}

/* shared small parts */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg2);color:var(--ink2);font-size:12px;white-space:nowrap}
.chip b{font-weight:600;color:var(--ink)}
.chip.ember{border-color:var(--ember-line);background:var(--ember-bg);color:var(--ember)}
.chip.ok{border-color:rgba(158,206,106,.4);background:var(--ok-bg);color:var(--ok)}
.chip.warn{border-color:rgba(224,175,104,.4);background:var(--warn-bg);color:var(--warn)}
.chip.err{border-color:rgba(247,118,142,.45);background:var(--err-bg);color:var(--err)}
.chip.info{border-color:rgba(125,207,255,.35);background:var(--info-bg);color:var(--info)}
.chip.mono{font-family:var(--f-code);font-size:11.5px}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink3));flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg3);color:var(--ink);font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--bg4);border-color:var(--line3)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.xs{height:20px;padding:0 6px;font-size:11.5px;border-radius:var(--r1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover:not(:disabled){background:var(--bg3);color:var(--ink)}
.btn.ember{background:var(--ember);border-color:var(--ember);color:var(--ink-on-ember);font-weight:600}
.btn.ember:hover:not(:disabled){background:#ffb07f;border-color:#ffb07f}
.btn.line-ember{border-color:var(--ember-line);color:var(--ember);background:var(--ember-bg)}
.btn.line-ember:hover:not(:disabled){background:var(--ember-bg2);border-color:var(--ember)}
.btn.danger{border-color:rgba(247,118,142,.5);color:var(--err);background:var(--err-bg)}
.btn:disabled{opacity:.5}
.kbd,kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;background:var(--bg3);color:var(--ink2);font:500 10.5px/1 var(--f-code)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg1);padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:2px;color:var(--ink2);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--bg5);color:var(--ink)}
.glyph{font-family:var(--f-code);font-size:12px;line-height:1;display:inline-block;width:1.1em;text-align:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bg4);color:var(--ink2)}
.pill.ember{background:var(--ember-bg2);color:var(--ember)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.stl{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;font:700 10.5px/1 var(--f-code);flex:none}
.stl.A{color:var(--ok);background:var(--ok-bg)}
.stl.M{color:var(--warn);background:var(--warn-bg)}
.stl.D{color:var(--err);background:var(--err-bg)}
.stl.R{color:var(--info);background:var(--info-bg)}
.stl.U{color:var(--ink3);background:var(--bg3)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flashrow{0%{background:var(--ember-bg2)}100%{background:transparent}}
@keyframes stripe-pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 12px 0 transparent}}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}

/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:var(--tb-h) minmax(0,1fr) var(--sb-h);background:var(--bg1)}
#stage{position:relative;min-height:0;min-width:0}
.review{position:absolute;inset:0;display:grid;grid-template-columns:var(--ex-w) minmax(0,1fr) var(--ag-w);min-height:0}
.screen{position:absolute;inset:0;overflow:auto;background:var(--bg1)}
#app[data-view="review"] .screen{display:none}
#app:not([data-view="review"]) .review{display:none}
.pane{min-width:0;min-height:0;background:var(--bg2);display:flex;flex-direction:column;position:relative}
#explorer{border-right:1px solid var(--line)}
#agent{border-left:1px solid var(--line)}
.sp-v{position:absolute;top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize;z-index:20}
.sp-v::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:transparent;transition:background .15s}
.sp-v:hover::after,.sp-v.drag::after{background:var(--ember);width:2px;left:3.5px}
.sp-h{height:7px;margin-top:-3px;margin-bottom:-4px;cursor:row-resize;position:relative;z-index:20;flex:none}
.sp-h::after{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:transparent}
.sp-h:hover::after,.sp-h.drag::after{background:var(--ember);height:2px;top:2.5px}

/* ---------- top bar ---------- */
.tb{display:flex;align-items:stretch;gap:12px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:30}
.tb>*{align-self:center}
.brand{display:flex;align-items:center;gap:9px;padding-right:4px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:28px;height:28px;border-radius:7px;flex:none}
.brand .wm{font-weight:600;font-size:14.5px;letter-spacing:-.005em}
.brand .wm i{font-style:normal;color:var(--ember);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-left:7px}
#views{display:flex;align-self:stretch;gap:2px;margin-left:4px}
#views button{position:relative;align-self:stretch;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 11px;color:var(--ink2);font-weight:500;border-radius:0}
#views button:hover{color:var(--ink);background:var(--bg3)}
#views button[aria-current="page"]{color:var(--ink)}
#views button[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ember);border-radius:2px 2px 0 0}
#views .cnt{font-size:10.5px;font-weight:600;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bg4);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
#views .cnt.hot{background:var(--ember-bg2);color:var(--ember)}
.palbtn{flex:1 1 160px;min-width:120px;max-width:340px;height:30px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg1);color:var(--ink3)}
.palbtn:hover{border-color:var(--line3);color:var(--ink2)}
.palbtn span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-chips{display:flex;align-items:center;gap:6px;flex:none}
.tbchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg2);color:var(--ink2);font-size:12px;white-space:nowrap}
.tbchip:hover{border-color:var(--line3);background:var(--bg3);color:var(--ink)}
.tbchip b{color:var(--ink);font-weight:600}
.tbchip .dotm{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#chip-mode[data-m="accept-edits"] .dotm{background:var(--warn)}
#chip-mode[data-m="plan"] .dotm{background:var(--info)}
#chip-mode[data-m="bypass"],#chip-mode[data-m="yolo"]{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.meter{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--bg5);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ember2);border-radius:2px}
.accept{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 12px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--bg3);color:var(--ink3);font-weight:600;white-space:nowrap;flex:none;transition:all .25s var(--ease)}
.accept .short{display:none}
.accept .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:3px;background:var(--bg1);font:600 11px/1 var(--f-code);color:var(--ink3)}
.accept.ready{color:var(--ink-on-ember);border-color:var(--ember-hi);background:linear-gradient(180deg,var(--ember-hi) 0%,var(--ember) 55%,var(--ember-lo) 100%);box-shadow:0 0 0 1px rgba(255,158,100,.25),0 4px 18px -4px rgba(255,140,60,.55)}
.accept.ready .n{background:rgba(27,15,6,.82);color:var(--ember)}
.accept.ready:hover{filter:brightness(1.07)}
.accept.heat{animation:heat 1.6s ease-out 1}
@keyframes heat{0%{box-shadow:0 0 0 0 rgba(255,158,100,.8)}100%{box-shadow:0 0 0 14px rgba(255,158,100,0)}}

/* ---------- status bar ---------- */
#status{display:flex;align-items:center;gap:0;background:var(--bg2);border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);min-width:0;white-space:nowrap;overflow:hidden}
#status .si{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 10px;border-right:1px solid var(--line);flex:none}
#status button.si:hover{background:var(--bg3);color:var(--ink)}
#status .si.r{border-right:0;border-left:1px solid var(--line)}
#status .conn{color:var(--ok)}
#status .conn b{font-weight:500;color:var(--ink)}
#status .mockchip{margin:0 8px;height:18px;padding:0 7px;border-radius:9px;border:1px dashed var(--line3);color:var(--ink2);font-size:10.5px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center}
#status .warm{display:inline-flex;align-items:center;gap:6px}
.warmbar{display:inline-flex;gap:1px}
.warmbar i{width:3px;height:9px;background:var(--ember2);border-radius:1px}
.warmbar i.off{background:var(--bg5)}
.warm[data-lvl="red"] .warmbar i:not(.off){background:var(--err)}
.warm[data-lvl="red"]{color:var(--err)}
.warm[data-lvl="cold"]{color:var(--ink3)}
.warm.refill .warmbar{animation:refill .6s var(--ease)}
@keyframes refill{0%{filter:brightness(2.2)}100%{filter:none}}
.warm.flash{color:var(--err)}
.warm.flash .warmbar i:not(.off){background:var(--err)}

/* ---------- explorer ---------- */
.exhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.exproj{display:flex;align-items:center;gap:8px;min-width:0}
.exproj .nm{font-weight:600;font-size:13.5px}
.exproj .pth{color:var(--ink3);font-size:11.5px;font-family:var(--f-code)}
.exmeta{display:flex;flex-wrap:wrap;gap:5px}
.extabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:2px}
.extabs button{position:relative;height:32px;padding:0 9px;color:var(--ink3);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.extabs button:hover{color:var(--ink)}
.extabs button[aria-selected="true"]{color:var(--ink)}
.extabs button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--ember)}
.extabs .pill{height:16px;font-size:10.5px;padding:0 5px}
.expanel{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
.exfoot{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px}
.legend button{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 6px;border:1px solid var(--line);border-radius:var(--r2);color:var(--ink2);font:500 11.5px var(--f-code);background:var(--bg1)}
.legend button:hover{border-color:var(--line3);color:var(--ink)}
.legend button[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:var(--bg3)}

/* tree */
.tree{padding:6px 0 10px;font-size:13px}
.tr{position:relative;display:flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 calc(10px + var(--d,0)*14px);color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.tr:hover{background:var(--bg3);color:var(--ink)}
.tr[aria-selected="true"]{background:var(--bg4);color:var(--ink)}
.tr .tw{width:12px;display:inline-flex;justify-content:center;color:var(--ink3);flex:none}
.tr .tw svg{transition:transform .12s}
.tr[aria-expanded="true"] .tw svg{transform:rotate(90deg)}
.tr .ico{color:var(--ink3);flex:none}
.tr.dir .ico{color:var(--folder)}
.tr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tr .own{position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:0 2px 2px 0;background:var(--c)}
.tr.live .own{animation:pulse 1.2s ease-in-out infinite}
.tr .tag{display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 5px;border-radius:3px;font-size:10.5px;font-weight:600;letter-spacing:.01em;flex:none;background:var(--bg4);color:var(--c,var(--ink2))}
.tr .tag.lock{background:transparent;padding:0 2px;color:var(--ink3)}
.tr .tag.ask{background:var(--warn-bg);color:var(--warn)}
.tr .tag.ok{background:transparent;color:var(--ok);padding:0 2px}
.tr.protected .nm{color:var(--ink3)}
.tr.ghost .nm{font-style:italic;color:var(--warn);text-decoration:underline dashed rgba(224,175,104,.5);text-underline-offset:3px}
.tr.ghost .ico{color:var(--warn)}
.tr.ghost .own{background:repeating-linear-gradient(180deg,var(--c) 0 3px,transparent 3px 6px)}
.tr.dim{opacity:.35}
.tr.new{animation:flashrow 1.4s ease-out}
.tr.guide::before{content:"";position:absolute;left:calc(15px + (var(--d,1) - 1)*14px);top:0;bottom:0;width:1px;background:var(--line)}

/* changes */
.chg{padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px}
.chgbar{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-size:12px;color:var(--ink3)}
.grp{border:1px solid var(--line);border-radius:var(--r3);background:var(--bg1);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg2);border-bottom:1px solid var(--line);position:relative}
.grp-h .tid{font:700 11.5px var(--f-code);color:var(--ink)}
.grp-h .tt{flex:1;min-width:0;font-weight:500;color:var(--ink)}
.grp-h .sw{width:10px;height:10px;border-radius:2px}
.grp-s{display:flex;align-items:center;gap:6px;padding:5px 9px 6px;font-size:11.5px;color:var(--ink3);border-bottom:1px solid var(--line)}
.grp-s .chip{height:19px;font-size:11px}
.fr{position:relative;display:flex;align-items:center;gap:7px;height:28px;padding:0 9px 0 11px;color:var(--ink2);cursor:pointer}
.fr:hover{background:var(--bg3);color:var(--ink)}
.fr[aria-selected="true"]{background:var(--bg4);color:var(--ink)}
.fr .own{position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:0 2px 2px 0;background:var(--c)}
.fr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .nm small{color:var(--ink3);font-size:11.5px;margin-left:5px}
.pm{font:500 11.5px var(--f-code);display:inline-flex;gap:5px;flex:none}
.pm .p{color:var(--add-ink)} .pm .m{color:var(--del-ink)}
.rv{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--line3);display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent;background:var(--bg1)}
.rv[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg0)}
.rv:hover{border-color:var(--ink2)}
.rvc{font-size:11.5px;color:var(--ink3)}

/* checkpoints */
.cps{padding:10px 10px 14px;position:relative}
.cps-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:12px;color:var(--ink3)}
.cp{position:relative;display:grid;grid-template-columns:22px 1fr;gap:0 4px;padding-bottom:10px}
.cp::before{content:"";position:absolute;left:10px;top:20px;bottom:-4px;width:2px;background:var(--line2)}
.cp:last-child::before{display:none}
.cp .nd{position:relative;z-index:1;width:12px;height:12px;margin:6px 0 0 5px;border-radius:50%;background:var(--bg2);border:2px solid var(--line3)}
.cp.now .nd{border-color:var(--ember);background:var(--ember);box-shadow:0 0 0 3px var(--ember-bg2);animation:pulse 1.6s ease-in-out infinite}
.cp.sel .nd{border-color:var(--ember);background:var(--ember)}
.cp .cd{border:1px solid var(--line);border-radius:var(--r3);background:var(--bg1);padding:7px 9px 8px;min-width:0}
.cp.sel .cd{border-color:var(--ember-line);background:linear-gradient(180deg,var(--ember-bg),transparent 70%),var(--bg1)}
.cp .cd:hover{border-color:var(--line3)}
.cp.sel .cd:hover{border-color:var(--ember)}
.cp .l1{display:flex;align-items:baseline;gap:8px}
.cp .id{font:700 12.5px var(--f-code);color:var(--ink)}
.cp .tm{font:11.5px var(--f-code);color:var(--ink3)}
.cp .fc{margin-left:auto;font-size:11.5px;color:var(--ink2)}
.cp .lb{margin:3px 0 6px;color:var(--ink2);font-size:12.5px}
.cp .fl{display:flex;flex-direction:column;gap:1px;margin-bottom:7px}
.cp .fl div{display:flex;align-items:center;gap:6px;font:11.5px var(--f-code);color:var(--ink3);height:18px}
.cp .fl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cp .acts{display:flex;gap:6px}
.cp.nosave .cd{opacity:.65}

/* ---------- center ---------- */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg0);position:relative}
#ruler{position:absolute;right:0;width:10px;z-index:8;pointer-events:none;background:var(--bg1);border-left:1px solid var(--line)}
#editor.hasr{margin-right:10px}
#ruler i{position:absolute;left:2px;width:6px;min-height:3px;border-radius:1px;background:var(--c,var(--ink3));opacity:.9;pointer-events:auto;cursor:pointer}
#ruler .vp{left:0;width:10px;background:rgba(255,255,255,.06);border-radius:0;pointer-events:none;border-top:1px solid var(--line3);border-bottom:1px solid var(--line3)}
#etabs{display:flex;align-items:stretch;height:34px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none}
#etabs::-webkit-scrollbar{display:none}
.et{position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 6px 0 11px;border-right:1px solid var(--line);color:var(--ink2);flex:none;max-width:220px;cursor:pointer}
.et::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c,transparent)}
.et:hover{background:var(--bg3);color:var(--ink)}
.et[aria-selected="true"]{background:var(--bg0);color:var(--ink);box-shadow:0 1px 0 var(--bg0)}
.et .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et.ghost .nm{font-style:italic;color:var(--warn)}
.et.ghost::before{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 9px)}
.et .x{width:18px;height:18px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);opacity:.0}
.et:hover .x,.et[aria-selected="true"] .x{opacity:1}
.et .x:hover{background:var(--bg5);color:var(--ink)}
.et .lv{width:7px;height:7px;border-radius:50%;background:var(--c);animation:pulse 1s ease-in-out infinite;flex:none}
.et .ah{color:var(--warn);font-weight:700}
#fhead{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;min-width:0}
#fhead .crumb{display:flex;align-items:center;gap:4px;min-width:60px;flex:1 1 auto;overflow:hidden;font-family:var(--f-code);font-size:12.5px;color:var(--ink3)}
#fhead .crumb b{color:var(--ink);font-weight:600}
#fhead .crumb .dir{flex:0 1 auto;min-width:0}
#fhead .crumb b{flex:none}
#fhead .stats{display:flex;align-items:center;gap:8px;flex:none}
#fhead .stl,#fhead .ctl{flex:none}
.chip.live{border-color:var(--c);color:var(--c);background:transparent}
.lvd{width:7px;height:7px;border-radius:50%;background:var(--c);animation:pulse 1s ease-in-out infinite}
#fhead .ctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
#editor{position:relative;flex:1 1 0;min-height:0;overflow:auto;background:var(--bg0);scrollbar-width:thin;scrollbar-color:var(--bg5) transparent;outline:none}

/* ---------- diff viewer ---------- */
.rows{display:block;width:max-content;min-width:100%;padding:0 0 28px;font:12.5px/20px var(--f-code);tab-size:4}
.r{display:flex;min-height:20px;position:relative}
.r .g{position:sticky;left:0;z-index:2;display:flex;flex:none;background:var(--bg0)}
.r .st{width:3px;flex:none;background:transparent}
.r .ln{width:40px;flex:none;text-align:right;padding-right:7px;color:var(--ink3);font-size:11.5px;user-select:none;font-variant-numeric:tabular-nums}
.r .sg{width:18px;flex:none;text-align:center;color:var(--ink3);user-select:none}
.r .cd{flex:1 0 auto;padding:0 18px 0 6px;white-space:pre;color:var(--s-id)}
.r.add{background:var(--add-bg)}
.r.add .g{background:linear-gradient(var(--add-bg),var(--add-bg)),var(--bg0)}
.r.add .st{background:var(--c,var(--add-ink))}
.r.add .sg,.r.add .ln.n{color:var(--add-ink)}
.r.del{background:var(--del-bg)}
.r.del .g{background:linear-gradient(var(--del-bg),var(--del-bg)),var(--bg0)}
.r.del .st{background:var(--c,var(--del-ink))}
.r.del .sg,.r.del .ln.o{color:var(--del-ink)}
.r.del .cd{color:var(--del-ink2)}
.r.nw{background:linear-gradient(var(--new-bg),var(--new-bg)),var(--add-bg)}
.r.nw .g{background:linear-gradient(var(--new-bg),var(--new-bg)),linear-gradient(var(--add-bg),var(--add-bg)),var(--bg0)}
.r.dimr .cd,.r.dimr .ln{opacity:.38}
.r.dimr .st{opacity:.5}
.r.hl-ag .st{filter:brightness(1.35)}
.r:hover{background-image:linear-gradient(rgba(255,255,255,.028),rgba(255,255,255,.028))}
.r.flash{animation:flashrow 1.6s ease-out}
.r.flash .st{animation:stripe-pulse 1.4s ease-out}
.r .gp{position:absolute;left:6px;top:2px;z-index:3;width:16px;height:16px;border-radius:3px;background:var(--ember);color:var(--ink-on-ember);font:700 13px/15px var(--f-ui);text-align:center;opacity:0;transform:scale(.8);transition:opacity .1s,transform .1s;padding:0}
.r:hover .gp,.r .gp:focus-visible{opacity:1;transform:none}
.r.reverted .cd{text-decoration:line-through;text-decoration-color:var(--err);opacity:.5}
.r.ghost{background:repeating-linear-gradient(135deg,rgba(224,175,104,.07) 0 7px,transparent 7px 14px)}
.r.ghost .g{background:var(--bg0)}
.r.ghost .st{background:repeating-linear-gradient(180deg,var(--c) 0 3px,transparent 3px 6px)}
.r.ghost .cd{opacity:.78}
.r.ghost .ln,.r.ghost .sg{color:var(--warn)}
.cd .t{white-space:pre}
.r .bl{position:sticky;right:0;flex:none;align-self:center;padding:0 14px 0 28px;font:500 10.5px/1 var(--f-code);color:var(--c);opacity:.62;pointer-events:none;white-space:nowrap}
.r:hover .bl{opacity:1}
.rows.wrapm .bl,.rows.splitm .bl{display:none}
@media (max-width:820px){.r .bl{display:none!important}}
/* syntax */
.cd .k{color:var(--s-kw)} .cd .s{color:var(--s-st)} .cd .n{color:var(--s-nu)} .cd .c{color:var(--s-cm);font-style:italic}
.cd .y{color:var(--s-ty)} .cd .f{color:var(--s-fn)} .cd .b{color:var(--s-bi)} .cd .p{color:var(--s-pr)} .cd .o{color:var(--s-op)} .cd .u{color:var(--s-pn)}
.wd{border-radius:2px;color:inherit}
.r.add .wd{background:var(--add-bg2)}
.r.del .wd{background:var(--del-bg2)}
.caret{display:inline-block;position:relative;width:2px;height:16px;background:var(--c);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.cflag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:3px;font:600 10.5px/16px var(--f-ui);background:var(--c);color:var(--ink-dark);vertical-align:1px;letter-spacing:.01em}
/* hunk header + folds */
.hh{display:flex;background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:28px}
.hh .hin{position:sticky;left:0;display:flex;align-items:center;gap:10px;width:var(--vw,100%);padding:0 10px 0 8px;font:12px/1 var(--f-code);color:var(--ink3);z-index:3;background:var(--bg2)}
.hh .hin .fn{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hh .hin .hs{flex:none;color:var(--s-pn)}
.hh .hacts{margin-left:auto;display:flex;gap:4px;flex:none}
.hh .btn{font-family:var(--f-ui)}
.hh.rev{background:var(--err-bg)}
.fold{display:flex;background:var(--bg1)}
.fold .fin{position:sticky;left:0;width:var(--vw,100%);display:flex;align-items:center;gap:8px;height:24px;padding:0 10px 0 52px;color:var(--ink3);font:12px var(--f-ui);z-index:3;background:var(--bg1);border:0;text-align:left}
.fold .fin:hover{color:var(--ink);background:var(--bg3)}
/* banners */
.bn{position:sticky;top:0;left:0;z-index:6;width:var(--vw,100%);display:flex;align-items:center;gap:10px;padding:5px 12px;font-size:12.5px;border-bottom:1px solid var(--line);background:var(--bg2)}
.bn.past{background:var(--past-bg);border-bottom:1px solid var(--ember-line);color:var(--ink)}
.bn.past b{color:var(--ember)}
.bn.pend{background:var(--pend-bg);border-bottom:1px dashed var(--ghost-line)}
.bn.live{background:var(--bg2)}
.bn .sp{flex:1}
/* inline notes + steer composer */
.note{display:flex;width:100%}
.note .nin{position:sticky;left:0;width:var(--vw,100%);padding:3px 14px 7px 70px}
.bub{position:relative;max-width:560px;padding:7px 10px 8px;border:1px solid var(--line2);border-radius:6px 6px 6px 2px;background:var(--bg2);font:12.5px/1.45 var(--f-ui);color:var(--ink)}
.bub .who{font-weight:600;color:var(--c);margin-right:6px}
.bub .tm{color:var(--ink3);font:11px var(--f-code)}
.bub.you{border-color:var(--ember-line);background:var(--you-bg)}
.bub .caret{height:13px;vertical-align:-2px}
.steer{display:flex;gap:8px;align-items:flex-start;max-width:560px;padding:8px;border:1px solid var(--ember-line);border-radius:6px;background:var(--you-bg)}
.steer textarea{flex:1;min-height:34px;resize:none;background:var(--bg0);border:1px solid var(--line2);border-radius:var(--r2);padding:6px 8px;font:12.5px/1.4 var(--f-ui);color:var(--ink)}
.steer textarea:focus-visible{outline-offset:0}
.steer .hint{font-size:11.5px;color:var(--ink3);margin-bottom:5px}
/* empty states */
.empty{height:100%;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink3);text-align:center;padding:24px;position:sticky;left:0;width:var(--vw,100%)}
.empty h3{margin:0;font-size:14px;color:var(--ink2);font-weight:600}
.empty p{margin:0;max-width:340px}
/* split mode */
.rows.splitm .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%}
.rows.splitm .h{display:flex;min-width:0}
.rows.splitm .h+.h{border-left:1px solid var(--line)}
.rows.splitm .g{position:relative}
.rows.splitm .cd{white-space:pre-wrap;overflow-wrap:anywhere;flex:1 1 0;min-width:0}
.rows.splitm .h.del{background:var(--del-bg)} .rows.splitm .h.del .g{background:linear-gradient(var(--del-bg),var(--del-bg)),var(--bg0)}
.rows.splitm .h.add{background:var(--add-bg)} .rows.splitm .h.add .g{background:linear-gradient(var(--add-bg),var(--add-bg)),var(--bg0)}
.rows.splitm .h.del .st{background:var(--c,var(--del-ink))} .rows.splitm .h.add .st{background:var(--c,var(--add-ink))}
.rows.splitm .h.del .sg,.rows.splitm .h.del .ln{color:var(--del-ink)}
.rows.splitm .h.add .sg,.rows.splitm .h.add .ln{color:var(--add-ink)}
.rows.splitm .h.void{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
.rows.splitm .h.add .wd{background:var(--add-bg2)} .rows.splitm .h.del .wd{background:var(--del-bg2)}
.rows.splitm .r.nw .h.add{background:linear-gradient(var(--new-bg),var(--new-bg)),var(--add-bg)}
.rows.splitm .hh,.rows.splitm .fold,.rows.splitm .note{display:flex}
.rows.splitm .r .gp{left:6px}
.rows.wrapm .cd{white-space:pre-wrap;overflow-wrap:anywhere;flex:1 1 0;min-width:0}
.rows.wrapm,.rows.splitm{width:100%}
/* plain viewer */
.plain .r .sg{display:none}
.followchip{position:sticky;left:calc(var(--vw,100%) - 150px);bottom:12px;float:right;margin-right:14px;z-index:7;height:26px;padding:0 11px;border-radius:13px;background:var(--ember);color:var(--ink-on-ember);font-weight:600;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;max-width:300px;padding:8px 10px;border:1px solid var(--line3);border-radius:var(--r3);background:var(--pop);box-shadow:0 8px 28px rgba(0,0,0,.5);font-size:12px;line-height:1.45;opacity:0;transform:translateY(3px);transition:opacity .08s,transform .08s}
#tip.on{opacity:1;transform:none}
#tip .tl{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
#tip .tl .sw{width:9px;height:9px}
#tip .tm{font:11.5px var(--f-code);color:var(--ink2);margin-top:3px}
#tip .th{color:var(--ink3);margin-top:3px;font-size:11.5px}

/* ---------- time-travel scrubber ---------- */
#scrub{overflow-x:clip;flex:none;background:var(--bg2);border-top:1px solid var(--line);padding:16px 14px 7px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 18px;align-items:start;position:relative;transition:background .25s,box-shadow .25s}
#scrub.past{background:var(--past-bg);box-shadow:inset 0 2px 0 var(--ember)}
.sc-l{display:flex;flex-direction:column;gap:1px;min-width:0;margin-top:-8px}
.sc-l .asof{font:700 15px/1.2 var(--f-code);color:var(--ink);display:flex;align-items:baseline;gap:7px}
.sc-l .asof small{font:500 11.5px var(--f-code);color:var(--ink3)}
#scrub.past .asof{color:var(--ember)}
.sc-l .sub{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-t{position:relative;height:50px;margin:0 22px;touch-action:none;cursor:pointer;user-select:none}
.sc-rail{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--bg5)}
.sc-seg{position:absolute;top:10px;height:4px;border-radius:2px;background:var(--c,var(--line3));opacity:.95}
.sc-seg.live{animation:pulse 1.4s ease-in-out infinite}
.sc-stop{position:absolute;top:0;transform:translateX(-50%);width:72px;display:flex;flex-direction:column;align-items:center;padding-top:6px;color:var(--ink3);cursor:pointer}
.sc-stop .dt{width:12px;height:12px;border-radius:50%;background:var(--bg2);border:2px solid var(--line3);margin-bottom:6px;transition:all .15s;position:relative;z-index:2}
.sc-stop.passed .dt{border-color:var(--ink3);background:var(--ink3)}
.sc-stop .lb{font:700 12px/1 var(--f-code);color:var(--ink2)}
.sc-stop .fc{display:none;font-size:10.5px;color:var(--ink3);margin-top:3px;white-space:nowrap}
.sc-stop[aria-checked="true"] .fc{display:block}
.sc-stop[aria-checked="true"] .lb{color:var(--ember)}
.sc-stop.now .dt{border-color:var(--ember);background:var(--ember);box-shadow:0 0 0 3px var(--ember-bg2);animation:pulse 1.6s ease-in-out infinite}
.sc-stop.nosave .dt{border-style:dashed;background:var(--bg2)}
.sc-thumb{position:absolute;top:-1px;width:20px;height:26px;margin-left:-10px;border-radius:5px;background:var(--ember);box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 3px var(--ember-bg2);z-index:3;display:flex;align-items:center;justify-content:center;gap:2px;cursor:grab;transition:left .22s var(--ease)}
.sc-thumb.drag{transition:none;cursor:grabbing;box-shadow:0 2px 14px rgba(0,0,0,.6),0 0 0 5px var(--ember-bg2)}
.sc-thumb i{width:2px;height:12px;background:rgba(27,15,6,.65);border-radius:1px}
.sc-ev{position:absolute;top:-15px;transform:translateX(-50%);font:12px/1 var(--f-code);z-index:1;cursor:help;padding:2px 3px}
.sc-r{display:flex;align-items:center;gap:6px}
.sc-b{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink3);min-width:0}
.sc-b .dl{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sc-b .dl b{font-weight:600;color:var(--ink)}

/* ---------- agent pane ---------- */
.agtabs{display:flex;align-items:stretch;height:38px;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;flex:none;overflow:hidden}
.agtabs button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink3);font-weight:500}
.agtabs button:hover{color:var(--ink)}
.agtabs button[aria-selected="true"]{color:var(--ink)}
.agtabs button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--ember)}
.agtabs .sp{flex:1}
.agtabs .tool{align-self:center;width:26px;height:26px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);padding:0}
.agtabs .tool:hover{background:var(--bg3);color:var(--ink)}
.agbody{flex:1;min-height:0;display:flex;flex-direction:column}
.agview{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:11px;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
.msg{display:grid;grid-template-columns:14px 1fr;gap:0 8px;font-size:13px;line-height:1.5}
.msg .mk{padding-top:5px;font-size:10px;color:var(--c,var(--ink3));text-align:center}
.msg .mh{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink3)}
.msg .mh b{font-weight:600;color:var(--c,var(--ink2))}
.msg .mh .t{font:11px var(--f-code)}
.msg .mb{color:var(--ink);overflow-wrap:anywhere}
#qslot{flex:0 1 auto;min-height:0;overflow-y:auto;max-height:66%;scrollbar-width:thin}
.msg.you .mb.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.msg.you .mb{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r2);padding:7px 9px;font-family:var(--f-code);font-size:12.5px;line-height:1.45;color:var(--ink)}
.msg.you .mk{color:var(--ember);font-size:12px;padding-top:3px}
.msg.sys{color:var(--ink3);font-size:12.5px}
.msg.sys .mb{color:var(--ink2)}
.toolrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tl{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r1);background:var(--bg3);border:1px solid var(--line);font:11.5px var(--f-code);color:var(--ink2)}
.tl .ok{color:var(--ok)} .tl b{font-weight:600;color:var(--info)}
.wfeed{border:1px solid var(--line);border-radius:var(--r2);background:var(--bg1);overflow:hidden}
.wfeed summary{list-style:none;display:flex;align-items:center;gap:7px;height:26px;padding:0 9px;font-size:11.5px;color:var(--ink3);cursor:pointer}
.wfeed summary::-webkit-details-marker{display:none}
.wfeed summary:hover{color:var(--ink)}
.wfeed[open] summary{border-bottom:1px solid var(--line)}
.wfeed summary .ch{transition:transform .12s}
.wfeed[open] summary .ch{transform:rotate(90deg)}
.wl{display:grid;grid-template-columns:54px 40px 1fr;gap:0 6px;align-items:baseline;padding:2px 9px;font:11.5px/1.5 var(--f-code);color:var(--ink2)}
.wl .tm{color:var(--ink3)} .wl .a{color:var(--c);font-weight:600}
.wl .vb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .vb .pl{color:var(--add-ink)}
.wl:hover{background:var(--bg3)}
.wl .vb a{color:var(--info);text-decoration:none;cursor:pointer}
.wl .vb a:hover{text-decoration:underline}
.wfeed .wls{padding:3px 0 4px}
.mail{padding:7px 9px;border:1px dashed var(--line2);border-radius:var(--r2);font-size:12.5px;color:var(--ink2);background:var(--bg1)}
.mail .ml{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.mail .mq{color:var(--ink);font-style:normal;overflow-wrap:anywhere}
/* status line + composer */
.runline{flex:none;display:flex;align-items:center;gap:9px;padding:5px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);min-height:28px;overflow:hidden;white-space:nowrap;background:var(--bg2)}
.runline .sp{flex:1}
.rlt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.rlt .t2{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.rlt .t2 kbd{margin:0 1px}
.runline .t{overflow:hidden;text-overflow:ellipsis}
.runline kbd{height:16px;font-size:10px}
.spn{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg5);border-top-color:var(--a-mgr);animation:spin .9s linear infinite;flex:none}
.queued{padding:3px 14px;font:12px var(--f-code);color:var(--ink3);background:var(--bg2)}
.comp{flex:none;padding:8px 12px 6px;background:var(--bg2);position:relative}
.comp .box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);border-radius:var(--r3);background:var(--bg1);padding:6px 6px 6px 10px;transition:border-color .12s}
.comp .box:focus-within{border-color:var(--ember-line);box-shadow:0 0 0 3px rgba(255,158,100,.08)}
.comp .pr{color:var(--a-mgr);font:600 14px/24px var(--f-code);flex:none}
.comp textarea{flex:1;min-width:0;max-height:120px;min-height:24px;resize:none;background:transparent;border:0;outline:none;font:13px/24px var(--f-ui);color:var(--ink);padding:0;overflow-y:auto}
.comp textarea::placeholder{color:var(--ink3)}
.comp .send{width:26px;height:26px;border-radius:var(--r2);background:var(--bg4);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.comp .send:hover{background:var(--ember);color:var(--ink-on-ember)}
.cfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:5px 2px 0;font:11px/1.5 var(--f-code);color:var(--ink3);white-space:nowrap}
.cfoot span{overflow:hidden;text-overflow:ellipsis}
.chipx{display:inline-flex;align-items:center;gap:5px;padding:0 6px;height:20px;border:1px solid var(--line2);border-radius:var(--r1);background:var(--bg3);font:11.5px var(--f-code);color:var(--ink2);margin-right:6px}
/* slash menu (inline) */
.slashm{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);max-height:300px;overflow:auto;background:var(--pop);border:1px solid var(--line3);border-radius:var(--r3);box-shadow:0 10px 36px rgba(0,0,0,.55);padding:4px;z-index:60}
.cmd{display:flex;align-items:center;gap:10px;min-height:30px;padding:3px 9px;border-radius:var(--r2);color:var(--ink2);cursor:pointer;width:100%}
.cmd .cn{font:500 12.5px var(--f-code);color:var(--ink);flex:none}
.cmd .ca{font:12px var(--f-code);color:var(--ink3);flex:none}
.cmd .cdsc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3);font-size:12px}
.cmd[aria-selected="true"]{background:var(--bg5);color:var(--ink)}
.cmd[aria-selected="true"] .cdsc{color:var(--ink2)}
.cmd .tagc{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:1px 5px;flex:none}
.cmd .tagc.live{color:var(--ember);border-color:var(--ember-line)}

/* ---------- the question (diff-aware) ---------- */
.q{flex:none;margin:0 10px 8px;border:1px solid var(--ember-line);border-radius:var(--r3);background:linear-gradient(180deg,var(--q-bg) 0,var(--q-bg2) 120px,var(--bg1) 100%);box-shadow:0 8px 30px -8px rgba(255,140,60,.28);overflow:hidden;animation:qin .35s var(--ease)}
@keyframes qin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.q-h{display:flex;align-items:center;gap:8px;padding:8px 11px 6px}
.q-h .qi{width:22px;height:22px;border-radius:50%;background:var(--ember);color:var(--ink-on-ember);display:inline-flex;align-items:center;justify-content:center;font:800 13px var(--f-code);flex:none}
.q-h .qt{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:1.3}
.q-h .qt small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.q-h .qa{color:var(--a-fe1)}
.q-h .wt{font:11.5px var(--f-code);color:var(--ember2);white-space:nowrap}
.q-cmd{margin:0 11px;padding:7px 9px;border-radius:var(--r2);background:var(--bg0);border:1px solid var(--line2);font:12.5px/1.45 var(--f-code);color:var(--ink);overflow-x:auto;white-space:nowrap}
.q-cmd .pm2{color:var(--ember)}
.q-cmd small{color:var(--ink3);margin-left:8px;font-size:11.5px}
.q-scope{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 11px 0;font-size:11.5px;color:var(--ink3)}
.q-scope b{font-weight:500;color:var(--ink2)}
.q-diff{margin:7px 11px 0;border:1px dashed var(--ghost-line);border-radius:var(--r2);background:var(--bg0);overflow:hidden}
.q-diff .qd-h{display:flex;align-items:center;gap:7px;padding:4px 8px;font:11.5px var(--f-code);color:var(--ink2);background:rgba(224,175,104,.07);border-bottom:1px dashed var(--ghost-line)}
.q-diff .qd-h .sp{flex:1}
.q-diff .dl{display:flex;font:12px/18px var(--f-code);padding:0 8px;white-space:pre;overflow:hidden}
.q-diff .dl.add{background:var(--add-bg);color:var(--add-ink2)}
.q-diff .dl.del{background:var(--del-bg);color:var(--del-ink2)}
.q-diff .dl.ctx{color:var(--ink3)}
.q-diff .dl i{font-style:normal;width:14px;flex:none}
.q-why{margin:7px 11px 0;font-size:12px;line-height:1.45;color:var(--ink2)}
.q-why b{color:var(--ink);font-weight:600}
.q-ch{display:flex;flex-direction:column;gap:4px;padding:8px 11px 6px}
.qb{display:flex;align-items:center;gap:9px;min-height:30px;padding:4px 10px 4px 6px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg3);color:var(--ink);width:100%;font-size:12.5px;line-height:1.3;transition:background .12s,border-color .12s,opacity .2s}
.qb .kbd{flex:none;height:20px;min-width:20px;font-size:11.5px}
.qb:hover:not([aria-disabled="true"]){background:var(--bg5);border-color:var(--ember-line)}
.qb.no{color:var(--ink2)}
.qb[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.qb code{font-size:11.5px;color:var(--ember2)}
.qb .esc{margin-left:auto;color:var(--ink3);font:11px var(--f-code);flex:none;padding-left:6px}
.q-m{display:flex;align-items:center;gap:9px;padding:0 11px 9px;font-size:11.5px;color:var(--ink3)}
.q-m .bar{flex:0 0 74px;height:4px;border-radius:2px;background:var(--bg5);overflow:hidden}
.q-m .bar i{display:block;height:100%;width:0;background:var(--ember);border-radius:2px}
.q.ready .q-m .bar i{background:var(--ok)}
.q.ready .q-m{color:var(--ink2)}
.q-m .st{flex:1;min-width:0}
.q-more{padding:0 11px 8px;font-size:11.5px;color:var(--ink3)}
.q.done{border-color:var(--line2);box-shadow:none;background:var(--bg1);animation:none}
.q-no{margin:0 11px 10px;display:flex;flex-direction:column;gap:6px}
.q-no textarea{min-height:56px;resize:vertical;background:var(--bg0);border:1px solid var(--ember-line);border-radius:var(--r2);padding:7px 9px;font:12.5px/1.45 var(--f-ui);color:var(--ink)}
.q-no .row{display:flex;gap:6px;justify-content:flex-end}

/* ---------- team ---------- */
.team{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
.cap{display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:12px;color:var(--ink2);white-space:nowrap}
.cap b{color:var(--ink);font-weight:600}
.capdots{display:inline-flex;gap:3px}
.capdots i{width:9px;height:14px;border-radius:2px;background:var(--bg5)}
.capdots i.on{background:var(--c)}
.capdots i.st{background:var(--bg5);border:1px solid var(--c);background:transparent}
.ags{display:flex;flex-direction:column;gap:5px}
.ac{position:relative;display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:7px 10px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg1);cursor:pointer;overflow:hidden;text-align:left;width:100%}
.ac:hover{border-color:var(--line3);background:var(--bg3)}
.ac[aria-pressed="true"]{border-color:var(--c);background:var(--bg3)}

.ac .l1{display:flex;align-items:center;gap:7px;min-width:0}
.ac .id{font:700 12.5px var(--f-code);color:var(--c)}
.ac .rl{font-size:11.5px;color:var(--ink3)}
.stt{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-code);color:var(--ink2);height:17px;padding:0 5px;border-radius:3px;background:var(--bg3)}
.stt[data-s="ask"]{background:var(--warn-bg);color:var(--warn)}
.stt[data-s="edit"]{color:var(--a-be1)}
.stt[data-s="tool"]{color:var(--ok)}
.stt[data-s="think"]{color:var(--a-mgr)}
.stt[data-s="wait"]{color:var(--ember2)}
.stt[data-s="done"]{color:var(--a-sc)}
.stt[data-s="stuck"]{background:var(--err-bg);color:var(--err)}
.ac .r1{display:flex;align-items:center;gap:8px;font:11.5px var(--f-code);color:var(--ink3);justify-content:flex-end}
.ac .dg{grid-column:1/-1;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .sc{grid-column:1/-1;display:flex;gap:8px;align-items:center;font:11px var(--f-code);color:var(--ink3);margin-top:2px;overflow:hidden;white-space:nowrap}
.ac .sc .tk{color:var(--c)}
.gantt{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex;background:var(--bg3)}
.gantt i{display:block;height:100%}
.gantt i.k-think{background:var(--a-mgr)} .gantt i.k-tool{background:var(--ok)} .gantt i.k-edit{background:var(--c)} .gantt i.k-wait{background:var(--ember2);opacity:.7} .gantt i.k-ask{background:var(--warn)} .gantt i.k-idle{background:transparent} .gantt i.k-done{background:var(--bg5)}
.hit{font-weight:600}
.hit.lo{color:var(--err)} .hit.md{color:var(--warn)} .hit.hi{color:var(--ok)}
.sect{margin:4px 4px 0;display:flex;align-items:center;gap:8px}
.sect .micro{flex:none}
.sect::after{content:"";height:1px;background:var(--line);flex:1}
.maild{display:flex;flex-direction:column;gap:4px}
/* ---------- plan ---------- */
.plan{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
.goalbox{border:1px solid var(--line2);border-radius:var(--r3);background:var(--bg1);padding:10px 12px}
.goalbox .gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.goalbox .gt{font:12.5px/1.5 var(--f-code);color:var(--ink)}
.steps{display:flex;flex-direction:column}
.stp{position:relative;display:grid;grid-template-columns:22px 1fr;gap:0 8px;padding:0 0 12px}
.stp::before{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:1px;background:var(--line2)}
.stp:last-child::before{display:none}
.stp .sn{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line3);display:inline-flex;align-items:center;justify-content:center;font:600 11px var(--f-code);color:var(--ink3);background:var(--bg2);position:relative;z-index:1}
.stp[data-s="done"] .sn{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.stp[data-s="ver"] .sn,.stp[data-s="edit"] .sn{border-color:var(--a-be1);color:var(--a-be1)}
.stp[data-s="ask"] .sn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.stp .stt2{font-weight:500;color:var(--ink);line-height:1.35}
.stp[data-s="pend"] .stt2,.stp[data-s="queue"] .stt2{color:var(--ink2)}
.stp .sst{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.verdict{border:1px solid var(--line2);border-radius:var(--r3);padding:10px 12px;background:var(--bg1);font-size:12.5px;color:var(--ink2);line-height:1.5}
.verdict.met{border-color:rgba(158,206,106,.5);background:var(--ok-bg)}
.verdict .vh{display:flex;gap:8px;align-items:center;margin-bottom:4px;color:var(--ink)}
.verdict q{quotes:none;font-style:italic;color:var(--ink)}

/* ---------- bottom panel ---------- */
#bottom{flex:none;height:var(--bt-h);min-height:34px;display:flex;flex-direction:column;background:var(--bg2);border-top:1px solid var(--line);min-width:0}
#bottom.collapsed{height:34px!important}
.bttabs{display:flex;align-items:stretch;height:33px;padding:0 6px;border-bottom:1px solid var(--line);flex:none;gap:2px;overflow-x:auto;scrollbar-width:none}
.bttabs::-webkit-scrollbar{display:none}
.bttabs button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink3);font-weight:500;flex:none}
.bttabs button:hover{color:var(--ink)}
.bttabs button[aria-selected="true"]{color:var(--ink)}
.bttabs button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--ember)}
.bttabs .sp{flex:1}
.bttabs .tool{align-self:center;width:24px;height:24px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);padding:0;flex:none}
.bttabs .tool:hover{background:var(--bg3);color:var(--ink)}
.bttabs .pill.flash,.pill.flash{animation:pulse .5s ease-in-out 4}
#bottom.collapsed .btbody{display:none}
.btbody{flex:1;min-height:0;position:relative;background:var(--bg2)}
.bp{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
/* verify */
.vf{display:grid;grid-template-columns:minmax(168px,34%) minmax(0,1fr);height:100%}
.vf-l{border-right:1px solid var(--line);overflow:auto;padding:4px 0}
.vr{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:0 7px;min-height:30px;padding:4px 10px 4px 10px;cursor:pointer;width:100%;text-align:left;position:relative}
.vr:hover{background:var(--bg3)}
.vr[aria-selected="true"]{background:var(--bg4)}
.vr .own{position:absolute;left:0;top:3px;bottom:3px;width:3px;background:var(--c);border-radius:0 2px 2px 0}
.vr .tid{font:700 11.5px var(--f-code);color:var(--ink)}
.vr .cm{font:11px var(--f-code);color:var(--ink3);grid-column:2/4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr .tt{font:11.5px var(--f-code);color:var(--ink2)}
.vf-r{padding:8px 14px 12px;overflow:auto;font:12px/1.55 var(--f-code);color:var(--ink2)}
.vf-r .cmdl{color:var(--ink);margin-bottom:6px;display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.vf-r .cmdl .pr{color:var(--a-mgr)}
.vf-r .ok{color:var(--ok)} .vf-r .okl{color:var(--ok);font-weight:600}
.vf-r .bad{color:var(--err)}
.vf-r .dm{color:var(--ink3)}
.vf-r .tm{color:var(--ink3);white-space:nowrap;flex:none}
.tl-steps{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px;font:12px var(--f-ui)}
.tl-steps span{display:inline-flex;align-items:center;gap:5px;min-height:22px;white-space:nowrap;padding:0 8px;border-radius:var(--r1);background:var(--bg3);color:var(--ink2);border:1px solid var(--line)}
.tl-steps span.on{color:var(--ember);border-color:var(--ember-line);background:var(--ember-bg)}
.tl-steps span.ok{color:var(--ok);border-color:rgba(158,206,106,.3)}
/* merge queue (panel) */
.mqp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);height:100%}
.mqp>div{padding:10px 14px;overflow:auto}
.mqp>div+div{border-left:1px solid var(--line)}
.mqhead{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ember-line);border-radius:var(--r3);background:var(--ember-bg);font:12.5px var(--f-code);color:var(--ink);flex-wrap:wrap}
.mqhead .qh{color:var(--ember);font-weight:700}
.mqstats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font:600 17px var(--f-code);color:var(--ink)}
.stat span{font-size:11px;color:var(--ink3)}
.mlist{display:flex;flex-direction:column;gap:2px}
.mi{display:flex;align-items:center;gap:8px;height:26px;font-size:12.5px;color:var(--ink2)}
.mi .tid{font:700 11.5px var(--f-code);color:var(--ink);width:24px}
.mi .own{width:3px;height:16px;border-radius:2px;background:var(--c)}
.mi .tt{flex:1;min-width:0}
/* log */
.logp{font:12px/1.55 var(--f-code);padding:4px 0 8px}
.lgr{display:grid;grid-template-columns:62px 42px 18px minmax(0,1fr);gap:0 8px;padding:1px 12px;color:var(--ink2);align-items:baseline}
.lgr:hover{background:var(--bg3)}
.lgr .tm{color:var(--ink3)} .lgr .a{color:var(--c);font-weight:600}
.lgr .tx{overflow-wrap:anywhere;color:var(--ink2)}
.lgr .tx b{color:var(--ink);font-weight:500}
.lgr .tx .pl{color:var(--add-ink)}
.lgr.err .tx{color:var(--err)} .lgr.err .gl{color:var(--err)}
.lgr.warn .tx{color:var(--warn)}
.lgr.you .tx{color:var(--ink)}
.lgr.new{animation:flashrow 1.2s ease-out}
.lgr.dimlg{opacity:.35}
.logbar{position:sticky;top:0;z-index:2;display:flex;gap:5px;align-items:center;padding:5px 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-family:var(--f-ui)}
.logbar button{height:20px;padding:0 7px;border-radius:3px;border:1px solid var(--line2);font:500 11px var(--f-code);color:var(--ink2);background:var(--bg1)}
.logbar button[aria-pressed="true"]{border-color:var(--c,var(--ember));color:var(--ink);background:var(--bg4)}
/* cache */
.cachep{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);height:100%}
.cachep>div{padding:9px 14px;overflow:auto}
.cachep>div+div{border-left:1px solid var(--line)}
.hr{display:grid;grid-template-columns:42px 1fr 36px;align-items:center;gap:8px;height:24px;font:11.5px var(--f-code)}
.hr .id{color:var(--c);font-weight:700}
.spark{display:flex;align-items:flex-end;gap:2px;height:16px}
.spark i{display:block;width:100%;max-width:14px;flex:1;background:var(--ok);border-radius:1px 1px 0 0;min-height:1px}
.spark i.md{background:var(--warn)} .spark i.lo{background:var(--err)}
.anom{border:1px solid rgba(247,118,142,.45);border-radius:var(--r3);background:var(--err-bg);padding:9px 11px;font-size:12.5px;line-height:1.5}
.anom .ah{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--err);margin-bottom:3px}
.anom code{color:var(--ink)}
.prefix{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:5px 0 3px;background:var(--bg5)}
.prefix i{display:block;height:100%}
.prefix.flash{animation:pfl .5s ease-in-out 4}
@keyframes pfl{50%{filter:hue-rotate(160deg) saturate(2)}}
.prefix.brk i{background:var(--err)!important;opacity:.8}
/* problems */
.prob{display:grid;grid-template-columns:20px 1fr auto;gap:0 8px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.prob .pt{color:var(--ink)} .prob .pd{color:var(--ink3);font-size:12px;margin-top:1px}
.prob .pw{font:11.5px var(--f-code);color:var(--ink3)}
.probz{padding:30px;text-align:center;color:var(--ink3)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;background:rgba(7,7,9,.64);opacity:0;transition:opacity .14s}
.scrim.on{opacity:1}
.dlg{width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line3);border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);transform:translateY(8px) scale(.99);transition:transform .16s var(--ease);outline:none}
.scrim.on .dlg{transform:none}
.dlg.wide{width:min(1040px,100%)}
.dlg.palette{width:min(660px,100%)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:15px;font-weight:600}
.dh .ds{color:var(--ink3);font-size:12.5px;margin-top:2px}
.dh .btn{margin-left:auto;flex:none}
.db{padding:14px 16px;overflow:auto;min-height:0}
.df{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);color:var(--ink3);font-size:12px}
.df .btn:last-child{margin-left:auto}
.df .sp+.btn{margin-left:0}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}
.fld input,.fld textarea{background:var(--bg0);border:1px solid var(--line2);border-radius:var(--r2);padding:7px 9px;color:var(--ink);font:13px/1.45 var(--f-ui)}
.fld textarea{font-family:var(--f-code);font-size:12.5px;resize:vertical}
.fld input:focus-visible,.fld textarea:focus-visible{outline-offset:0}
.stubbox{border:1px solid var(--line);border-radius:var(--r3);background:var(--bg1);padding:12px 14px}
.stubbox pre{margin:4px 0 0;white-space:pre-wrap;color:var(--ink);font-size:12.5px}
.stubbox p{margin:4px 0 0;color:var(--ink2);line-height:1.55}
pre.code{background:var(--bg0);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;font-size:12.5px;line-height:1.5;overflow:auto;white-space:pre;color:var(--ink2)}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px 24px}
.helpgrid .micro{margin-bottom:5px}
.hl{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:10px;padding:3px 0;font-size:12.5px;color:var(--ink2);align-items:baseline}
.hl code{color:var(--ink);font-size:12px}
.danger{padding:11px 13px;border:1px solid rgba(247,118,142,.5);border-radius:var(--r3);background:var(--err-bg);color:var(--ink);font-size:13px;line-height:1.5}
.danger b{color:var(--err)}
.modes{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg1);width:100%;font-size:12.5px;text-align:left}
.mrow:hover{border-color:var(--line3);background:var(--bg3)}
.mrow b{min-width:96px;font-weight:600}
.mrow .mdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line3);flex:none}
.mrow[aria-pressed="true"],.mrow[aria-selected="true"]{border-color:var(--ember-line);background:var(--ember-bg)}
.mrow[aria-pressed="true"] .mdot{background:var(--ember);border-color:var(--ember)}
.mrow.danger{border-color:rgba(247,118,142,.4);background:var(--err-bg)}
.mrow.danger .mdot{border-color:var(--err)}
.mpick .mrow .star{color:var(--ember2);width:16px;flex:none}
.preview{display:flex;flex-direction:column;gap:2px}
.pvr{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto auto auto;gap:0 10px;align-items:center;min-height:30px;padding:3px 10px 3px 14px;border-radius:var(--r2);background:var(--bg1);font-size:12.5px}
.pvr .own{position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:0 2px 2px 0;background:var(--c)}
.pvr .tid{font:700 12px var(--f-code)}
.pvr:has(.tid){grid-template-columns:30px minmax(0,1fr) auto auto}
.pvt{margin-top:10px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.moreg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.lgb{height:52px;justify-content:flex-start;padding:0 14px;font-size:14px;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:12.5px}
.kv span{color:var(--ink3)} .kv b{font-weight:500;color:var(--ink);text-align:left}
/* palette */
.pal{display:flex;flex-direction:column;min-height:0;max-height:70vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);color:var(--ink3);flex:none}
.pal-in input{flex:1;background:none;border:0;outline:none;font-size:15px;color:var(--ink);min-width:0}
.pal-list{flex:1;overflow:auto;padding:6px 6px 8px;min-height:120px;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent}
.pal-list .pg{padding:10px 10px 4px}
.pal-f{display:flex;align-items:center;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);flex:none}
.pal-f kbd{margin-right:4px}
.pal-f .sp{flex:1}
/* toasts */
#toasts{position:fixed;left:16px;bottom:calc(var(--sb-h) + 14px);display:flex;flex-direction:column;gap:8px;z-index:150;width:min(430px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;padding:10px 13px;background:var(--pop);border:1px solid var(--line3);border-radius:var(--r3);box-shadow:0 10px 36px rgba(0,0,0,.5);font-size:12.5px;line-height:1.5;color:var(--ink);transform:translateY(8px);opacity:0;transition:all .2s var(--ease)}
.toast.on{transform:none;opacity:1}
.toast b{font-weight:600}
.toast .btn{vertical-align:baseline;margin-left:4px}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.shake{animation:shake .3s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

/* ---------- screens ---------- */
.scr{max-width:1320px;margin:0 auto;padding:22px 28px 48px}
.sh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sh h1{margin:0 0 3px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.sh .sub{margin:0;color:var(--ink3);max-width:720px;line-height:1.5;font-size:13px}
.sh .sub .mono,.sub .mono{color:var(--ink2);font-size:12px}
.chip.lg{height:30px;padding:0 12px;font-size:12.5px;flex:none;max-width:100%}
.sh>div:first-child{flex:1 1 380px;min-width:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3);padding:14px 16px;margin-bottom:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0;flex-wrap:wrap}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch .dim{font-size:12px}
.ch>.dim:last-child:not(:only-child){margin-left:auto}
.mono{font-family:var(--f-code)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font:600 10.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:0 10px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.id{font:700 12.5px var(--f-code);color:var(--c)}
.tbl .num{text-align:right}
.tbl th:has(+ th){white-space:nowrap}
.star{font-size:15px;color:var(--ink3)} .star[aria-pressed="true"]{color:var(--ember2)}
.filters{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters .fld input{width:220px;height:28px}
.btn[aria-pressed="true"]{border-color:var(--ember-line);color:var(--ember);background:var(--ember-bg)}
/* merge queue screen */
.qgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:14px;align-items:start}
.qgrid .card{margin:0}
.qlist{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.ql{position:relative;display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;gap:0 7px;align-items:center;min-height:32px;padding:3px 10px 3px 12px;border-radius:var(--r2);width:100%;color:var(--ink2)}
.ql:hover{background:var(--bg3)}
.ql[aria-selected="true"]{background:var(--bg4);color:var(--ink)}
.ql .own{position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 2px 2px 0;background:var(--c)}
.ql .tid,.tid{font:700 11.5px var(--f-code);color:var(--ink)}
.ql .ag{font:11.5px var(--f-code);color:var(--c)}
.qd .ch h2{font-size:15px}
.line5{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 20px}
.line5::before{content:"";position:absolute;left:10%;right:10%;top:12px;height:2px;background:var(--line2)}
.line5 .fill{position:absolute;left:10%;top:12px;height:2px;width:calc(80% * var(--p));background:var(--ok)}
.nd5{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:11.5px;color:var(--ink3);line-height:1.35;padding:0 4px}

/* ---- the code ----
   leading char: ' ' context, '+' added, '-' removed. Trailing ⟦cp|agent⟧ says when and by whom the line landed. ‵ is a backtick. */
function parseRows(src, ag, defCp) {
  const lines = src.split('\n');
  if (lines[0] === '') lines.shift();
  if (lines[lines.length - 1] === '') lines.pop();
  return lines.map(l => {
    const c = l[0], k = c === '+' ? 'add' : c === '-' ? 'del' : 'ctx';
    let t = c === undefined ? '' : l.slice(1), cp = null, a = null;
    const m = t.match(/⟦([^⟧]*)⟧$/);
    if (m) { t = t.slice(0, m.index); const p = m[1].split('|'); cp = p[0] || null; a = p[1] || null; }
    t = t.replace(/‵/g, '`');
    if (k !== 'ctx') { cp = cp || defCp || 'c07'; a = a || ag; }
    return {k, t, cp, ag: a};
  });
}
