<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20role='img'%20aria-label='Sleipnir'%3E%3Ctitle%3ESleipnir%3C/title%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2324232e'/%3E%3Crect%20x='13.5'%20y='35'%20width='3.4'%20height='14'%20rx='1.7'%20fill='%23bb9af7'/%3E%3Crect%20x='17.6'%20y='35'%20width='3.4'%20height='16'%20rx='1.7'%20fill='%237aa2f7'/%3E%3Crect%20x='21.7'%20y='35'%20width='3.4'%20height='12'%20rx='1.7'%20fill='%237aa2f7'/%3E%3Crect%20x='25.8'%20y='35'%20width='3.4'%20height='16'%20rx='1.7'%20fill='%237dcfff'/%3E%3Crect%20x='29.9'%20y='35'%20width='3.4'%20height='14'%20rx='1.7'%20fill='%237dcfff'/%3E%3Crect%20x='34.0'%20y='35'%20width='3.4'%20height='16'%20rx='1.7'%20fill='%239ece6a'/%3E%3Crect%20x='38.1'%20y='35'%20width='3.4'%20height='12'%20rx='1.7'%20fill='%23e0af68'/%3E%3Crect%20x='42.2'%20y='35'%20width='3.4'%20height='15'%20rx='1.7'%20fill='%23ff9e64'/%3E%3Cpath%20d='M13%2028%20C11%2023%2014%2020%2020%2021%20L40%2021%20C45%2021%2047%2019%2048%2014%20L46%209%20L51%209%20L53%206%20L55%2010%20L61%2016%20C62%2019%2060%2022%2057%2021%20L53%2020%20L50%2026%20C48%2033%2042%2037%2036%2037%20L22%2037%20C16%2037%2013%2033%2013%2028%20Z'%20fill='%23e9e7f5'/%3E%3Cpath%20d='M13%2026%20C8%2026%205%2030%205%2035%20C8%2032%2010%2031%2013%2032%20Z'%20fill='%23b79cf9'/%3E%3Cpath%20d='M44%2013%20L41%2019%20M47%2012%20L44%2019'%20stroke='%23b79cf9'%20stroke-width='2'%20stroke-linecap='round'/%3E%3Ccircle%20cx='54'%20cy='13'%20r='1.6'%20fill='%2324232e'/%3E%3C/svg%3E">
<style>
/* ───────── Sleipnir Longhouse · tokens ───────── */
:root{
  color-scheme:light;
  --font-ui:"Figtree","Instrument Sans","Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;

  /* main surface (light) */
  --bg:#fbfbfd; --surface:#ffffff; --surface-2:#f5f5fa; --surface-3:#ebedf5; --hover:#f4f4f9;
  --line:#e5e6ef; --line-2:#d5d7e5;
  --ink:#1f1e2b; --ink-2:#4a4b5f; --ink-3:#66687f;
  --accent:#7048e8; --accent-2:#5a35cc; --accent-soft:#f0ebfe; --accent-line:#d8cdfa; --on-accent:#ffffff;
  --focus:#7048e8; --focus-side:#c9b8ff;

  /* the eight legs: vivid role colours (fills, dots, bars) */
  --c-mgr:#bb9af7; --c-be:#7aa2f7; --c-fe:#7dcfff; --c-sc:#73daca; --c-ts:#9ece6a; --c-wr:#e0af68; --c-rv:#ff9e64; --c-err:#f7768e;
  /* the same hues as soft fills and as readable ink on a light surface */
  --s-mgr:#f1ebfe; --s-be:#e7eefe; --s-fe:#def3fc; --s-sc:#dcf5f0; --s-ts:#eaf5db; --s-wr:#fbf0d6; --s-rv:#fee8d9; --s-err:#fde6ea;
  --i-mgr:#6336c8; --i-be:#2b57c8; --i-fe:#06668a; --i-sc:#0c6b5c; --i-ts:#3f6e0a; --i-wr:#7a5200; --i-rv:#9f4810; --i-err:#b32342;

  /* semantic */
  --ok:#3b7710; --ok-bg:#ebf6dc; --ok-dot:#58a31c;
  --warn:#8a5a00; --warn-bg:#fcf1d4; --warn-dot:#e0af68;
  --err:#b32342; --err-bg:#fde6ea; --err-dot:#f7768e;
  --info:#06668a; --info-bg:#def3fc;
  --done-dot:#2fb7a2;
  --idle-dot:#a4a6bb;
  --line-3:#c4c7da; --err-line:#efc3cc; --err-line-2:#f3c4ce; --err-line-3:#f0b6c2; --err-track:#f6cdd5; --warn-line:#f0dca0; --warn-track:#ecd7a0;
  --on-warn:#2a1d00; --on-err:#33060f; --on-done:#05342c;
  --side-edge:rgba(255,255,255,.04); --side-line-hi:#55536c; --side-scroll:#4a495f; --side-ink-act:#e3dbff; --side-ink-act-2:#d8d0fa;
  --chip-danger-a:#5a1f30; --chip-danger-b:#4a1927; --chip-danger-ink:#ffd6de; --chip-danger-line:#8a3047;
  --chip-plan-bg:#17384a; --chip-plan-ink:#bfeaff; --chip-edit-bg:#3f3213; --chip-edit-ink:#ffe3a6;
  --hs-bg:#2d2c3a; --hs-ink:#e6e4f4; --sh-knob:0 1px 3px rgba(0,0,0,.25);
  --danger-hatch:#fbd5dc;
  --logo-body:#e9e7f5; --logo-mane:#b79cf9;

  /* chrome (dark, split-tone) */
  --conn-bg:#2a3322; --conn-line:#40562c; --conn-glow:#3b5524;
  --rail:#1b1a24; --side:#24232e; --side-2:#2d2c3a; --side-hover:#30303f; --side-active:#4a3d8f;
  --side-line:#383749; --side-ink:#eeedf8; --side-ink-2:#bebdd5; --side-ink-3:#9a99b6; --side-field:#2f2e3c;

  /* code */
  --code-bg:#f6f6fb; --code-ink:#272636;
  --syn-kw:#7048e8; --syn-str:#2f7a39; --syn-com:#5d5f77; --syn-num:#a9500d; --syn-fn:#2b57c8;
  --del-bg:#fdecef; --del-ink:#a32a44;

  --sh-1:0 1px 2px rgba(31,30,43,.07),0 0 0 1px rgba(31,30,43,.02);
  --sh-2:0 6px 20px rgba(31,30,43,.12),0 2px 6px rgba(31,30,43,.06);
  --sh-3:0 24px 70px rgba(21,20,31,.30),0 6px 18px rgba(21,20,31,.14);
  --scrim:rgba(21,20,31,.46);
  --ring:var(--bg);

  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:14px;
  --side-w:264px; --panel-w:380px; --rail-w:56px; --head-h:56px;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent-2)}
code,kbd,samp,pre{font-family:var(--font-mono)}
svg{display:block;flex:none}
.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i .f{fill:currentColor;stroke:none}
.hm-t,.hm-e{fill:var(--term-bg)}.hm-b{fill:var(--logo-body)}.hm-m{fill:var(--logo-mane)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.side :focus-visible,.rail :focus-visible,.tabbar :focus-visible{outline-color:var(--focus-side)}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--on-accent);padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600}
.skip:focus{top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}
.dim{color:var(--ink-3)}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ───────── app shell ───────── */
.app{position:relative;display:grid;grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr);height:100%;overflow:hidden}
.app[data-panel="open"]{grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr) var(--panel-w)}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 12px;color:var(--side-ink-2)}
.rail-ws{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;transition:border-radius .15s,transform .15s;color:var(--side-ink-2)}
.rail-ws svg.mark{width:40px;height:40px;border-radius:12px}
.rail-ws.is-current::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--side-ink)}
.rail-ws.alt{background:var(--side-2);font:700 13px var(--font-mono);color:var(--side-ink-2);letter-spacing:-.02em}
.rail-ws.alt:hover,.rail-ws:hover{border-radius:14px}
.rail-add{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1.5px dashed var(--side-line);color:var(--side-ink-3)}
.rail-add:hover{color:var(--side-ink);border-color:var(--side-ink-3)}
.rail-sp{flex:1}
.rail-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--side-ink-2)}
.rail-btn:hover{background:var(--side-2);color:var(--side-ink)}
.rail-pip{display:grid;place-items:center;width:40px;height:32px;border-radius:10px;color:var(--ok-dot)}
.rail-pip:hover{background:var(--side-2)}
.rail-pip i{width:9px;height:9px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 0 3px var(--conn-glow)}
.rail-tip{position:relative}

/* ───────── sidebar ───────── */
.side{--ring:var(--side);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--side-edge)}
.side-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
.proj{display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px 4px 6px;margin:-4px -6px;border-radius:8px;min-width:0}
.proj:hover{background:var(--side-hover)}
.proj b{font-size:17px;font-weight:750;letter-spacing:-.01em}
.proj .chev{margin-left:auto;color:var(--side-ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sc{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font:500 11.5px/1 var(--font-ui);background:var(--side-2);color:var(--side-ink-2);white-space:nowrap}
.sc svg{opacity:.85}
.sc.mono{font-family:var(--font-mono);font-size:11px}
.conn{display:flex;align-items:center;gap:9px;color:var(--side-ink-2);padding:6px 10px;border-radius:9px;background:var(--conn-bg);border:1px solid var(--conn-line);min-width:0}
.conn .cl{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.conn .cl b{font:600 11.5px var(--font-mono);color:var(--side-ink)}
.conn .cl span{font-size:11px;color:var(--side-ink-2)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);flex:none;box-shadow:0 0 0 3px var(--conn-glow)}
.qs{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:9px;background:var(--side-field);color:var(--side-ink-3);border:1px solid var(--side-line);font-size:13px}
.qs:hover{border-color:var(--side-line-hi);color:var(--side-ink-2)}
.qs kbd{margin-left:auto;font:500 10.5px var(--font-mono);border:1px solid var(--side-line);border-radius:5px;padding:1px 5px;color:var(--side-ink-3)}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;scrollbar-width:thin;scrollbar-color:var(--side-scroll) transparent}
.sec{margin-top:10px}
.sec-h{display:flex;align-items:center;gap:6px;width:100%;padding:4px 8px;font-size:12px;font-weight:650;color:var(--side-ink-3);letter-spacing:.01em;border-radius:6px}
.sec-h:hover{color:var(--side-ink)}
.sec-h .tw{transition:transform .15s}
.sec-h[aria-expanded="false"] .tw{transform:rotate(-90deg)}
.sec-h .cap{margin-left:auto;font-weight:500;font-size:11px;color:var(--side-ink-3);display:inline-flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:9px;width:100%;min-height:28px;padding:3px 8px;border-radius:7px;color:var(--side-ink-2);position:relative;min-width:0}
.row:hover{background:var(--side-hover);color:var(--side-ink)}
.row[aria-current="page"],.row.is-cur{background:var(--side-active);color:var(--on-accent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row.unread .nm{color:var(--side-ink);font-weight:700}
.row .hs{width:18px;display:grid;place-items:center;color:var(--side-ink-3);font-size:15px;font-weight:500;flex:none}
.row[aria-current="page"] .hs{color:var(--side-ink-act)}
.bdg{min-width:19px;height:19px;padding:0 6px;border-radius:999px;font:700 11px/19px var(--font-ui);text-align:center;background:var(--side-ink);color:var(--side);flex:none;white-space:nowrap}
.bdg.ask{background:var(--c-wr);color:var(--on-warn)}
.bdg.err{background:var(--c-err);color:var(--on-err)}
.bdg.dot{min-width:8px;width:8px;height:8px;padding:0;background:var(--side-ink-2)}
.rider{align-items:center;padding:3px 8px;gap:10px;min-height:40px}
.rider .av{margin-top:0}
.rider .rb{flex:1;min-width:0}
.rider .r1{display:flex;align-items:center;gap:6px;min-width:0}
.rider .r1 b{font-size:14px;font-weight:650;color:var(--side-ink)}
.rider .r1 em{font-style:normal;font-size:11px;color:var(--side-ink-3)}
.rider .r2{font-size:11.5px;line-height:1.25;color:var(--side-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;margin-top:1px}
.rider .r2 .g{flex:none;font-family:var(--font-mono);font-size:11px}
.rider[aria-current="page"] .r2,.rider.is-cur .r2{color:var(--side-ink-act-2)}
.rider[aria-current="page"] .r1 em{color:var(--side-ink-act-2)}
.legs{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.legs i{display:block;width:3px;border-radius:1.5px;background:var(--side-line)}
.legs i.on{opacity:1}
.mailrow .stk{display:flex}
.mailrow .stk .av{margin-right:-7px;box-shadow:0 0 0 2px var(--side)}
.mailrow .stk .av:last-child{margin-right:0}
.mailrow:hover .stk .av{box-shadow:0 0 0 2px var(--side-hover)}
.mailrow[aria-current="page"] .stk .av{box-shadow:0 0 0 2px var(--side-active)}
.mailrow .nm{font-family:var(--font-mono);font-size:12.5px;margin-left:8px}
.sess .nm{font-size:13px}
.sess .sub{display:block;font-size:11.5px;color:var(--side-ink-3);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:10px 12px 12px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:9px;background:var(--side)}
.bud{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left}
.bud .t{display:flex;justify-content:space-between;font-size:12px;color:var(--side-ink-2);font-weight:550}
.bud .t b{color:var(--side-ink);font-family:var(--font-mono);font-weight:600;font-size:12px}
.meter{height:5px;border-radius:3px;background:var(--side-line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c-wr);border-radius:3px;transition:width .4s}
.foot-chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:var(--side-2);color:var(--side-ink);font-size:12px;font-weight:600;border:1px solid transparent;min-width:0;max-width:100%}
.fchip:hover{border-color:var(--side-line);background:var(--side-hover)}
.fchip .k{font-weight:500;color:var(--side-ink-3);font-family:var(--font-mono);font-size:11px}
.fchip.m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip.danger{background:repeating-linear-gradient(135deg,var(--chip-danger-a) 0 6px,var(--chip-danger-b) 6px 12px);color:var(--chip-danger-ink);border-color:var(--chip-danger-line)}
.fchip.plan{background:var(--chip-plan-bg);color:var(--chip-plan-ink)}
.fchip.edit{background:var(--chip-edit-bg);color:var(--chip-edit-ink)}

/* ───────── avatars and presence ───────── */
.av{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:28%;overflow:visible;color:var(--ink)}
.av>svg.leg{width:100%;height:100%}
.lg-t{font:800 13px var(--font-mono);fill:var(--ink);letter-spacing:-.02em}
.av .pd{position:absolute;right:-3px;bottom:-3px}
.av-mgr{background:var(--c-mgr)}.av-be{background:var(--c-be)}.av-fe{background:var(--c-fe)}.av-sc{background:var(--c-sc)}.av-ts{background:var(--c-ts)}.av-you{background:var(--accent);color:var(--on-accent);font-weight:800}
.av-bot{background:var(--ink);color:var(--on-accent);border-radius:50%}
.av-hs{background:var(--hs-bg);color:var(--hs-ink);border-radius:50%}
.av svg.hm{width:100%;height:100%;border-radius:28%}
.av .lg-on{fill:var(--ink)}.av .lg-off{fill:var(--ink);opacity:.28}
.pd{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--ring);flex:none;display:inline-block;position:relative}
.pd-work{background:var(--ok-dot)}
.pd-work::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok-dot);opacity:0;animation:ping 1.8s ease-out infinite}
.pd-wait{background:var(--ring);box-shadow:0 0 0 2px var(--ring),inset 0 0 0 2.5px var(--ok-dot)}
.pd-ask{background:var(--warn-dot)}
.pd-ask::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:800 8px/1 var(--font-ui);color:var(--on-warn)}
.pd-idle{background:var(--ring);box-shadow:0 0 0 2px var(--ring),inset 0 0 0 2px var(--idle-dot)}
.pd-done{background:var(--done-dot)}
.pd-done::before{content:"";position:absolute;left:3px;top:2px;width:3px;height:5px;border:solid var(--on-done);border-width:0 1.6px 1.6px 0;transform:rotate(40deg)}
.pd-stuck{background:var(--err-dot);border-radius:2px;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none;width:12px;height:11px}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}

.typing{display:inline-flex;gap:3px;align-items:center;height:12px}
.typing i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4;animation:bob 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}

/* role pills and chips */
.rp{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;font:650 10.5px/1 var(--font-ui);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.rp-mgr{background:var(--s-mgr);color:var(--i-mgr)}.rp-be{background:var(--s-be);color:var(--i-be)}.rp-fe{background:var(--s-fe);color:var(--i-fe)}.rp-sc{background:var(--s-sc);color:var(--i-sc)}.rp-ts{background:var(--s-ts);color:var(--i-ts)}.rp-bot{background:var(--surface-3);color:var(--ink-2)}.rp-you{background:var(--accent-soft);color:var(--accent-2)}
.tx-mgr{color:var(--i-mgr)}.tx-be{color:var(--i-be)}.tx-fe{color:var(--i-fe)}.tx-sc{color:var(--i-sc)}.tx-ts{color:var(--i-ts)}
.side .tx-mgr{color:var(--c-mgr)}.side .tx-be{color:var(--c-be)}.side .tx-fe{color:var(--c-fe)}.side .tx-sc{color:var(--c-sc)}.side .tx-ts{color:var(--c-ts)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:600 12px/1 var(--font-ui);white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.acc{background:var(--accent-soft);color:var(--accent-2)}
.pill.mono{font-family:var(--font-mono);font-size:11.5px;font-weight:500}
.kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface);font:600 11px/1 var(--font-mono);color:var(--ink-2)}
.tchip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:600 11.5px/1 var(--font-mono);background:var(--surface-3);color:var(--ink);white-space:nowrap;cursor:pointer;border:1px solid transparent;vertical-align:1px}
.tchip:hover{border-color:var(--line-2);background:var(--surface)}
.men{display:inline;padding:0 4px;border-radius:5px;font-weight:650;background:var(--accent-soft);color:var(--accent-2);cursor:pointer}
.men:hover{background:var(--accent-line)}
.men.fl{font-family:var(--font-mono);font-weight:500;font-size:.92em;background:var(--surface-3);color:var(--ink)}
p code,.mb code,li code,td code,.inl{font-family:var(--font-mono);font-size:.88em;padding:1px 5px;border-radius:5px;background:var(--surface-3);color:var(--ink)}

/* ───────── main column ───────── */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-left:1px solid var(--line)}
.mh{flex:none;height:var(--head-h);display:flex;align-items:center;gap:12px;padding:0 20px 0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.mh .back{display:none}
.mh .ttl{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.mh .ttl h1{margin:0;font-size:17px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.mh .ttl .hs{font-size:19px;font-weight:500;color:var(--ink-3);margin-right:-3px}
.mh .topic{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.mh .topic .tp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mh .topic .sep{width:1px;height:16px;background:var(--line-2);flex:none}
.mh .tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--ink-2);position:relative}
.ib:hover{background:var(--surface-3);color:var(--ink)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2)}
.ib .dotb{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--warn-dot);box-shadow:0 0 0 2px var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2);border-color:var(--line-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{height:26px;padding:0 10px;font-size:12px;border-radius:7px;gap:5px}
.btn.xs{height:22px;padding:0 8px;font-size:11.5px;border-radius:6px;gap:4px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.dng{color:var(--err);border-color:var(--err-line)}
.btn.dng:hover{background:var(--err-bg);border-color:var(--err-dot)}
.btn.dng.solid{background:var(--err);color:var(--on-accent);border-color:var(--err)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.warm{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px 0 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font:600 12.5px/1 var(--font-ui);border:1px solid var(--warn-line);white-space:nowrap}
.warm .ringw{width:18px;height:18px}
.warm .ringw circle{fill:none;stroke-width:3}
.warm .ringw .bgc{stroke:var(--warn-track)}
.warm .ringw .fgc{stroke:var(--warn-dot);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.warm b{font-family:var(--font-mono);font-weight:600}
.warm.hot{background:var(--err-bg);color:var(--err);border-color:var(--err-line-2)}
.warm.hot .ringw .fgc{stroke:var(--err-dot)}.warm.hot .ringw .bgc{stroke:var(--err-track)}
.warm.cold{background:var(--surface-3);color:var(--ink-3);border-color:var(--line-2)}
.warm.cold .ringw .fgc{stroke:var(--idle-dot)}.warm.cold .ringw .bgc{stroke:var(--line-2)}
.warm.refill{animation:refill .7s ease-out}
.warm.brk{animation:brk 1.9s ease-out}
@keyframes refill{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn-dot) 70%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--warn-dot) 0%,transparent)}}
@keyframes brk{0%,30%{background:var(--c-err);color:var(--on-err);border-color:var(--c-err)}100%{}}
.mem{display:flex;align-items:center;padding:0 2px}
.mem .av{margin-left:-7px;box-shadow:0 0 0 2px var(--surface);border-radius:28%;position:relative}
.mem .av:nth-child(1){z-index:6}.mem .av:nth-child(2){z-index:5}.mem .av:nth-child(3){z-index:4}.mem .av:nth-child(4){z-index:3}.mem .av:nth-child(5){z-index:2}
.mem .av:first-child{margin-left:0}
.mem .more{margin-left:-7px;position:relative;z-index:1;width:28px;height:28px;border-radius:9px;background:var(--surface-3);color:var(--ink-2);font:650 11px var(--font-ui);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.mem:hover .av,.mem:hover .more{margin-left:-3px}
.mem:hover .av:first-child{margin-left:0}

/* pinned goal strip */
.goalbar{flex:none;border-bottom:1px solid var(--line);background:var(--surface-2)}
.goalbar-in{display:flex;align-items:center;gap:12px;padding:8px 24px;min-height:44px;width:100%;text-align:left}
.goalbar:hover .goalbar-in{background:var(--surface-3)}
.goalbar .lbl{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--accent-2);flex:none}
.goalbar .gtx{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goalbar .gtx b{color:var(--ink);font-weight:650}
.seg{display:flex;gap:3px;flex:none}
.seg i{width:22px;height:8px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line-2)}
.seg i.d{background:var(--done-dot);border-color:var(--done-dot)}
.seg i.v{background:repeating-linear-gradient(135deg,var(--c-be) 0 4px,var(--s-be) 4px 8px);border-color:var(--c-be)}
.seg i.e{background:var(--c-wr);border-color:var(--c-wr)}
.seg i.a{background:var(--warn-bg);border-color:var(--warn-dot);box-shadow:inset 0 0 0 1.5px var(--warn-dot)}
.goalbar .cnt{font:600 12px var(--font-mono);color:var(--ink-2);flex:none}

/* stream */
.mbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.stream{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;padding:12px 0 8px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.stream-in{max-width:900px;margin:0 auto;padding:0 12px}
.day{display:flex;align-items:center;gap:12px;margin:14px 12px 8px;color:var(--ink-3);font-size:12px;font-weight:650}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day span{padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.newrule{display:flex;align-items:center;gap:10px;margin:10px 12px;color:var(--err);font:700 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase}
.newrule::before{content:"";flex:1;height:1px;background:var(--c-err)}
.newrule span{padding:2px 8px;border-radius:999px;background:var(--err-bg)}
.msg{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;padding:6px 12px 6px 12px;border-radius:10px;animation:slidein .22s ease-out}
.msg:hover{background:var(--hover)}
.msg.cont{padding-top:1px;padding-bottom:1px}
.msg.cont .av{visibility:hidden;height:0}
.msg .mt{display:none;position:absolute;left:12px;top:5px;width:36px;text-align:center;font:500 10.5px var(--font-mono);color:var(--ink-3)}
.msg.cont:hover .mt{display:block}
.msg .mhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-height:20px}
.msg .mhd .who{font-weight:750;font-size:14.5px;cursor:pointer}
.msg .mhd .who:hover{text-decoration:underline}
.msg .mhd time{font-size:12px;color:var(--ink-3);font-family:var(--font-mono)}
.msg .mhd .via{font-size:12px;color:var(--ink-3)}
.msg .mb{min-width:0}
.msg .mb>*+*{margin-top:6px}
.msg .mb p{margin:0;line-height:1.55}
.msg .mb p+p{margin-top:6px}
.msg.ephem{background:var(--surface-2)}
.msg.ephem:hover{background:var(--surface-2)}
.msg .eph{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:6px}
.msg .eph button{color:var(--accent-2);font-weight:600}
.msg .eph button:hover{text-decoration:underline}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .tb{position:absolute;right:14px;top:-14px;display:none;gap:1px;padding:2px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-2);z-index:3}
.msg:hover .tb,.msg:focus-within .tb{display:flex}
.msg .tb button{width:30px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink-2)}
.msg .tb button:hover{background:var(--surface-3);color:var(--ink)}
.msg.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:var(--warn-bg)}100%{}}
.reps{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:3px 8px 3px 4px;border-radius:8px;font-size:12px;color:var(--accent-2);font-weight:650}
.reps:hover{background:var(--surface-3)}
.reps .av{box-shadow:0 0 0 2px var(--surface)}

/* feed and system rows */
.sys{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;align-items:start;padding:2px 12px;font-size:13px;color:var(--ink-2);min-height:26px;border-radius:8px;animation:slidein .22s ease-out}
.sys:hover{background:var(--hover)}
.sys .g{justify-self:center;font:600 14px/20px var(--font-mono);color:var(--ink-3)}
.sys .sb{min-height:22px}
.sys .sb{display:flex;align-items:flex-start;gap:8px;min-width:0}
.sys .sb>span:first-child{flex:1;min-width:0}
.sys .sb time{margin-left:auto;flex:none;font:500 11.5px var(--font-mono);color:var(--ink-3)}
.sys.ok .g{color:var(--ok)}.sys.warn .g{color:var(--warn)}.sys.err .g{color:var(--err)}.sys.acc .g{color:var(--accent-2)}
.sys b{font-weight:700;color:var(--ink)}
.feed{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;align-items:center;padding:1px 12px;min-height:26px;border-radius:8px;font-size:13px;animation:slidein .22s ease-out}
.feed:hover{background:var(--hover)}
.feed .av{justify-self:center}
.feed .fb{display:flex;align-items:center;gap:8px;min-width:0}
.feed .fb .nm{font-weight:700;font-size:13px;flex:none;cursor:pointer}
.feed .fb .vb{font:600 12px var(--font-mono);color:var(--ink-2);flex:none}
.feed .fb .tg{font:500 12px var(--font-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.feed .fb .df{font:600 11.5px var(--font-mono);color:var(--ok);flex:none}
.feed .fb time{margin-left:auto;font:500 11.5px var(--font-mono);color:var(--ink-3);flex:none;padding-left:8px}
.feed .fb .fmq{flex:1;font-style:normal;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fgrp{margin:6px 12px 2px;display:flex;align-items:center;gap:8px;color:var(--ink-3);font:650 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase}
.fgrp::after{content:"";flex:1;height:1px;background:var(--line)}

/* tool chips */
.tool{display:inline-flex;align-items:center;gap:7px;max-width:100%;height:26px;padding:0 10px 0 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line-2);font:500 12px/1 var(--font-mono);color:var(--ink);box-shadow:var(--sh-1);vertical-align:middle;overflow:hidden}
.tool .tg{font-size:13px;color:var(--ink-3);flex:none}
.tool b{font-weight:700;flex:none}
.tool .ta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);min-width:0}
.tool .ts{flex:none;font-weight:700;color:var(--ok)}
.tool .ts.d{font-weight:500;color:var(--ink-3);margin-left:-2px}
.tool.run{border-color:var(--accent-line);background:var(--accent-soft)}
.tool.run .tg{color:var(--accent-2);animation:spin 1.6s linear infinite;display:inline-block}
.tool.run .ts{color:var(--accent-2)}
.tool.err .ts{color:var(--err)}
.tool.ask{border-color:var(--warn-dot);background:var(--warn-bg)}
.tool.ask .ts{color:var(--warn)}
.tool.ask .tg{color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tout{margin:4px 0 0;padding:8px 10px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line);font:400 12px/1.5 var(--font-mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-word}

/* cards */
.card{border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden;max-width:660px}
.card.wide{max-width:none}
.ch{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;min-height:38px}
.ch .fp{font:600 12.5px var(--font-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ch .sp{flex:1}
.ch .st{font:600 11.5px var(--font-mono);display:inline-flex;gap:6px}
.ch .st .a{color:var(--ok)}.ch .st .d{color:var(--err)}
.fl{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;font:700 10.5px var(--font-mono)}
.fl.A{background:var(--ok-bg);color:var(--ok)}.fl.M{background:var(--warn-bg);color:var(--warn)}.fl.D{background:var(--err-bg);color:var(--err)}
.dif{font:400 12.5px/1.55 var(--font-mono);color:var(--code-ink);overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.dl{display:grid;grid-template-columns:38px 22px minmax(0,1fr);min-width:max-content;width:100%}
.dl .n{text-align:right;padding-right:8px;color:var(--ink-3);user-select:none;font-size:11.5px;opacity:.85}
.dl .s{text-align:center;color:var(--ink-3);user-select:none}
.dl .t{white-space:pre;padding-right:14px;tab-size:4}
.dl.add .t,.dl.add .s,.dl.add .n{background:var(--s-be)}
.dl.add .s{color:var(--i-be);font-weight:700}
.dl.add.by-mgr .t,.dl.add.by-mgr .s,.dl.add.by-mgr .n{background:var(--s-mgr)}
.dl.add.by-be .t,.dl.add.by-be .s,.dl.add.by-be .n{background:var(--s-be)}
.dl.add.by-fe .t,.dl.add.by-fe .s,.dl.add.by-fe .n{background:var(--s-fe)}
.dl.add.by-ts .t,.dl.add.by-ts .s,.dl.add.by-ts .n{background:var(--s-ts)}
.dl.add.by-be .s{color:var(--i-be)}.dl.add.by-fe .s{color:var(--i-fe)}.dl.add.by-ts .s{color:var(--i-ts)}
.dl.del .t,.dl.del .s,.dl.del .n{background:var(--del-bg)}
.dl.del .s{color:var(--del-ink);font-weight:700}
.dl.del .t{color:var(--del-ink)}
.dl.hunk .t{color:var(--ink-3);font-style:italic}
.dl.hunk{background:var(--surface-2)}
.dl.hidden{display:none}
.dif.open .dl.hidden{display:grid}
.dmore{display:block;width:100%;padding:7px 12px;text-align:left;border-top:1px dashed var(--line-2);color:var(--accent-2);font-weight:600;font-size:12.5px;background:var(--surface-2)}
.dmore:hover{background:var(--accent-soft)}
.k-kw{color:var(--syn-kw);font-weight:500}.k-str{color:var(--syn-str)}.k-com{color:var(--syn-com);font-style:italic}.k-num{color:var(--syn-num)}.k-fn{color:var(--syn-fn)}
.dl.del .k-kw,.dl.del .k-str,.dl.del .k-com,.dl.del .k-num,.dl.del .k-fn{color:inherit}
.caret{display:inline-block;width:7px;height:1.1em;vertical-align:-2px;background:var(--accent);margin-left:1px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.tcard .tb2{padding:10px 12px;font:400 12.5px/1.55 var(--font-mono);color:var(--ink-2);white-space:pre-wrap}
.tcard .tb2 .okk{color:var(--ok);font-weight:700}
.vbar{display:flex;align-items:center;gap:8px;padding:9px 12px}
.stp{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font-ui);padding:3px 9px;border-radius:999px}
.stp.run{background:var(--accent-soft);color:var(--accent-2)}.stp.ok{background:var(--ok-bg);color:var(--ok)}.stp.fail{background:var(--err-bg);color:var(--err)}.stp.wait{background:var(--surface-3);color:var(--ink-2)}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}

/* plan card */
.plan{max-width:620px}
.plan .ph{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.plan .gl{font-size:15px;font-weight:650;line-height:1.4;letter-spacing:-.005em}
.plan .gl code{font-size:.9em}
.plan .verd{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-2)}
.plan .verd b{font-weight:700;color:var(--ink);white-space:nowrap}
.plan ol{list-style:none;margin:0;padding:2px 6px 8px;counter-reset:ps}
.plan li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;counter-increment:ps}
.plan li:hover{background:var(--surface-2)}
.plan .gi{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font:700 12px var(--font-mono);border:1.5px solid var(--line-2);color:var(--ink-3);background:var(--surface)}
.plan .done .gi{background:var(--done-dot);border-color:var(--done-dot);color:var(--on-done)}
.plan .verify .gi{border-color:var(--c-be);color:var(--i-be);background:var(--s-be)}
.plan .edit .gi{border-color:var(--c-wr);color:var(--warn);background:var(--warn-bg)}
.plan .ask .gi{border-color:var(--warn-dot);background:var(--warn-bg);color:var(--warn)}
.plan .queued .gi{color:var(--ink-3)}
.plan .stx{font-size:13.5px;line-height:1.4;padding-top:1px}
.plan .stx small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.plan .done .stx{color:var(--ink-2)}
.plan .tl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding-top:1px}
.pstate{display:inline-flex;align-items:center;gap:6px}

/* reports and compaction */
.rep{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:center;padding:6px 12px;font-size:13px}
.rep+.rep{border-top:1px solid var(--line)}
.rep .nm{font-weight:700}
.rep .tx{color:var(--ink-2)}
.cmp{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--s-mgr);border:1px solid var(--accent-line);font-size:13px}
.cmp .dm{color:var(--i-mgr);font-size:15px;line-height:1}
.cmp b{font-weight:700}
.cmp .bars{display:flex;align-items:center;gap:6px}
.cmp .bar{height:12px;border-radius:3px;background:var(--c-mgr)}
.cmp .bar.s{background:var(--i-mgr);opacity:.75}
.cmp .pc{color:var(--i-mgr);font:700 12px var(--font-mono)}
.cmp .nt{color:var(--ink-2);font-size:12px}

/* bot cards */
.bcard{border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden;max-width:660px}
.bcard.err{border-color:var(--err-line-3)}
.bcard .bh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--err-bg);color:var(--err);font-weight:700;font-size:14px}
.bcard .bh .tt{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bcard .bb{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bcard .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bcard .kv>div{padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.bcard .kv small{display:block;color:var(--ink-3);font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.bcard .kv b{font:600 15px var(--font-mono);display:block;margin-top:2px}
.bcard .kv b em{font-style:normal;color:var(--ink-3);font-size:12px;font-weight:500}
.bcard .why{font-size:13.5px;color:var(--ink);padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-2)}
.bcard .why small{display:block;color:var(--ink-3);font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.bcard .ba{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:flex;align-items:flex-end;gap:3px;height:40px}
.hb i{width:16px;background:var(--ok-dot);border-radius:3px 3px 1px 1px;position:relative;min-height:3px}
.hb i.lo{background:var(--c-wr)}
.hb i.z{background:var(--c-err);height:3px!important}
.hb i.z::after{content:"⚠";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--err);font-style:normal}
.hbw{display:flex;align-items:flex-end;gap:12px}
.hbw .cap{font-size:12px;color:var(--ink-3);line-height:1.35}

/* queued and steer */
.qmsg{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13.5px;max-width:640px}
.qmsg .qi{color:var(--ink-3);margin-top:2px}
.steer{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--i-be);font-weight:650}
.chipx{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--surface-3);font:500 12px var(--font-mono);border:1px solid var(--line-2)}
.chipx b{font-weight:700}

/* mail rows */
.mailm{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;padding:8px 12px;border-radius:10px;animation:slidein .22s ease-out}
.mailm:hover{background:var(--hover)}
.mailq{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:9px 12px;max-width:620px;font-size:14px;line-height:1.5;position:relative;white-space:pre-wrap;word-break:break-word}
.mailm .mhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-height:20px}
.mailm .mhd .who{font-weight:750;font-size:14.5px}
.mailm .mhd time{font-size:12px;color:var(--ink-3);font-family:var(--font-mono)}
.mailq .mk{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:5px;background:var(--info-bg);color:var(--info);font:650 10.5px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;margin-right:8px;vertical-align:1px}
.arrow{color:var(--ink-3);font-family:var(--font-mono)}

/* ───────── the interactive approval message ───────── */
:root{--term-bg:#1b1a24;--term-ink:#e6e5f3;--term-dim:#9a99b6;--term-line:#34334a;--term-kw:#bb9af7;--term-str:#9ece6a;--amber-glow:color-mix(in srgb,var(--warn-dot) 28%,transparent)}
.askc{position:relative;max-width:640px;border:1.5px solid var(--warn-dot);border-radius:14px;background:var(--surface);box-shadow:0 0 0 4px var(--amber-glow),var(--sh-2);overflow:hidden}
.askc .ah{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--warn-bg);border-bottom:1px solid var(--warn-dot)}
.askc .ah .at{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--ink)}
.askc .ah .at b{font-weight:750}
.askc .ah .at small{display:block;font-size:12px;color:var(--warn);font-weight:600}
.askc .ab{padding:12px 14px 4px;display:flex;flex-direction:column;gap:10px}
.lab{font:700 10.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.term{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--term-bg);color:var(--term-ink);font:500 13px/1.4 var(--font-mono);overflow-x:auto}
.term .pr{color:var(--term-kw);font-weight:700;flex:none}
.term code{background:none;color:inherit;padding:0;font-size:inherit;white-space:pre}
.term .cwd{margin-left:auto;flex:none;color:var(--term-dim);font-size:11.5px;border:1px solid var(--term-line);border-radius:5px;padding:1px 7px}
.askc .whyt{font-size:13.5px;line-height:1.5;color:var(--ink)}
.askc .scp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.choices{display:flex;flex-direction:column;gap:6px;padding:8px 14px 12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-weight:600;font-size:13.5px;line-height:1.3;transition:background .12s,border-color .12s,transform .12s}
.choice .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--surface-3);font:700 12.5px var(--font-mono);color:var(--ink-2);flex:none}
.choice .esc{margin-left:auto;font:600 11px var(--font-mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;flex:none}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice:hover .k{background:var(--accent);color:var(--on-accent)}
.choice.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice.p .k{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
.choice.p:hover{background:var(--accent-2);border-color:var(--accent-2)}
.choice:active{transform:translateY(1px)}
.askc.arming .choice{opacity:.55;cursor:progress;background:var(--surface-2);border-style:dashed;color:var(--ink-2)}
.askc.arming .choice.p{background:var(--surface-2);color:var(--ink-2);border-color:var(--line-2)}
.askc.arming .choice .k{background:var(--surface-3);color:var(--ink-3)}
.askc.arming .choice:hover{background:var(--surface-2);border-color:var(--line-2)}
.askc.arming .choice:hover .k{background:var(--surface-3);color:var(--ink-3)}
.askc .pause{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.pm{display:flex;gap:3px;flex:none}
.pm i{width:11px;height:11px;border-radius:3px;background:var(--line-2)}
.pm i.on{background:var(--warn-dot)}
.askc:not(.arming) .pm i{background:var(--ok-dot)}
.askc .pause .pt{flex:1;min-width:0}
.askc .pause .wf{margin-left:auto;font:600 12px var(--font-mono);color:var(--warn);white-space:nowrap;flex:none}
.askc.done{box-shadow:var(--sh-1);border-color:var(--line-2)}
.askc.done .ah{background:var(--surface-2);border-bottom-color:var(--line)}
.askc .res{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;font-size:13.5px;line-height:1.45;border-top:1px solid var(--line);background:var(--surface)}
.askc .res .ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px}
.askc .res.y .ic{background:var(--ok-bg);color:var(--ok)}
.askc .res.n .ic{background:var(--err-bg);color:var(--err)}
.askc .res small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.askc .nsay{padding:0 14px 14px}
.nsay .nf{border:1.5px solid var(--accent);border-radius:10px;background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.nsay textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:10px 12px 4px;min-height:56px;outline:none;font-size:14px;line-height:1.5}
.nsay .nb{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 12px;color:var(--ink-3);font-size:12px}
.askbar{display:flex;align-items:center;gap:12px;margin:0 20px 8px;padding:8px 12px;border-radius:11px;border:1.5px solid var(--warn-dot);background:var(--warn-bg);box-shadow:var(--sh-2);font-size:13px;animation:slidein .22s ease-out}
.askbar code{background:var(--surface);font-size:12px;padding:2px 6px;border-radius:5px}
.askbar .wf{margin-left:auto;font:600 12px var(--font-mono);color:var(--warn);white-space:nowrap}
.askbar .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ───────── composer dock ───────── */
.dock{flex:none;padding:6px 20px 0;position:relative}
.dock-in{max-width:900px;margin:0 auto;position:relative}
.stat{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 4px 6px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.stat .sp{flex:1;min-width:8px}
.stat .led{width:9px;height:9px;border-radius:50%;background:var(--ok-dot);flex:none;animation:pulse 1.6s ease-in-out infinite}
.stat .led.off{background:var(--idle-dot);animation:none}
.stat .led.hold{background:var(--warn-dot);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok-dot) 45%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok-dot) 0%,transparent)}}
.stat .num{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.stat .sep{color:var(--line-2)}
.qline{display:flex;align-items:center;gap:8px;padding:4px 8px;margin-bottom:4px;font-size:12.5px;color:var(--ink-2);border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-2)}
.qline .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qline button{color:var(--ink-3);display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.qline button:hover{background:var(--surface-3);color:var(--ink)}
.cbx{position:relative;border:1px solid var(--line-2);border-radius:13px;background:var(--surface);box-shadow:var(--sh-1);transition:border-color .12s,box-shadow .12s}
.cbx:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbx.steerable{border-color:var(--accent-line)}
.cfield{position:relative;display:grid}
.cfield>*{grid-area:1/1;padding:12px 14px 4px;font:400 14.5px/1.5 var(--font-ui);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;max-height:168px;min-height:44px}
.cmirror{pointer-events:none;color:var(--ink);overflow:hidden}
.cmirror .ph{color:var(--ink-3)}
.cmirror mark{background:var(--accent-soft);color:var(--accent-2);border-radius:4px;box-shadow:0 0 0 1px var(--accent-soft);font-weight:600}
.cmirror mark.f{font-family:var(--font-mono);font-size:.93em;background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 1px var(--surface-3)}
.cmirror mark.sl{background:var(--s-mgr);color:var(--i-mgr);box-shadow:0 0 0 1px var(--s-mgr)}
.cmirror mark.pc{background:var(--info-bg);color:var(--info);box-shadow:0 0 0 1px var(--info-bg);font-family:var(--font-mono);font-size:.9em}
#composer-input{resize:none;border:0;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow-y:auto;z-index:1}
#composer-input::selection{background:var(--accent-line);color:transparent}
#composer-input::placeholder{color:transparent}
.cbar{display:flex;align-items:center;gap:4px;padding:4px 8px 8px 8px}
.cbar .tb{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--ink-2)}
.cbar .tb:hover{background:var(--surface-3);color:var(--ink)}
.cbar .sp{flex:1}
.cbar .hint{font-size:12px;color:var(--ink-3);margin-right:6px;white-space:nowrap}
.mode{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font:600 12px var(--font-ui);background:var(--surface-3);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.mode:hover{border-color:var(--line-2);background:var(--surface-2)}
.mode.accept-edits{background:var(--warn-bg);color:var(--warn)}
.mode.plan{background:var(--info-bg);color:var(--info)}
.mode.bypass,.mode.yolo{background:repeating-linear-gradient(135deg,var(--danger-hatch) 0 6px,var(--err-bg) 6px 12px);color:var(--err);border-color:var(--err-dot)}
.mode .mk{font:600 10.5px var(--font-mono);opacity:.75}
.cbar .send{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 12px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:13px}
.cbar .send:hover{background:var(--accent-2)}
.cbar .send[disabled]{background:var(--surface-3);color:var(--ink-3);pointer-events:none}
.cbar .send .kc{background:color-mix(in srgb,var(--on-accent) 18%,transparent);border-color:color-mix(in srgb,var(--on-accent) 30%,transparent);color:var(--on-accent);height:18px;min-width:18px;font-size:10.5px;border-bottom-width:1px}
.ro{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:13px;background:var(--surface-2);border:1px dashed var(--line-2);color:var(--ink-2);font-size:13.5px}
.ro svg{color:var(--ink-3)}
.ro .sp{flex:1}
.mfoot{flex:none;display:flex;align-items:center;gap:14px;height:30px;padding:0 20px;font:500 11.5px var(--font-mono);color:var(--ink-3);white-space:nowrap}
.mfoot .l{display:flex;gap:10px;align-items:center;overflow:hidden;min-width:0}
.mfoot .sp{flex:1}
.mockchip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 9px;border-radius:999px;background:var(--ink);color:var(--on-accent);font:600 10.5px var(--font-ui);letter-spacing:.04em;flex:none}
.mockchip i{width:6px;height:6px;border-radius:50%;background:var(--c-wr)}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:4;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--on-accent);font-weight:650;font-size:12.5px;box-shadow:var(--sh-2)}

/* menus (slash and mention) */
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:20;max-height:320px;overflow-y:auto;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);box-shadow:var(--sh-3);padding:6px;scrollbar-width:thin}
.menu .mh2{padding:6px 10px 4px;font:700 10.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;min-height:36px}
.mi[aria-selected="true"],.mi:hover{background:var(--accent-soft)}
.mi .mn{font:600 13px var(--font-mono);color:var(--ink);flex:none}
.mi .md{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .mr{font-size:11.5px;color:var(--ink-3);flex:none}
.mi .mu{font:500 12px var(--font-mono);color:var(--ink-2);flex:none}
.mi .mnm{font-weight:650;font-size:13.5px}
.mempty{padding:14px;color:var(--ink-3);font-size:13px;text-align:center}

/* ───────── details panel ───────── */
.panel{--ring:var(--surface);position:relative;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;z-index:5}
.pnh{flex:none;height:var(--head-h);display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;border-bottom:1px solid var(--line)}
.pnh .kind{font:700 11px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pnh .sp{flex:1}
.pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pn-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.pn-sec:last-child{border-bottom:0}
.pn-t{display:flex;align-items:flex-start;gap:10px}
.pn-t h2{margin:0;font-size:17px;line-height:1.3;font-weight:750;letter-spacing:-.01em}
.pn-sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.step::before{content:"";position:absolute;top:10px;right:50%;width:100%;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 7px)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--done-dot)}
.step .nd{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);font:700 11px var(--font-mono)}
.step.done .nd{background:var(--done-dot);border-color:var(--done-dot);color:var(--on-done)}
.step.cur .nd{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2);box-shadow:0 0 0 4px var(--accent-soft)}
.step.cur .nd .spin{width:9px;height:9px;border-width:2px}
.step b{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.step.cur b,.step.done b{color:var(--ink)}
.step small{font:500 11px var(--font-mono);color:var(--ink-3);min-height:14px}
.step.ok .nd{background:var(--done-dot)}
.facts{display:grid;grid-template-columns:80px minmax(0,1fr);gap:9px 12px;font-size:13px;align-items:center}
.facts dt{color:var(--ink-3);font-size:12px;font-weight:600}
.facts dd{margin:0;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.spark i{width:5px;border-radius:1.5px 1.5px 0 0;background:var(--ok-dot);min-height:2px}
.spark i.lo{background:var(--c-wr)}.spark i.z{background:var(--c-err);height:2px!important}
.pthread{padding:8px 8px}
.pthread .msg,.pthread .sys,.pthread .feed{padding-left:10px;padding-right:10px}
.pthread .msg{grid-template-columns:30px minmax(0,1fr);column-gap:10px}
.pthread .sys,.pthread .feed{grid-template-columns:30px minmax(0,1fr);column-gap:10px}
.pthread .msg .mt{width:30px;left:10px}
.pthread .av{width:30px!important;height:30px!important}
.pthread .feed .av{width:20px!important;height:20px!important}
.pthread .card,.pthread .bcard,.pthread .askc{max-width:100%}
.pthread .dl{grid-template-columns:30px 18px minmax(0,1fr)}
.pfoot{flex:none;padding:10px 14px 14px;border-top:1px solid var(--line);background:var(--surface)}
.pfoot .cbx{border-radius:11px}
.pfoot textarea{display:block;width:100%;border:0;resize:none;background:transparent;padding:10px 12px 4px;min-height:44px;max-height:120px;outline:none;font-size:14px;line-height:1.5}
.pfoot .nb{display:flex;align-items:center;gap:8px;padding:4px 8px 8px 12px;color:var(--ink-3);font-size:12px}
.pfoot .nb .sp{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pgrid>div{padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.pgrid small{display:block;font-size:11px;color:var(--ink-3);font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.pgrid b{font:600 14px var(--font-mono);display:block;margin-top:1px}
.prof{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.prof .big{display:flex;gap:14px;align-items:center}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.tlog{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.tlog>div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.tlog>div:last-child{border-bottom:0}
.tlog time{font:500 11.5px var(--font-mono);color:var(--ink-3)}
.tlog span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdescr{font-size:13px;color:var(--ink-2);line-height:1.5}

.pthread .feed{align-items:start}
.pthread .feed .fb{flex-wrap:wrap}
.pthread .feed .fmq{white-space:normal;flex-basis:100%}
.pthread .feed time{margin-left:auto}

.pbody>.pn-sec:first-child{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--line)}

/* ───────── page views ───────── */
.page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px 28px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.page-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ptitle{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ptitle h2{margin:0;font-size:22px;font-weight:780;letter-spacing:-.02em}
.ptitle p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px;max-width:640px}
.ptitle .sp{flex:1}
.ptitle>div:first-child{flex:1 1 320px;min-width:0}
.pacts2{display:flex;gap:8px;flex-wrap:wrap}
.panelc{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.panelc>header{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.panelc>header .sp{flex:1}
.panelc>header small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.panelc .pb{padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat-t{padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1)}
.stat-t small{display:block;font:650 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat-t b{display:block;font:650 26px/1.15 var(--font-mono);letter-spacing:-.03em;margin-top:5px}
.stat-t span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.stat-t.ok b{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:650 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .r{text-align:right;font-family:var(--font-mono)}
.tbl .who{display:flex;align-items:center;gap:10px;font-weight:700}
.tbl .who button{display:flex;align-items:center;gap:10px;font-weight:700}
.tbl .who button:hover b{text-decoration:underline}
.hitc{font:650 13px var(--font-mono)}
.hitc.g{color:var(--ok)}.hitc.a{color:var(--warn)}.hitc.r{color:var(--err)}
.layers{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);position:relative}
.layers>div{display:flex;align-items:center;justify-content:center;font:700 11.5px var(--font-mono);color:var(--ink);min-width:0;overflow:hidden;position:relative}
.layers .g0{background:var(--c-mgr)}.layers .g1{background:var(--c-be)}.layers .g2{background:var(--c-fe)}.layers .g3{background:var(--c-wr)}.layers .g4{background:var(--c-rv)}.layers .g5{background:var(--c-ts);background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--surface) 40%,transparent) 5px 7px)}
.layers.flash{animation:lflash 2s ease-out}
@keyframes lflash{0%,40%{box-shadow:0 0 0 3px var(--c-err);filter:saturate(.4) hue-rotate(-30deg)}100%{box-shadow:0 0 0 0 transparent}}
.lbrace{position:relative;height:22px;margin-top:6px;font-size:12px;color:var(--ink-2);display:flex}
.lbrace .shared{border:1.5px solid var(--ink-3);border-top:0;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;gap:8px;height:100%;font-weight:600}
.lleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.lleg span{display:inline-flex;align-items:center;gap:6px}
.lleg i{width:10px;height:10px;border-radius:3px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kvl dt{color:var(--ink-3)}.kvl dd{margin:0;font-family:var(--font-mono);font-size:13px}
.alert-c{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.alert-c .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--err-bg);color:var(--err);flex:none}
.alert-c .tx{flex:1;min-width:0;font-size:13.5px}
.alert-c .tx b{font-size:14.5px}
.alert-c .tx p{margin:3px 0 8px;color:var(--ink-2)}

/* board */
.board{flex:1;min-height:0;overflow:auto;padding:18px 24px 24px;display:flex;flex-direction:column;gap:16px}
.bstats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;flex:none}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0;min-height:160px}
.col>h3{display:flex;align-items:center;gap:8px;margin:2px 4px 2px;font-size:13.5px;font-weight:700}
.col>h3 .n{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font:700 11.5px var(--font-mono);color:var(--ink-2)}
.col>h3 .ci{width:9px;height:9px;border-radius:3px}
.col>h3 small{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.tk{display:flex;flex-direction:column;gap:8px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--sh-1);text-align:left;transition:box-shadow .15s,transform .15s,border-color .15s}
.tk:hover{box-shadow:var(--sh-2);transform:translateY(-1px);border-color:var(--accent-line)}
.tk .t1{display:flex;align-items:center;gap:8px}
.tk .t1 .sp{flex:1}
.tk h4{margin:0;font-size:14px;line-height:1.35;font-weight:650}
.tk .t3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.tk .t3 .scp{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--font-mono);padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.tk .blk{display:flex;gap:7px;align-items:center;padding:6px 9px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:600}
.tk .dep{font-size:12px;color:var(--ink-3)}
.tk.moved{animation:flash 1.6s ease-out}
.tk .own{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650}
.empty{padding:16px 10px;text-align:center;color:var(--ink-3);font-size:12.5px;border:1px dashed var(--line-2);border-radius:10px}

/* merge queue */
.lane{display:flex;align-items:stretch;gap:0;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.lane .lh{flex:1.4;padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--accent-soft);border-right:1px solid var(--accent-line)}
.lane .lh .hl{font:700 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--accent-2);display:flex;gap:7px;align-items:center}
.lane .lh .hv{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pipe{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.pipe .ps{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-weight:600;color:var(--ink-2)}
.pipe .ps.ok{border-color:var(--ok-dot);color:var(--ok);background:var(--ok-bg)}
.pipe .ps.run{border-color:var(--accent);color:var(--accent-2);background:var(--surface)}
.pipe .ar{color:var(--ink-3)}
.lane .lw{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);min-width:0}
.lane .lm{flex:.9;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lane small.k{font:700 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lane .big{font:650 24px/1 var(--font-mono);letter-spacing:-.03em}
.feedc{display:flex;flex-direction:column;gap:12px}
.mqc{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.mqc header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13.5px}
.mqc header .sp{flex:1}
.mqc header b{font-weight:700}
.mqc .mb2{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.mqc .out{font:400 12.5px/1.55 var(--font-mono);color:var(--ink-2);padding:8px 10px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line);white-space:pre-wrap}
.mqc .out .okk{color:var(--ok);font-weight:700}

/* team directory */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:11px;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);box-shadow:var(--sh-1);text-align:left;transition:box-shadow .15s,border-color .15s,transform .15s}
.mcard:hover{box-shadow:var(--sh-2);border-color:var(--accent-line);transform:translateY(-1px)}
.mcard .m1{display:flex;gap:12px;align-items:center}
.mcard .m1 b{font-size:15.5px;font-weight:750}
.mcard .m1 .mt2{display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard .dg{font-size:13px;color:var(--ink-2);line-height:1.4;min-height:36px;display:flex;gap:7px;align-items:flex-start}
.mcard .dg .g{font-family:var(--font-mono);color:var(--ink-3);flex:none}
.mcard .m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--ink-3)}
.mcard .m3 b{display:block;font:600 13.5px var(--font-mono);color:var(--ink)}
.mcard .m4{display:flex;gap:6px;flex-wrap:wrap}
.scp{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--font-mono);padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.sdot{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font-ui);padding:2px 9px 2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.sdot.work{background:var(--ok-bg);color:var(--ok)}.sdot.ask{background:var(--warn-bg);color:var(--warn)}.sdot.done{background:var(--info-bg);color:var(--info)}.sdot.stuck{background:var(--err-bg);color:var(--err)}

/* sessions */
.sl-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sl-row:last-child{border-bottom:0}
.sl-row:hover{background:var(--hover)}
.sl-row .sid{font:500 12px var(--font-mono);color:var(--ink-3)}
.sl-row .pr{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-row .mt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:2px}
.sl-row .rs{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--ink-2);font:600 15px var(--font-mono)}
.sl-row .rs.live{background:var(--ok-bg);color:var(--ok)}
.sl-row .acts{display:flex;gap:6px}
.prune{display:grid;grid-template-columns:auto auto 1fr;gap:14px;align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650;color:var(--ink-2)}
.inp,.sel{height:34px;padding:0 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:13.5px;color:var(--ink);min-width:0}
.inp.mono{font-family:var(--font-mono);font-size:13px}
.inp:focus,.sel:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.inp[type="number"]{width:84px}

/* preferences */
.prefs{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.pnav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;background:var(--surface)}
.pnav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.pnav button:hover{background:var(--surface-2);color:var(--ink)}
.pnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-2)}
.pnav h6{margin:12px 10px 4px;font:700 10.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pcont{overflow-y:auto;padding:22px 28px 32px;scrollbar-width:thin}
.pcont .page-in{max-width:760px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sl{min-width:0}
.setrow .sl b{display:block;font-size:14px;font-weight:650}
.setrow .sl span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px;line-height:1.4}
.setrow .sl code{font-size:.9em}
.seg2{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-3);gap:2px}
.seg2 button{height:28px;padding:0 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg2 button.dng[aria-pressed="true"]{background:var(--err);color:var(--on-accent)}
.seg2 button.dng{color:var(--err)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-2);transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-knob);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.danger-z{border:1px solid var(--err-line);border-radius:12px;background:repeating-linear-gradient(135deg,var(--err-bg) 0 10px,var(--surface) 10px 20px);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.danger-z h4{margin:0;display:flex;gap:8px;align-items:center;color:var(--err);font-size:14px}
.danger-z p{margin:0;font-size:13px;color:var(--ink-2)}
.mtable td .st2{display:inline-flex;align-items:center;gap:6px}
.starb{color:var(--ink-3);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px}
.starb:hover{background:var(--surface-3)}
.starb[aria-pressed="true"]{color:var(--i-wr)}
.starb[aria-pressed="true"] svg{fill:var(--c-wr)}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}

/* search results */
.res-g{display:flex;flex-direction:column;gap:2px}
.res-g h5{margin:8px 0 4px;font:700 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.res-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;width:100%;text-align:left}
.res-i:hover{background:var(--hover)}
.res-i .rt{flex:1;min-width:0;font-size:14px}
.res-i .rt small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-i mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 1px}

/* help card */
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;font-size:13px}
.hgrid .hc{display:flex;gap:10px;align-items:baseline;padding:3px 0;min-width:0}
.hgrid .hc button{font:600 12.5px var(--font-mono);color:var(--accent-2);white-space:nowrap}
.hgrid .hc button:hover{text-decoration:underline}
.hgrid .hc span{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.helph{font:700 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px}
.cc{max-width:700px}
.cc .cb{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cc .cb p{margin:0;font-size:13.5px;color:var(--ink-2)}
.cc .cf{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.helpt{font:400 12px/1.6 var(--font-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;white-space:pre;color:var(--code-ink);overflow-x:auto}
.ropt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);width:100%;background:var(--surface);font-size:13.5px}
.ropt:hover{border-color:var(--accent);background:var(--accent-soft)}
.ropt .rl{flex:1;min-width:0}
.ropt .rl small{display:block;color:var(--ink-3);font-size:12px}
.ropt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ropt.dng{border-color:var(--err-dot);background:repeating-linear-gradient(135deg,var(--err-bg) 0 8px,var(--surface) 8px 16px)}
.ropt.dng:hover{background:var(--err-bg)}
.ropt .rr{font:600 12px var(--font-mono);color:var(--ink-2)}
.lyr{display:grid;grid-template-columns:34px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.lyr .lb{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.lyr .lb i{display:block;height:100%;border-radius:5px}
.lyr .g{font:700 12px var(--font-mono)}
.lyr .v{font:500 12.5px var(--font-mono);text-align:right}

/* ───────── palette, popovers, toasts ───────── */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:11vh 16px 16px;animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pal{width:100%;max-width:640px;max-height:min(560px,78vh);display:flex;flex-direction:column;border-radius:16px;background:var(--surface);box-shadow:var(--sh-3);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:54px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.pal-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink);height:100%}
.pal-in kbd{font:600 11px var(--font-mono);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;color:var(--ink-3)}
.pal-l{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 8px;scrollbar-width:thin}
.pal-g{padding:10px 10px 4px;font:700 10.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pi{display:flex;align-items:center;gap:11px;width:100%;min-height:40px;padding:6px 10px;border-radius:9px;text-align:left}
.pi[aria-selected="true"]{background:var(--accent-soft)}
.pi .pic{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);flex:none;font:700 13px var(--font-mono)}
.pi[aria-selected="true"] .pic{background:var(--surface)}
.pi .pt{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .pt small{font-weight:400;color:var(--ink-3);font-size:12.5px;margin-left:8px}
.pi .pt mark{background:none;color:var(--accent-2);font-weight:800}
.pi .pr2{font:500 11.5px var(--font-mono);color:var(--ink-3);flex:none}
.pi .av{flex:none}
.pal-f{display:flex;gap:14px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--ink-3)}
.pal-f span{display:inline-flex;gap:6px;align-items:center}
.pop{position:fixed;z-index:70;min-width:200px;max-width:340px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);box-shadow:var(--sh-3);padding:6px;animation:pop .13s ease-out}
.pop .mi{min-height:34px}
.pop h6{margin:6px 10px 4px;font:700 10.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pop .pbox{padding:8px 10px;font-size:13px;color:var(--ink-2);line-height:1.45}
.toasts{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:11px;background:var(--ink);color:var(--on-accent);font-size:13px;font-weight:550;box-shadow:var(--sh-2);animation:slidein .2s ease-out;pointer-events:auto}
.toast button{color:var(--c-mgr);font-weight:700;margin-left:6px}
.toast .tg{font:600 14px var(--font-mono)}
.toast.err .tg{color:var(--c-err)}.toast.ok .tg{color:var(--c-ts)}.toast.warn .tg{color:var(--c-wr)}
.modal{width:100%;max-width:520px;border-radius:16px;background:var(--surface);box-shadow:var(--sh-3);overflow:hidden;animation:pop .16s ease-out}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:750;font-size:16px}
.modal header .sp{flex:1}
.modal .mbd{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.modal .mfo{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.tabbar{display:none}

/* ───────── wide-but-not-huge: the panel floats over the main column ───────── */
@media (max-width:1359px){
  .app[data-panel="open"]{grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr)}
  .app .panel{position:absolute;right:0;top:0;bottom:0;width:min(var(--panel-w),100%);box-shadow:var(--sh-3)}
}
@media (max-width:1279px){
  :root{--side-w:248px}
  .mh .topic .sep,.mh .topic .hide-md{display:none}
}
@media (max-width:1279px){
  .sec-h .cap .legs{display:none}
}
@media (max-width:1100px){
  .mh .mem{display:none}
}
/* the main column is the container: it narrows when the details panel is open, not only with the window */
.mbody{container-type:inline-size;container-name:mb}
@container mb (max-width:900px){
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lane .lh{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--accent-line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .tbl .hide-lg{display:none}
  .page{padding-left:20px;padding-right:20px}
}
@container mb (max-width:760px){
  .prefs{display:flex;flex-direction:column}
  .pnav{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:4px;flex:none}
  .pnav button{white-space:nowrap;flex:none}
  .pnav h6{display:none}
  .pcont{padding:16px 20px 28px}
  .setrow{grid-template-columns:minmax(0,1fr)}
  .setrow>:last-child{justify-self:start}
}
@container mb (max-width:560px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .lane{display:flex;flex-direction:column}
  .lane .lw{border-right:0;border-bottom:1px solid var(--line)}
}

/* ───────── phone and narrow tablet: one pane at a time ───────── */
@media (max-width:819px){
  :root{--head-h:54px}
  .app,.app[data-panel="open"]{display:block;position:relative}
  .rail{display:none}
  .side,.main,.panel{position:absolute;inset:0;width:auto;border:0;box-shadow:none}
  .app[data-m="home"] .main,.app[data-m="home"] .panel{display:none}
  .app[data-m="view"] .side,.app[data-m="view"] .panel{display:none}
  .app[data-m="panel"] .side{display:none}
  .app[data-m="panel"] .main{display:none}
  .app[data-m="home"] .side{padding-bottom:58px}
  .side-top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side-scroll{padding-bottom:16px}
  .side .mock-m{display:flex}
