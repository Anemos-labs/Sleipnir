  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;left:0;right:0;bottom:0;z-index:30;height:58px;background:var(--rail);border-top:1px solid var(--side-line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .app:not([data-m="home"]) .tabbar{display:none}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--side-ink-3);font-size:11px;font-weight:650;position:relative}
  .tabbar button[aria-current="true"]{color:var(--side-ink)}
  .tabbar .bdg{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;font-size:10px;padding:0 4px}
  .mh{padding:0 8px 0 4px;gap:4px;padding-top:env(safe-area-inset-top,0px);height:calc(var(--head-h) + env(safe-area-inset-top,0px))}
  .mh .back{display:inline-grid}
  .mh .ttl h1{font-size:16px}
  .mh .topic{display:none}
  .mh .tools{gap:2px}
  .mh .mem,.mh .hide-sm,.mh .ttl .rp,.mh .ttl .sdot{display:none}
  .warm{height:28px;padding:0 9px 0 6px;font-size:12px}
  .warm .wlab{display:none}
  .goalbar-in{padding:8px 16px}
  .goalbar .gtx{display:none}
  .seg{flex:1}.seg i{flex:1;width:auto}
  .stream{padding-top:8px}
  .stream-in{padding:0 4px}
  .msg{grid-template-columns:32px minmax(0,1fr);column-gap:10px;padding:6px 12px}
  .msg .mt{width:32px}
  .sys,.feed,.mq,.mailm{grid-template-columns:32px minmax(0,1fr);column-gap:10px;padding-left:12px;padding-right:12px}
  .msg .tb{display:none!important}
  .day,.newrule{margin-left:16px;margin-right:16px}
  .card,.bcard,.askc,.plan,.qmsg,.mailq{max-width:100%}
  .dock{padding:6px 12px 0}
  .cbar .hint,.cbar .hide-sm{display:none}
  .mfoot{padding:0 16px;height:28px}
  .mfoot .l{display:none}
  .mfoot .sp{display:none}
  .mfoot{justify-content:flex-end}
  .askbar{margin:0 12px 8px}
  .page{padding:16px 16px 28px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-t b{font-size:22px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .board{padding:14px 16px 24px}
  .bcard .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prefs{display:flex;flex-direction:column}
  .pnav{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:4px;flex:none}
  .pnav button{white-space:nowrap;flex:none}
  .pnav h6{display:none}
  .pcont{padding:16px 16px 28px}
  .setrow{grid-template-columns:minmax(0,1fr)}
  .setrow>:last-child{justify-self:start}
  .panel{z-index:10}
  .pnh{padding:0 8px 0 6px}
  .pnh .back{display:inline-grid}
  .tbl .hide-sm2{display:none}
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .hgrid{grid-template-columns:minmax(0,1fr)}
  .prune{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .prune>:last-child{grid-column:1/-1}
  .sl-row{grid-template-columns:32px minmax(0,1fr)}
  .sl-row .acts{grid-column:2}
  .scrim{padding:0}
  .pal{max-width:none;max-height:100%;height:100%;border-radius:0}
  .toasts{top:calc(64px + env(safe-area-inset-top,0px))}
  .term{font-size:12px}
  .askc .scp{display:none}
  .askc .ab{gap:8px}
  .choice{min-height:38px}
  .stat .sep:first-of-type{display:none}
  .askc .ah{flex-wrap:wrap}
  .tcard .vbar{flex-wrap:wrap}
  .facts{grid-template-columns:84px minmax(0,1fr)}
}
@media (min-width:820px){.pnh .back{display:none}}
@media (max-width:420px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lane .big{font-size:20px}
  .goalbar .cnt{display:none}
}

/* ───────── short windows: keep the conversation in view ───────── */
@media (max-height:800px){
  .side-top{gap:6px;padding:10px 14px 8px}
  .side-top .chips{display:none}
  .conn{padding:4px 9px}
  .qs{height:30px}
  .askc .scp{display:none}
  .askc .ab{gap:8px;padding-top:10px}
  .choices{gap:5px;padding:6px 14px 10px}
  .choice{min-height:36px;padding:5px 12px}
  .stat{min-height:28px;padding-bottom:4px}
}

/* ───────── motion ───────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .typing i{opacity:.7}
  .pd-work::after{display:none}
  .tool.run .tg{animation:none}
  .caret{animation:none}
}
.app.calm *,.app.calm *::before,.app.calm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

/* ───────── odds and ends ───────── */
.td{display:inline-block;max-width:100%;vertical-align:middle}
.td[open]{display:block}
.td>summary{list-style:none;cursor:pointer}
.td>summary::-webkit-details-marker{display:none}
.td>summary .tool:hover{border-color:var(--accent-line)}
.td[open]>summary .tool{border-bottom-left-radius:0;border-bottom-right-radius:0}
.td>.tout{margin:0;border-top-left-radius:0;max-width:640px;max-height:220px;overflow:auto}
.qtag{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:600}
.sc2{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--accent-2)}
.sys-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.sys-inline svg{color:var(--ink-3)}
.sys-inline b{color:var(--ink)}
.linkb{color:var(--accent-2);font-weight:650}
.linkb:hover{text-decoration:underline}
.mempty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:14px}
.pic{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);flex:none;font:700 13px var(--font-mono)}
.whyt code{font-size:.9em}
.msg .mb .card+.card{margin-top:8px}
.mb .tools+.card,.mb .tools+.td{margin-top:8px}
.card .ex{padding:6px 12px;font:italic 12px var(--font-ui);color:var(--ink-3);border-top:1px dashed var(--line-2);background:var(--surface-2)}
@media (max-width:819px){.hide-sm{display:none!important}}
.pop .mn{font:600 13.5px var(--font-ui)}

.mh .tpb{color:var(--ink-3);text-align:left;border-radius:6px;padding:2px 4px;margin:-2px -4px}

const HLRX=/(\/\/.*$)|("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*')|\b(package|import|func|type|struct|const|var|return|for|range|if|else|switch|case|default|go|defer|map|interface|let|async|await|function|new|true|false|nil|null)\b|\b(\d+)\b/g;
function hl(line){
  let out='',last=0,m;HLRX.lastIndex=0;
  while((m=HLRX.exec(line))){
    out+=esc(line.slice(last,m.index));

  return out+esc(line.slice(last));
}

const CODE_ITEMS=`package catalog

import "sort"

// MaxSize is the largest page a client may ask for.
const MaxSize = 48

// Item is one thing the shop sells. Prices are in cents.
type Item struct {
	ID         string \`json:"id"\`
	Name       string \`json:"name"\`
	PriceCents int64  \`json:"price_cents"\`
}

// Page is one page of the catalogue, counted from 1.
type Page struct {
	Items []Item \`json:"items"\`
	Page  int    \`json:"page"\`
	Pages int    \`json:"pages"\`
	Total int    \`json:"total"\`
}

// Store holds the catalogue in memory, sorted by ID.
type Store struct{ rows []Item }

// New returns a Store over rows, sorted by ID.
func New(rows []Item) *Store {
	s := &Store{rows: append([]Item(nil), rows...)}
	sort.Slice(s.rows, func(i, j int) bool { return s.rows[i].ID < s.rows[j].ID })
	return s
}

// List returns page number page (from 1) of at most size items. A page below 1 is page 1,
// a page past the end is the last page, and a size outside 1..MaxSize is clamped.
func (s *Store) List(page, size int) Page {
	size = min(max(size, 1), MaxSize)
	pages := (len(s.rows) + size - 1) / size
	page = min(max(page, 1), max(pages, 1))
	lo := (page - 1) * size
	hi := min(lo+size, len(s.rows))
	return Page{Items: s.rows[lo:hi], Page: page, Pages: pages, Total: len(s.rows)}
}`;

function diffLines(b){
  const out=[];
  if(b.code){String(b.code).split('\n').forEach((l,i)=>out.push({t:'+',s:l,n:i+1,m:''}));return out}
  let o=0,n=0;
  String(b.diff).split('\n').forEach(l=>{
    if(l.startsWith('@@')){const m=/@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l);o=m?+m[1]:0;n=m?+m[2]:0;out.push({t:'@',s:l,n:'',m:''});return}
    const c=l[0],s=l.slice(1);
    if(c==='+'){out.push({t:'+',s,n:n++,m:''})}
    else if(c==='-'){out.push({t:'-',s,n:o++,m:''})}
    else{out.push({t:' ',s,n:n++,m:''});o++}
  });
  return out;
}

  }).join('');
  const hidden=Math.max(0,lines.length-head);
  return '<div class="card" data-diff="'+esc(b.file)+'"><div class="ch"><span class="fl '+b.fl+'" title="'+(b.fl==='A'?'added':'modified')+'">'+b.fl+'</span><span class="fp">'+esc(b.file)+'</span>'

  Object.keys(S.msgs).forEach(ch=>{if(ch.startsWith('mail:'))return;S.msgs[ch].forEach(m=>{if(m.tasks&&m.tasks.includes(task)&&!m.ephem&&(m.kind!=='feed'||m.mail))out.push(m)})});

}

/* ───────── stream mounting and appending ───────── */
function dayHTML(m){return '<div class="day"><span>'+esc(m.label)+'</span></div>'}
function streamHTML(ch){
  const arr=S.msgs[ch]||[];let prev=null,h='';
  arr.forEach(m=>{
    if(S.newAt&&S.newAt[ch]===m.id)h+='<div class="newrule"><span>New</span></div>';
    if(m.kind==='day'){h+=dayHTML(m);prev=null;return}
    h+=msgHTML(m,isCont(prev,m));prev=m;
  });
  return h;
}
function nearBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<100}
function scrollBottom(){const s=$('#stream');if(s)s.scrollTop=s.scrollHeight}
function mountStream(ch,label,pre){
  $('#mbody').innerHTML=(pre||'')+'<div class="stream" id="stream" tabindex="0" role="log" aria-label="Messages in '+esc(label)+'"><div class="stream-in" id="stream-in">'+streamHTML(ch)+'<div id="typing-row"></div></div></div><button type="button" class="jump" id="jump" hidden data-act="jump">↓ New messages</button>';
  scrollBottom();updateTyping();
  const st=$('#stream');st.addEventListener('scroll',()=>{const j=$('#jump');if(j&&nearBottom(st))j.hidden=true},{passive:true});
}
function appendDOM(m){
  const sin=$('#stream-in');if(!sin)return;
  const st=$('#stream');const stick=nearBottom(st);
  const arr=S.msgs[S.view]||[];const i=arr.indexOf(m);const prev=i>0?arr[i-1]:null;
  let html='';
  if(S.newAt&&S.newAt[S.view]===m.id)html+='<div class="newrule"><span>New</span></div>';
  html+=m.kind==='day'?dayHTML(m):msgHTML(m,isCont(prev,m));
  $('#typing-row').insertAdjacentHTML('beforebegin',html);
  if(stick)scrollBottom();else{const j=$('#jump');if(j)j.hidden=false}
  updateAskVisibility();
}
function rerender(m){
  $$('[data-mid="'+m.id+'"]').forEach(el=>{
    const prev=null;const tmp=document.createElement('div');
    tmp.innerHTML=msgHTML(m,el.classList.contains('cont'));
    const n=tmp.firstElementChild;n.style.animation='none';el.replaceWith(n);
  });
}
function post(ch,m){
  m.id=++S.mid;m.ch=ch;if(m.t==null)m.t=S.simT;if(m.kind==null)m.kind='msg';
  (S.msgs[ch]||(S.msgs[ch]=[])).push(m);
  if(S.simT>0.4&&S.newAt&&!S.newAt[ch]&&!m.ephem)S.newAt[ch]=m.id;
  if(S.view===ch)appendDOM(m);
  else if(!m.ephem&&m.kind!=='day'){
    const key=ch.startsWith('mail:')?null:ch;
    if(key&&m.who!=='you'){S.unread[key]=(S.unread[key]||0)+1}
    if(ch.startsWith('mail:')){S.mailUnread[ch.slice(5)]=(S.mailUnread[ch.slice(5)]||0)+1}
    patchSide();
  }
  if(S.panel&&S.panel.type==='task'&&m.tasks&&m.tasks.includes(S.panel.id))refreshPanel();
  return m;
}

/* ───────── search ───────── */
function searchResults(q){
  q=q.trim().toLowerCase();const out={msgs:[],cmds:[],sess:[],files:[],chans:[]};
  if(!q)return out;
  const hit=s=>String(s).toLowerCase().includes(q);
  const strip=m=>{const bl=m.blocks||[];const hasTool=bl.some(b=>b.k==='tool'||b.k==='tools');return bl.map(b=>b.k==='diff'?(hasTool?'':b.file):b.k==='tool'?b.name+' '+(b.arg||''):b.k==='tools'?b.items.map(i=>i.name+' '+i.arg).join(' '):b.k==='vcard'?b.title+' '+b.cmd:(b.t||'')).join(' ').replace(/[*`]/g,'')+(m.text||'')+' '+(m.verb||'')+' '+(m.target||'')};
  Object.keys(S.msgs).forEach(ch=>{S.msgs[ch].forEach(m=>{if(m.kind==='day')return;const t=strip(m);if(t.trim()&&hit(t))out.msgs.push({ch,m,t})})});
  out.msgs=out.msgs.slice(-12).reverse();
  out.cmds=COMMANDS.filter(c=>hit(c.name)||hit(c.desc)).slice(0,8);
  out.sess=SESSIONS.filter(s=>hit(s.prompt)||hit(s.id));
  out.files=FILES.filter(hit);
  out.chans=CHANNELS.filter(c=>hit(c.name)||hit(c.topic)).map(c=>({id:c.id,t:'#'+c.name,d:c.topic})).concat(ORDER.filter(id=>hit(id)||hit(AG[id].role)||hit(S.ag[id].doing)).map(id=>({id:id==='mgr'?'hall':'rider:'+id,t:AG[id].name,d:AG[id].role+' · '+S.ag[id].doing.replace(/`/g,'')})));
  return out;
}
function markq(s,q){
  s=String(s);const i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0||!q)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));
}
function searchHTML(){
  const q=S.searchQ,r=searchResults(q);
  const g=(t,list)=>list.length?'<div class="res-g"><h5>'+t+' · '+list.length+'</h5>'+list.join('')+'</div>':'';
  return '<div class="page"><div class="page-in"><div class="ptitle"><div><h2>Search</h2><p>Messages, commands, sessions, files and riders for “<b>'+esc(q)+'</b>”.</p></div></div><label class="fld"><span class="sr">Search</span><input class="inp" id="srch-in" value="'+esc(q)+'" placeholder="Search…" style="height:42px;font-size:15px;width:100%"></label>'
   +(q?g('Messages',r.msgs.map(x=>'<button type="button" class="res-i" data-gom="'+x.ch+'" data-mid2="'+x.m.id+'">'+av(x.m.who||x.m.from||'harness',28)+'<span class="rt">'+markq(x.t.length>110?x.t.slice(0,110)+'…':x.t,q)+'<small>'+esc(chLabel(x.ch))+' · '+clock(x.m.t).slice(0,8)+'</small></span></button>'))
    +g('Riders and channels',r.chans.map(x=>'<button type="button" class="res-i" data-go="'+x.id+'"><span class="pic" style="display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-3)">'+ic('hash',14)+'</span><span class="rt">'+markq(x.t,q)+'<small>'+esc(x.d)+'</small></span></button>'))
    +g('Commands',r.cmds.map(c=>'<button type="button" class="res-i" data-cmd="'+esc(c.name)+'"><span class="pic mono" style="display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-3)">/</span><span class="rt"><span class="mono">'+markq(c.name,q)+'</span><small>'+esc(c.desc)+'</small></span></button>'))
    +g('Sessions',r.sess.map(s=>'<button type="button" class="res-i" data-go="sessions"><span class="pic" style="display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-3)">'+(s.live?'●':'↺')+'</span><span class="rt">'+markq(s.prompt,q)+'<small class="mono">'+s.id+'</small></span></button>'))
    +g('Files',r.files.map(f=>'<button type="button" class="res-i" data-file="'+f+'"><span class="pic" style="display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-3)">'+ic('file',14)+'</span><span class="rt mono">'+markq(f,q)+'</span></button>'))
    +((r.msgs.length+r.chans.length+r.cmds.length+r.sess.length+r.files.length)?'':'<div class="empty">Nothing matches “'+esc(q)+'”.</div>'):'<div class="empty">Type to search every message, command, session and file.</div>')
   +'</div></div>';
}

/* ───────── toasts and popovers ───────── */
function toast(msg,o){
  o=o||{};const t=document.createElement('div');t.className='toast '+(o.tone||'');
  t.innerHTML='<span class="tg">'+(o.g||(o.tone==='err'?'⚠':o.tone==='ok'?'✓':'◇'))+'</span><span>'+esc(msg)+'</span>'+(o.action?'<button type="button">'+esc(o.action[0])+'</button>':'');
  if(o.action)t.querySelector('button').addEventListener('click',()=>{o.action[1]();t.remove()});
  const w=$('#toasts');w.appendChild(t);while(w.children.length>3)w.firstChild.remove();
  setTimeout(()=>t.remove(),o.ms||3600);
}
function mockToast(what){toast((what||'The mock')+' does nothing outside this page.',{g:'MOCK'})}
function popover(anchor,html,pick,o){
  closePopover();o=o||{};
  const p=document.createElement('div');p.className='pop';p.id='popover';p.setAttribute('role','menu');p.innerHTML=html;
  $('#overlay').appendChild(p);
  const r=anchor.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  let x=o.right?r.right-pw:r.left,y=o.up?r.top-ph-6:r.bottom+6;
  x=Math.max(8,Math.min(x,innerWidth-pw-8));y=Math.max(8,Math.min(y,innerHeight-ph-8));
  p.style.left=x+'px';p.style.top=y+'px';
  p.addEventListener('click',e=>{const b=e.target.closest('[data-pv]');if(b){closePopover();pick(b.dataset.pv)}});
  const f=$('[data-pv]',p);if(f)f.focus();
  setTimeout(()=>document.addEventListener('mousedown',popOutside),0);
  S.popAnchor=anchor;
}
function popOutside(e){const p=$('#popover');if(p&&!p.contains(e.target))closePopover()}
function closePopover(){const p=$('#popover');if(p){p.remove();document.removeEventListener('mousedown',popOutside);if(S.popAnchor&&document.contains(S.popAnchor))S.popAnchor.focus();S.popAnchor=null}}

function wrapHelp(t,w){
  w=w||80;const lines=t.split('\n'),out=[];let buf='';
  const flush=()=>{if(!buf)return;let l='';buf.split(' ').forEach(wd=>{if((l+' '+wd).trim().length>w){out.push(l);l=wd}else l=(l+' '+wd).trim()});if(l)out.push(l);buf=''};
  lines.forEach(L=>{
    const keep=!L.trim()||/^\s/.test(L)||/^(usage|Usage|sleipnir |modes:|commands:|flags|Example)/.test(L)||L.length<=w;
    if(keep){flush();if(L.length>w&&/^\s+-/.test(L)){out.push(L)}else out.push(L)}
    else buf+=(buf?' ':'')+L.trim();
  });flush();return out.join('\n');
}

}

function runCommand(raw){
  raw=raw.trim();if(!raw)return;
  if(raw[0]!=='/'){return false}
  const sp=raw.indexOf(' ');const name=sp<0?raw:raw.slice(0,sp),arg=sp<0?'':raw.slice(sp+1).trim();

function scoreOf(text,q){
  if(!q)return 1;text=text.toLowerCase();q=q.toLowerCase();
  const i=text.indexOf(q);if(i>=0)return 200-i+(i===0?60:0)-text.length*.1;
  let j=0;for(const ch of text){if(ch===q[j])j++;if(j===q.length)return 20-text.length*.05}
  return 0;
}
function sc2(title,sub,q){
  if(!q)return 1;

}
function palItems(raw){

function interruptConfirm(anchor,id){
  const mg=id==='mgr';
  popover(anchor,'<h6>Interrupt '+(mg?'the manager':id)+'?</h6><div class="pbox">'+(mg?'Esc cancels the running turn and <b>pauses the goal</b>. Nothing is lost; Resume continues it.':'Its running turn is cancelled, its lease stays, and the manager is told. The mock holds the whole run for a few seconds.')+'</div><button type="button" class="mi" data-pv="yes"><span class="mn" style="color:var(--err)">Interrupt</span><span class="md">esc</span></button><button type="button" class="mi" data-pv="no"><span class="mn">Keep going</span></button>',v=>{
    if(v!=='yes')return;
    if(mg)pauseRun(true);
    else{
      S.paused=true;sysRow('hall','◌','warn','<b>You interrupted '+id+'</b>. Its turn stopped; its lease is kept and the manager is told.');setAg(id,'wait','interrupted by you; waiting for a steer');
      setTimeout(()=>{S.paused=false;setAg(id,id==='be-2'?'edit':'wait',id==='be-2'?'editing api/cart/cart.go: Remove() in cents':S.ag[id].doing);sysRow('hall','▸','acc','The manager restarted <b>'+id+'</b> from its notes.')},4000);
    }
  },{up:true,right:true});
}
function simSetSwitch(id,on){
  if(id==='anim'){S.anim=on;$('#app').classList.toggle('calm',!on)}
  if(id==='verbose')S.verbose=on;
}

/* ───────── events ───────── */
function onClick(e){
  const T=e.target;let el;
  if((el=T.closest('.sec-h'))){const k=el.dataset.sec;const open=el.getAttribute('aria-expanded')!=='false';el.setAttribute('aria-expanded',String(!open));const b=$('[data-secb="'+k+'"]');if(b)b.hidden=open;return}
  if((el=T.closest('[data-choice]'))){
    if(el.getAttribute('aria-disabled')==='true'){toast('Keys arm after a pause. Your typing goes to the prompt until then.',{g:'⏎'});return}
    const n=+el.dataset.choice;
    if(n===3){S.q.compose=true;refreshDyn('ask');const t=$('#nsay-t');if(t)t.focus()}else answerQ(n);return;
  }
  if((el=T.closest('[data-cmd]'))){const c=el.dataset.cmd;if(c[0]==='/')runCommand(c);else runProgram(c);return}
  if((el=T.closest('[data-fill]'))){go(streamView(S.view)?S.view:'hall');const ta=$('#composer-input');ta.value=el.dataset.fill;renderMirror();ta.focus();detectMenu();return}
  if((el=T.closest('[data-setmode]'))){const m=el.dataset.setmode;if(m==='bypass'||m==='yolo')dangerModal(m);else{setMode(m,false);$$('[data-setmode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setmode===m)))}return}
  if((el=T.closest('[data-setmodel]'))){setModel(el.dataset.setmodel);return}
  if((el=T.closest('[data-seteffort]'))){S.effort=el.dataset.seteffort;$$('[data-seteffort]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.seteffort===S.effort)));return}
  if((el=T.closest('[data-rewind]'))){toast('Files restored to before '+el.dataset.rewind+' (mock: nothing changed)',{tone:'ok'});return}
  if((el=T.closest('[data-fav]'))){const r=el.dataset.fav;S.favs[r]=!S.favs[r];el.setAttribute('aria-pressed',String(!!S.favs[r]));return}
  if((el=T.closest('[data-pick]'))){S.model=el.dataset.pick;patchSide();const tb=$('#mtbody');if(tb)tb.innerHTML=modelRows(S.mflt);toast('Model: '+S.model.split('/').pop()+'. A team starts again on it (mock).',{});return}
  if((el=T.closest('[data-pref]'))){S.prefs=el.dataset.pref;const c=$('#pcont');$$('[data-pref]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.pref===S.prefs)));c.innerHTML='<div class="page-in">'+prefSection(S.prefs)+'</div>';c.scrollTop=0;return}
  if((el=T.closest('[data-seg]'))){
    const k=el.dataset.seg,v=el.dataset.v;
    el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
    if(k==='effort')S.effort=v;if(k==='mode'){S.mode=v;patchSide();syncComposer()}
    return;
  }
  if((el=T.closest('[data-sw]'))){const on=el.getAttribute('aria-checked')!=='true';el.setAttribute('aria-checked',String(on));simSetSwitch(el.dataset.sw,on);return}
  if((el=T.closest('[data-tag]'))){const on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(on));S.mflt=S.mflt||{};S.mflt[el.dataset.tag]=on;$('#mtbody').innerHTML=modelRows(S.mflt);return}
  if((el=T.closest('[data-resume]'))){toast('Resuming '+el.dataset.resume.slice(9)+' needs the terminal: sleipnir --resume '+el.dataset.resume.slice(0,15),{g:'↺',ms:5000});return}
  if((el=T.closest('[data-file]'))){go('hall');const ta=$('#composer-input');ta.value='@'+el.dataset.file+' ';renderMirror();ta.focus();return}
  if((el=T.closest('[data-gom]'))){const ch=el.dataset.gom,id=+el.dataset.mid2;go(ch);const d=$('[data-mid="'+id+'"]');if(d){d.scrollIntoView({block:'center'});d.classList.add('flash')}return}
  if((el=T.closest('[data-rule-rm]'))){S.rules.splice(+el.dataset.ruleRm,1);$('#pcont').innerHTML='<div class="page-in">'+prefSection('perm')+'</div>';return}
  if((el=T.closest('[data-ag-steer]'))){go('rider:'+el.dataset.agSteer);$('#composer-input').focus();return}
  if((el=T.closest('[data-act]'))){act(el.dataset.act,el,e);return}
  if((el=T.closest('[data-task]'))){openPanel('task',el.dataset.task);return}
  if((el=T.closest('[data-ag]'))&&el.dataset.ag){const id=el.dataset.ag;openPanel('rider',id);if(el.matches('.mcard,[data-ag].men,.who'))return;return}
  if((el=T.closest('[data-go]'))){go(el.dataset.go);if(isPhone())$('#app').dataset.m='view';return}
}
function act(a,el,e){
  const msgEl=el.closest('[data-mid]');
  switch(a){
    case 'palette':openPalette('');break;
    case 'panel-toggle':
      if(S.panel){closePanel();break}
      if(S.view.startsWith('rider:'))openPanel('rider',S.view.slice(6));else if(S.view==='hall')openPanel('goal');else openPanel('task','T4');break;
    case 'panel-close':closePanel();break;
    case 'back':$('#app').dataset.m='home';break;
    case 'goal-panel':openPanel('goal');break;
    case 'jump':scrollBottom();$('#jump').hidden=true;break;
    case 'reply':{const m=msgEl&&findMsg(msgEl.dataset.mid);if(!m)break;if(m.tasks&&m.tasks.length)openPanel('task',m.tasks[0]);else openPanel('msg',m.id);break}
    case 'copy':{const m=msgEl&&findMsg(msgEl.dataset.mid);copyText(m?msgText(m):'');break}
    case 'rewind':runCommand('/rewind');break;
    case 'more':popover(el,'<button type="button" class="mi" data-pv="copy"><span class="mn">Copy text</span></button><button type="button" class="mi" data-pv="thread"><span class="mn">Open thread</span></button><button type="button" class="mi" data-pv="pin"><span class="mn">Pin to #hall</span></button><button type="button" class="mi" data-pv="unread"><span class="mn">Mark unread</span></button>',v=>{const m=msgEl&&findMsg(msgEl.dataset.mid);if(v==='copy')copyText(m?msgText(m):'');else if(v==='thread')act('reply',el,e);else mockToast('That')},{right:true});break;
    case 'dismiss':{const id=msgEl&&+msgEl.dataset.mid;if(id){const a=S.msgs[S.view];const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);msgEl.remove()}break}
    case 'more-diff':{const card=el.closest('.card'),d=$('.dif',card);d.classList.toggle('open');const hid=$$('.dl.hidden',card).length;el.textContent=d.classList.contains('open')?'Show less':'Show '+hid+' more lines';break}
    case 'copy-diff':copyText(el.closest('[data-diff]').dataset.diff);break;
    case 'mute-cache':toast('Cache alerts muted for this session (mock)',{});break;
    case 'mode-cycle':cycleMode();break;
    case 'model':runCommand('/model');break;
    case 'budget':go('prefs');S.prefs='effort';go('prefs');break;
    case 'proj':popover(el,'<h6>shop · ~/projects/shop</h6><button type="button" class="mi" role="menuitem" data-pv="prefs"><span class="mn">Preferences</span></button><button type="button" class="mi" role="menuitem" data-pv="sess"><span class="mn">Sessions</span></button><button type="button" class="mi" role="menuitem" data-pv="replay"><span class="mn">Replay the scripted run</span></button><button type="button" class="mi" role="menuitem" data-pv="url"><span class="mn">Copy the launch URL</span><span class="md">token stays in this tab</span></button>',v=>{if(v==='prefs')go('prefs');else if(v==='sess')go('sessions');else if(v==='replay')replay();else mockToast('The launch URL')});break;
    case 'interrupt':interruptConfirm(el,el.dataset.ag||'mgr');break;
    case 'resume':pauseRun(false);break;
    case 'steer-focus':go('rider:'+el.dataset.ag);setTimeout(()=>$('#composer-input').focus(),20);break;
    case 'reassign':popover(el,'<h6>Reassign '+S.ag[el.dataset.ag].task+'</h6><div class="pbox">The manager owns assignment: a worker’s task is reassigned by asking it. The mock does not move the lease.</div><button type="button" class="mi" data-pv="ask"><span class="mn">Ask the manager</span><span class="md">/steer</span></button>',v=>{go('hall');const ta=$('#composer-input');ta.value='Reassign '+S.ag[el.dataset.ag].task+' from '+el.dataset.ag+' to ';renderMirror();ta.focus()},{});break;
    case 'pfoot-send':{
      const t=$('#pfoot-t');const v=t.value.trim();if(!v)break;t.value='';const p=S.panel;
      if(p.type==='task'){const o=S.tasks[p.id].owner;sendToRider(o,v,p.id)}else if(p.type==='rider'){sendToRider(p.id,v,null)}else{const m=findMsg(p.id);if(m){m.replies=m.replies||[];m.replies.push({who:'you',t:S.simT,text:v});refreshPanel()}}
      break}
    case 'nsay-send':{const t=$('#nsay-t');const v=t.value.trim()||'use node:test, no new dependency';answerQ(3,v);break}
    case 'nsay-cancel':S.q.compose=false;refreshDyn('ask');break;
    case 'replay':replay();break;
    case 'goal-pause':pauseRun(S.goal.state!=='paused');renderPanel();break;
    case 'prune-list':{
      const old=SESSIONS.filter(s=>s.old);
      $('#pr-out').innerHTML='<table class="tbl"><tbody>'+old.map(s=>'<tr><td class="mono" style="font-size:12.5px">'+s.id+'</td><td>'+esc(s.prompt.slice(0,48))+'</td><td class="r">'+(s.cost*100|0)+'0 KB</td></tr>').join('')+'<tr><td colspan="3" class="dim" style="font-size:12.5px">'+old.length+' sessions would go. The newest 20 and anything written in the last ten minutes stay. Nothing was deleted.</td></tr></tbody></table>';
      const y=$('[data-act="prune-yes"]');if(y)y.disabled=false;break}
    case 'prune-yes':mockToast('Deleting sessions');break;
    case 'danger-mode':dangerModal(el.dataset.v);break;
    case 'dng-cancel':$('#dng').remove();break;
    case 'dng-yes':{const m=el.dataset.v;$('#dng').remove();S.mode=m;patchSide();syncComposer();toast(m+' is on. The footer and the composer say so until you leave it.',{tone:'err',g:'⚠',ms:5000});if(S.view==='prefs')$('#pcont').innerHTML='<div class="page-in">'+prefSection('perm')+'</div>';break}
    case 'mode-default':S.mode='default';patchSide();syncComposer();$('#pcont').innerHTML='<div class="page-in">'+prefSection('perm')+'</div>';break;
    case 'budget-off':S.budget=1e6;patchSide();toast('No dollar budget',{});break;
    case 'rule-add':{const i=$('#pf-rule');if(i&&i.value.trim()){S.rules.push(i.value.trim());$('#pcont').innerHTML='<div class="page-in">'+prefSection('perm')+'</div>'}break}
    case 'copy-text':copyText(el.dataset.t);break;
    case 'mock-reconnect':mockToast('Reconnecting a tool server');break;
    case 'toggle-paste':{const pre=el.closest('.mb').querySelector('pre.tout');if(pre){pre.hidden=!pre.hidden;el.textContent=pre.hidden?'show':'hide'}break}
    case 'ask-jump':flashAsk();break;
  }
}
function sendToRider(id,text,task){
  const ch='rider:'+id;
  const um=post(ch,{who:'you',t:S.simT,blocks:[{k:'steer',to:id},{k:'p',t:text}],tasks:task?[task]:[]});
  later(1.2,()=>{const r=REPLIES[id];const body=r[1];post(ch,{who:id,t:S.simT,tasks:task?[task]:[],blocks:[{k:'p',t:body}]});um.replies=[{who:id,t:S.simT,text:body}];if(S.panel)refreshPanel();touchWarm()});
  if(S.panel)refreshPanel();
}
function onKeyDown(e){
  S.lastKey=now();
  const k=e.key,mod=e.ctrlKey||e.metaKey;
  const ae=document.activeElement;
  const typing=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'||ae.isContentEditable);
  if(mod&&k.toLowerCase()==='k'){e.preventDefault();$('#pal')?closePalette():openPalette('');return}
  if($('#pal')){return}
  if(mod&&k.toLowerCase()==='t'){e.preventDefault();go('cache');return}
  if(mod&&k.toLowerCase()==='g'){e.preventDefault();go('team');return}
  if(mod&&k.toLowerCase()==='o'){e.preventDefault();const ds=$$('details.td');const any=ds.some(d=>!d.open);ds.forEach(d=>d.open=any);toast(any?'Tool output expanded':'Tool output collapsed',{});return}
  if(k==='Tab'&&e.shiftKey&&ae&&ae.id==='composer-input'){e.preventDefault();cycleMode();return}
  /* the approval question: digits only, never letters, and only after the pause */
  const q=S.q;
  if((k==='1'||k==='2'||k==='3')&&!mod&&!e.altKey&&q.open&&q.answer==null&&!q.compose){
    const okTarget=!typing||(ae.id==='composer-input'&&!ae.value);
    if(q.armed&&okTarget){e.preventDefault();if(k==='3'){q.compose=true;refreshDyn('ask');const t=$('#nsay-t');if(t)t.focus()}else answerQ(+k);return}
  }
  if(k==='Escape'){
    if($('#dng')){$('#dng').remove();return}
    if($('#popover')){closePopover();return}
    if(MENU){return}
    if(q.compose&&ae&&ae.id==='nsay-t'){q.compose=false;refreshDyn('ask');return}
    if(typing&&ae.id==='composer-input'&&ae.value){ae.blur();return}
    if(S.panel&&!isPhone()&&S.panel.type!=='x'&&!(q.armed&&q.answer==null&&q.open&&S.view==='hall')){closePanel();return}
    if(q.open&&q.answer==null&&q.armed&&!typing){e.preventDefault();q.compose=true;refreshDyn('ask');const t=$('#nsay-t');if(t)t.focus();return}
    if(S.panel){closePanel();return}
    if(isPhone()&&$('#app').dataset.m==='view'&&!typing){$('#app').dataset.m='home';return}
    return;
  }
  if(k==='/'&&!typing&&!mod){
    e.preventDefault();
    if(dockMode(S.view)==='compose'){const ta=$('#composer-input');ta.focus();if(!ta.value){ta.value='/';renderMirror();detectMenu()}}
    else openPalette('/');
    return;
  }
  if(k==='Enter'&&e.target&&e.target.id==='srch-in'){return}
}
function wireInputs(){
  document.addEventListener('click',onClick);
  document.addEventListener('keydown',onKeyDown,true);
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='srch-in'){S.searchQ=t.value;const pos=t.selectionStart;$('#mbody').innerHTML=searchHTML();const n=$('#srch-in');n.focus();n.setSelectionRange(pos,pos)}
    if(t.id==='nsay-t')S.q.text=t.value;
    if(t.id==='pf-budget'){const v=parseFloat(t.value);if(v>0){S.budget=v;patchSide()}}
  });
  document.addEventListener('keydown',e=>{
    if(e.target.id==='pfoot-t'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const b=$('[data-act="pfoot-send"]');if(b)b.click()}
    if(e.target.id==='nsay-t'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const b=$('[data-act="nsay-send"]');if(b)b.click()}
    if(e.target.dataset&&e.target.dataset.tag&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}
  });
  $('#rail-cur').addEventListener('click',()=>go('hall'));
  $('#rail-alt').addEventListener('click',()=>go('sessions'));
  $('#rail-new').addEventListener('click',()=>{go('hall');runCommand('/new')});
  $('#rail-prefs').addEventListener('click',()=>go('prefs'));
  $('#rail-conn').addEventListener('click',e=>popover(e.currentTarget,'<h6>Connection</h6><div class="pbox mono" style="font-size:12.5px">● 127.0.0.1:6969<br>loopback only<br>launch token ✓ (kept in this tab)</div><div class="pbox">This page is served by <code>sleipnir web</code> over the loopback interface and carries a launch token; nothing else may talk to the session.</div>',()=>{},{}));
  window.addEventListener('resize',()=>{
    const app=$('#app');
    if(!isPhone()&&app.dataset.m!=='view')app.dataset.m='view';
  });
  window.addEventListener('hashchange',()=>{const h=location.hash.replace(/^#\//,'').replace('/',':');if(h&&h!==S.view&&validView(h))go(h)});
}
function boot(again){
  initState();S.newAt={};S.vq=[];S.vmsg={};
  seed();S.last=now();S.lastKey=now();
  buildSide();buildTabbar();buildTimeline();simStart();
  $('#app').dataset.m=isPhone()?'view':'view';
  go('hall');
  if(innerWidth>=1360)openPanel('task','T4',true);
  renderHeader();updateWarm(true);
}
document.addEventListener('DOMContentLoaded',()=>{
  const h=location.hash.replace(/^#\//,'').replace('/',':');
  composerInit();wireInputs();boot(false);
  if(h&&validView(h))go(h);
  setInterval(tick,100);setInterval(armTick,50);
  window.LH={go:v=>go(v),S:()=>S,openPanel,closePanel,openPalette,answerQ,runCommand,rearm,replay};
});

</script>
