<div id="app" data-pv="cockpit" data-navmode="rail" data-rail="open">
  <header id="hud" role="banner">

      <span><span class="word">SLEIPNIR</span><span class="sub">web</span></span>
    </a>
    <button class="goalbtn" id="goalBtn" type="button" aria-label="Open the goal and its plan">
      <span class="lab"><span id="goalLab">Goal</span><i id="goalState">active</i><span class="el">elapsed <b class="num" id="vElapsed">00:38</b><span id="liveHint" class="live-hint" hidden></span></span></span>
      <span class="goal-t" id="goalT"></span>
    </button>
    <div class="hm budget" title="the budget of this session (--budget-usd)"><span class="lab">Budget</span><div class="gauge" role="img" aria-label="budget used"><i id="gaugeFill"></i></div><b><span id="vCost">$0.07</span> <em id="vBudget">of $5.00</em></b></div>
    <div class="ringbox hit" id="ringHit" title="share of the prompt read from the cache, the whole session (read / (read + uncached))"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle class="ring-track" cx="23" cy="23" r="19"/><circle class="ring-arc" id="hitArc" cx="23" cy="23" r="19" transform="rotate(-90 23 23)"/><text class="rv" id="hitTxt" x="23" y="28" text-anchor="middle">85</text></svg><div class="rt"><small>Cache hit</small><span class="note" id="hitNote">of the prompt</span></div><span class="hitchip" id="hitChip">cache <b><span id="hitChipN">85</span>%</b></span></div>
    <div class="ringbox warm" id="ringWarm" title="the provider's cache lifetime for the shared prefix: it refills whenever a request lands"><svg width="70" height="70" viewBox="0 0 64 64" id="warmSvg" role="img" aria-label="warm clock"><g id="warmTicks"></g><circle class="ring-track" cx="32" cy="32" r="22"/><circle class="ring-arc" id="warmArc" cx="32" cy="32" r="22" transform="rotate(-90 32 32)"/><circle class="ring-flash" id="warmFlash" cx="32" cy="32" r="26"/><text class="rv" id="warmTxt" x="32" y="37" text-anchor="middle" style="font-size:15px">0:25</text></svg><div class="rt"><small>Prefix warm</small><span class="note" id="warmNote">refills per request</span></div></div>
    <div class="hm team" id="teamBox"><small class="lab" id="teamLab">manager + 8 workers</small><b id="vAct"><span id="vActN">4</span> active <em id="vActOf">of 8 workers</em></b><span class="govtxt" id="govTxt">rpm 44 · 429s 0 · retries 0</span></div>
  </header>

  <div id="sstrip" class="sstrip" role="group" aria-label="Sessions"></div>

  <nav id="nav" class="dock-nav" aria-label="Views"></nav>

  <main id="main" tabindex="-1">
    <div class="banner" id="banner" hidden role="status"></div>
    <button class="qbanner" id="qBanner" type="button" hidden><b>?</b><span id="qBannerT"></span><span class="go">answer ▸</span></button>
    <div class="views" id="views"></div>
  </main>

  <aside id="rail" aria-label="Radio: the conversation with the manager, and what the team is doing">
    <div id="railSplit" class="rsplit" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize the Radio rail" aria-valuemin="280" aria-valuemax="640" aria-valuenow="344"></div>
    <div class="ph rail-h"><h2>Manager</h2><span class="rm" id="railModel"></span><button class="holdchip" id="holdChip" type="button" hidden aria-pressed="false"></button><button class="railtog" id="railTog" type="button" aria-expanded="true" aria-controls="rail" title="Collapse the Radio rail"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr">Collapse the Radio rail</span></button></div>
    <button class="railmin" id="railMin" type="button" aria-label="Open the Radio rail" aria-controls="rail"><span class="rmv">RADIO</span><span class="rmb" id="railMinB" hidden></span></button>
    <div id="qSlot" aria-live="assertive"></div>
    <div class="planbox" id="planBox"></div>
    <div class="talkwrap"><div class="talk" id="talk" role="log" aria-label="Conversation" tabindex="0" data-hold="chat"></div><button class="newpill" id="newPill" type="button" hidden></button></div>
    <section class="feedwrap" id="feedWrap" aria-label="Team activity"><button class="feedh" id="feedTog" type="button" aria-expanded="true" aria-controls="feed"><span class="ft">Team activity</span><span class="fq">read-only</span><span class="fc" aria-hidden="true">▾</span></button><div class="talk feed" id="feed" role="log" aria-label="Team activity, read-only" tabindex="0" data-hold="chat"></div></section>
    <form class="composer" id="composer" autocomplete="off">
      <div class="qd" id="queuedLines"></div>
      <div class="crow"><span class="pr" aria-hidden="true">❯</span><textarea id="input" rows="1" placeholder="Message Sleipnir, / for commands, @ for files" aria-label="Message Sleipnir"></textarea></div>
      <div class="cbar"><button class="mode" type="button" id="modeBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="modeMenu" aria-label="Permission mode: default. Opens a menu."><span id="modeTxt">default</span><svg class="caret" viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 6.5L5 3.5l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="hint" id="cHint">ctrl+t stats · / commands</span><span class="sp"></span><button class="send" type="submit" aria-label="Send" title="Send (Enter)">⏎</button></div>
      <div class="slash" id="slash" hidden role="listbox" aria-label="Commands"></div>
    </form>
  </aside>

  <footer id="foot">
    <div id="statusLine" aria-label="Status line"></div>
    <span class="sp"></span>
    <span class="mockchip">MOCK · sample data</span>
    <span class="model" id="footModel"></span>
  </footer>
  <nav id="mnav" aria-label="Sections"></nav>
</div>
