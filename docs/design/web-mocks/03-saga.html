<style>
/* ============ tokens ============ */
:root {
  color-scheme: light;
  --bg: #f1ebdd;            /* the desk */
  --paper: #fbf8f1;         /* the logo's paper */
  --paper-2: #f6f1e4;       /* an inset, a card */
  --paper-3: #eee7d5;       /* pressed, a fold */
  --slip: #fdf5dc;          /* the slip that needs your word */
  --ink: #24232e;           /* the logo's ink */
  --ink-2: #45435a;
  --pencil: #665f52;        /* pencil gray, text */
  --faint: #9a937f;         /* ornament only, never text */
  --rule: #ddd4be;
  --rule-2: #c6bba0;
  --line: #5c5748;          /* a pencil border */
  --mane: #6a40e0;          /* the mane violet: links, focus, the current thing */
  --mane-soft: #ece5fc;
  --hl: rgba(242, 201, 76, .5);  /* highlighter */
  --edge: rgba(36, 35, 46, .07);
  --drop: rgba(36, 35, 46, .30);
  --scrim: rgba(36, 35, 46, .38);

  /* the eight legs: a mark colour (>= 3:1 on paper) and an ink colour for text (>= 4.5:1) */
  --c-mgr: #8660e6; --i-mgr: #6a3fd1;
  --c-be:  #4a79e0; --i-be:  #2f58b8;
  --c-fe:  #1f90c0; --i-fe:  #0b6a93;
  --c-sc:  #169a83; --i-sc:  #0d7262;
  --c-ts:  #5c9420; --i-ts:  #456f12;
  --c-wr:  #b57e0d; --i-wr:  #865a06;   /* amber: warm, cost */
  --c-rv:  #dd611a; --i-rv:  #a8470a;   /* orange: attention */
  --c-er:  #e04661; --i-er:  #b81f3d;   /* red pencil: cache break, deny */
  --ok: #456f12;
  --on-er: #fff; --on-mark: #fff; --halo: rgba(36, 35, 46, .62);

  --serif: Newsreader, "Iowan Old Style", "Palatino Linotype", Palatino, Charter, "Bitstream Charter", Georgia, "Times New Roman", serif;
  --sans: Figtree, "Instrument Sans", "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  /* a modular scale, 1.25 on 14.8 */
  --t-label: 11.5px; --t-note: 13px; --t-ui: 14.5px; --t-prose: 18.5px; --t-lead: 23px; --t-h2: 29px; --t-h1: 58px;
  --lh: 1.62;

  --rail-w: 264px;
  --text-w: 640px; --margin-w: 284px; --gap: 44px; --pad-l: 60px; --pad-r: 32px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #17150f; --paper: #211e17; --paper-2: #2a261d; --paper-3: #342f24; --slip: #2c271a;
  --ink: #ece5d3; --ink-2: #cfc8b6; --pencil: #aca493; --faint: #6f6957;
  --rule: #38332a; --rule-2: #4c4637; --line: #8d856f;
  --mane: #b79cf9; --mane-soft: #322a4d; --hl: rgba(224, 175, 104, .32);
  --edge: rgba(0, 0, 0, .4); --drop: rgba(0, 0, 0, .7); --scrim: rgba(0, 0, 0, .6);
  --c-mgr: #bb9af7; --i-mgr: #c9b0fa; --c-be: #7aa2f7; --i-be: #8fb2fa; --c-fe: #7dcfff; --i-fe: #8fd8ff;
  --c-sc: #73daca; --i-sc: #86e2d3; --c-ts: #9ece6a; --i-ts: #addb81; --c-wr: #e0af68; --i-wr: #e8bf82;
  --c-rv: #ff9e64; --i-rv: #ffae7f; --c-er: #f7768e; --i-er: #fb8ea1; --ok: #addb81; --on-er: #2a0d14;
}

/* ============ base ============ */
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 var(--t-prose)/var(--lh) var(--serif);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden; font-kerning: normal;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--mane); text-decoration-thickness: 1px; text-underline-offset: .18em; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--mane); outline-offset: 2px; border-radius: 2px; }
::selection { background: var(--hl); color: var(--ink); }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--paper); padding: 8px 14px; font: 600 14px var(--sans); border-radius: 3px; }
.skip:focus { top: 10px; }
kbd { font: 600 11px/1 var(--sans); padding: 2px 5px 3px; border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 3px; background: var(--paper-2); color: var(--ink-2); margin: 0 1px; }
code, .mono { font: 400 .86em/1.4 var(--mono); font-variant-ligatures: none; }
.gl { font-family: var(--sans), "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", sans-serif; font-style: normal; font-weight: 400; }
.sc { font-variant-caps: all-small-caps; letter-spacing: .055em; }
.tnum { font-variant-numeric: tabular-nums lining-nums; }
.label, .kicker { font: 600 var(--t-label)/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--pencil); }
.ic { display: inline-block; width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.ic svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* hand-drawn rules and borders: the geometry wobbles, the text never does */
.rule { display: block; height: 7px; border: 0; margin: 0; background: linear-gradient(var(--rule-2), var(--rule-2)) center / 100% 1.2px no-repeat; filter: url(#wob); }
.rule.strong { background-image: linear-gradient(var(--line), var(--line)); background-size: 100% 1.6px; }
.penbox { position: relative; }
.penbox::before { content: ""; position: absolute; inset: 0; border: 1.4px solid var(--line); border-radius: 2px; filter: url(#wobb); pointer-events: none; }

/* ============ buttons, chips ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: 600 13.5px/1 var(--sans); letter-spacing: .005em; padding: 9px 14px 9px; border: 1.4px solid var(--ink); border-radius: 3px; background: var(--paper); color: var(--ink); transition: background .12s, transform .06s; }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding-left: 8px; padding-right: 8px; }
.btn.quiet:hover { background: var(--paper-2); border-color: var(--rule-2); }
.btn.sm { font-size: 12px; padding: 5px 9px 6px; border-width: 1.2px; border-color: var(--line); }
.btn.sm.primary { border-color: var(--ink); }
.btn.danger { border-color: var(--i-er); color: var(--i-er); }
.btn[aria-disabled="true"], .btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; background: transparent; border-radius: 4px; color: var(--ink-2); padding: 0; }
.icon-btn:hover { background: var(--paper-2); border-color: var(--rule-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: 4px; background: transparent; font: 500 12.5px/1 var(--sans); color: var(--ink-2); white-space: nowrap; }
button.chip:hover { background: var(--paper-2); }
.chip b { font-weight: 600; color: var(--ink); }
.chip .k, .budget .k { font: 600 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--pencil); }
.gl.ok { color: var(--ok); }
.mockchip { display: inline-block; font: 600 10px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--pencil); padding: 5px 8px; border: 1px dashed var(--rule-2); border-radius: 3px; background: transparent; }
.mockchip.m-bar { display: none; flex: none; margin-right: auto; }
.toasts { position: fixed; z-index: 60; left: 50%; top: 64px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { font: 500 13.5px/1.35 var(--sans); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 3px; box-shadow: 0 10px 30px -10px var(--drop); animation: toast-in .24s ease both; }
.toast.out { opacity: 0; transition: opacity .3s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

/* ============ shell ============ */
.app { height: 100%; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.work { height: 100%; min-width: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; padding: 20px 24px 0; scrollbar-color: var(--rule-2) transparent; }
.scroll:focus { outline: none; }
.view { position: relative; }

/* ---- the rail: the library ---- */
.rail { height: 100%; min-height: 0; border-right: 1px solid var(--rule); background: var(--bg); }
.rail-in { height: 100%; display: flex; flex-direction: column; padding: 18px 14px 12px 16px; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 0 4px 2px; }
.brand-mark { width: 74px; height: 50px; flex: none; margin-left: -6px; }
.brand-t { display: grid; line-height: 1; }
.brand-n { font: 600 25px/1 var(--serif); letter-spacing: -.018em; }
.brand-s { font: 600 10px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--pencil); margin-top: 6px; }
.rail-tools { display: grid; gap: 10px; margin: 16px 0 12px; }
.rail-tools .btn { justify-content: flex-start; padding: 10px 14px; }
.search { display: flex; align-items: center; gap: 8px; border-bottom: 1.4px solid var(--rule-2); padding: 4px 2px 6px; color: var(--pencil); }
.search:focus-within { border-color: var(--mane); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: 400 14px/1.2 var(--sans); color: var(--ink); outline: none; padding: 0; }
.search input::placeholder { color: var(--pencil); opacity: 1; }
.rail-list { flex: 1; min-height: 0; overflow-y: auto; margin: 4px -6px 0 -2px; padding: 0 6px 8px 2px; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.rg-h { font: 500 13px/1 var(--serif); font-variant-caps: all-small-caps; letter-spacing: .13em; color: var(--pencil); margin: 18px 6px 6px; display: flex; align-items: center; gap: 8px; }
.rg-h::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.si { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 9px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 8px 8px 6px; border-radius: 3px; color: var(--ink); position: relative; }
.si:hover { background: color-mix(in srgb, var(--paper) 60%, transparent); }
.si .mk { font: 600 13px/1.5 var(--sans); text-align: center; color: var(--pencil); padding-top: 1px; }
.si .ti { font: 500 15.5px/1.22 var(--serif); letter-spacing: -.003em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.si .me { font: 500 11.5px/1.3 var(--sans); color: var(--pencil); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 0 8px; }
.si .me .mt { white-space: nowrap; }
.si .me .mt:first-child { border: 1px solid var(--rule-2); border-radius: 3px; padding: 0 5px; line-height: 1.5; }
.si[aria-current="true"] { background: var(--paper); box-shadow: 0 0 0 1px var(--edge), 0 6px 16px -10px var(--drop); }
.si .pip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c-mgr); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-mgr) 22%, transparent); margin-top: 5px; animation: pip 2.2s ease-in-out infinite; }
@keyframes pip { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c-mgr) 8%, transparent); } }
.si-sub { display: flex; gap: 2px; padding: 2px 0 6px 31px; }
.si-sub button { font: 600 11.5px/1 var(--sans); letter-spacing: .02em; border: 0; background: transparent; color: var(--pencil); padding: 5px 7px; border-radius: 3px; text-decoration: underline transparent; text-underline-offset: 3px; }
.si-sub button:hover { color: var(--ink); background: var(--paper-2); }
.si-sub button[aria-current="page"] { color: var(--mane); text-decoration-color: var(--mane); }
.rail-foot { border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 4px; display: grid; gap: 1px; }
.nav-i { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 8px; border-radius: 3px; font: 600 14px/1 var(--sans); color: var(--ink); text-align: left; width: 100%; }
.nav-i:hover { background: color-mix(in srgb, var(--paper) 60%, transparent); }
.nav-i[aria-current="page"] { background: var(--paper); box-shadow: 0 0 0 1px var(--edge); }
.nav-i .nav-meta { margin-left: auto; font: 500 11.5px/1 var(--sans); color: var(--pencil); }
.nav-i.small { font-weight: 500; font-size: 13px; color: var(--ink-2); }
.rail-end { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 0; flex-wrap: wrap; }

/* ---- the top bar ---- */
.top { flex: none; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 24px 8px 24px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 92%, transparent); position: relative; z-index: 20; }
.menu-btn { display: none; }
.crumbs { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; font: 500 13px/1.2 var(--sans); color: var(--pencil); white-space: nowrap; overflow: hidden; }
.crumbs .cp { font: 500 12.5px var(--mono); color: var(--ink-2); }
.crumbs .sep { color: var(--faint); }
.crumbs .cur { font: 500 15px var(--serif); color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; align-items: center; gap: 8px; flex: none; }
.chip-model b { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
.chip.waitchip { border-color: var(--i-rv); color: var(--i-rv); background: color-mix(in srgb, var(--c-rv) 10%, transparent); font-weight: 600; }
.chip.waitchip .gl { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(3px); } }
.budget { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px/1 var(--sans); color: var(--ink-2); padding: 0 4px; }
.budget b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bud-line { width: 54px; height: 7px; position: relative; background: linear-gradient(var(--rule-2), var(--rule-2)) center / 100% 1.2px no-repeat; filter: url(#wob); }
.bud-line i { position: absolute; left: 0; top: 2px; height: 3px; width: 2%; background: var(--ink); border-radius: 1px; }
.chip.warm { border-color: var(--c-wr); color: var(--i-wr); background: color-mix(in srgb, var(--c-wr) 9%, transparent); }
.chip.warm b { color: var(--i-wr); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
.warm-bar { display: inline-flex; gap: 1.5px; margin-left: 2px; }
.warm-bar i { display: block; width: 3.5px; height: 10px; background: var(--c-wr); border-radius: 1px; transform: skewX(-12deg); }
.warm-bar i.off { background: var(--rule-2); }
.chip.warm[data-lv="low"] { border-color: var(--c-er); color: var(--i-er); background: color-mix(in srgb, var(--c-er) 10%, transparent); }
.chip.warm[data-lv="low"] b { color: var(--i-er); }
.chip.warm[data-lv="low"] .warm-bar i:not(.off) { background: var(--c-er); }
.chip.warm[data-lv="cold"] { border-color: var(--rule-2); color: var(--pencil); background: transparent; }
.chip.warm[data-lv="cold"] b { color: var(--pencil); }
.chip.warm.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 55% { background: var(--c-er); color: var(--on-er); border-color: var(--c-er); } 100% { } }
.chip.warm.flash b { color: inherit; }
.chip.conn { border-color: transparent; padding-right: 2px; font-size: 12px; color: var(--pencil); }
.conn-short { display: none; }
.newpill { position: absolute; left: 50%; bottom: calc(var(--dock-h, 190px) + 16px); transform: translateX(-50%); z-index: 15; font: 600 13px/1 var(--sans); background: var(--ink); color: var(--paper); border: 0; padding: 9px 15px; border-radius: 16px; box-shadow: 0 10px 24px -10px var(--drop); max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============ the sheet: paper on the desk ============ */
.sheet { position: relative; max-width: calc(var(--pad-l) + var(--text-w) + var(--gap) + var(--margin-w) + var(--pad-r)); margin: 0 auto; background: var(--paper); padding: 0 var(--pad-r) 0 var(--pad-l); box-shadow: 0 0 0 1px var(--edge), 0 40px 60px -48px var(--drop); min-height: calc(100% + 1px); }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--pad-l) + var(--text-w) + var(--gap) / 2 - 3px); width: 6px; background: linear-gradient(var(--rule), var(--rule)) center / 1px 100% no-repeat; filter: url(#wobv); pointer-events: none; }
.blk { display: block; }
.blk > .main { max-width: var(--text-w); min-width: 0; }
.blk.wide > .main { max-width: none; }
/* the margin: notes sit beside the block they belong to; a pass of script (layoutNotes) stacks them so they never collide */
.blk > .notes { position: absolute; left: calc(var(--pad-l) + var(--text-w) + var(--gap)); width: var(--margin-w); top: 0; }
.sheet-end { height: 40px; }

/* ---- marginalia ---- */
.notes { padding-top: 5px; }
.note { position: relative; font: 400 var(--t-note)/1.46 var(--sans); color: var(--pencil); margin: 0 0 16px; }
.note::before { content: ""; position: absolute; left: calc(var(--gap) / -2 + 3px); top: .75em; width: calc(var(--gap) / 2 - 8px); height: 1px; background: var(--rule-2); }
.note .nh { display: block; font: 600 10.5px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.note p { margin: 0 0 5px; }
.note b, .note .v { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.note em { font-family: var(--serif); font-size: 14.5px; color: var(--ink-2); }
.note code { font-size: 11.5px; color: var(--ink-2); }
.lr { display: flex; align-items: baseline; gap: 6px; }
.lr > i { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--faint); transform: translateY(-3px); }
.lr .v { white-space: nowrap; }
.note.est .v::after { content: " est."; font: 500 10px var(--sans); color: var(--pencil); letter-spacing: .04em; }
.note.red { color: var(--i-er); font-family: var(--serif); font-size: 15.5px; line-height: 1.38; font-style: italic; }
.note.red::before { background: var(--c-er); height: 1.4px; filter: url(#wob); }
.note.red .nh { color: var(--i-er); font-style: normal; }
.note.red b { color: var(--i-er); font-weight: 600; }
.note.red .scrib { display: block; width: 168px; height: 12px; margin: -2px 0 3px -2px; color: var(--c-er); }
.note.red .scrib path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 0; }
.note.red.draw .scrib path { animation: draw .9s ease-out both; }
.note.red .rcl { display: block; font: 400 12.5px/1.4 var(--sans); font-style: normal; color: var(--pencil); margin-top: 4px; }
@keyframes draw { from { stroke-dashoffset: 260; } }
.note.enter { animation: noteIn .5s ease-out both; }
@keyframes noteIn { from { opacity: 0; transform: translateX(-6px); } }
.ruler { display: flex; height: 10px; margin: 6px 0 4px; gap: 1px; filter: url(#wobs); }
.ruler i { display: block; height: 100%; transition: background .2s; }
.ruler.brk i { background: var(--c-er) !important; }
.ruler-cap { display: flex; gap: 1px; overflow: hidden; font: 500 10.5px/1 var(--sans); color: var(--pencil); letter-spacing: .02em; }

/* ============ type: title block ============ */
.runhead { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding-top: 26px; font: 500 14px/1.3 var(--serif); font-variant-caps: all-small-caps; letter-spacing: .12em; color: var(--pencil); }
.runhead .sid { font: 500 11.5px var(--mono); font-variant-caps: normal; letter-spacing: 0; color: var(--pencil); }
.runhead .sid .gl { color: var(--i-mgr); }
h1.title { font: 520 var(--t-h1)/1.0 var(--serif); letter-spacing: -.024em; margin: 20px 0 0; text-wrap: balance; }
.deck { font: italic 400 var(--t-lead)/1.34 var(--serif); color: var(--ink-2); margin: 14px 0 0; max-width: 34em; text-wrap: pretty; }
.deck .must { font-style: normal; background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 94%, transparent 94%); padding: 0 .12em; margin: 0 -.06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.deck code { font-size: .74em; font-style: normal; }
.byline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 18px 0 4px; font: 500 12.5px/1.3 var(--sans); color: var(--pencil); }
.byline .stamp { display: inline-flex; align-items: center; gap: 7px; font: 700 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--i-mgr); border: 1.4px solid currentColor; border-radius: 3px; padding: 5px 8px 5px; position: relative; }
.byline .stamp.met { color: var(--ok); }
.byline .sep { color: var(--faint); }
.byline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.byline .stamp.met { animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(1.5) rotate(-6deg); opacity: 0; } }

/* ============ sections ============ */
.sec { margin-top: 56px; }
.masthead .sec, .sec.flush { margin-top: 0; }
.sec-k { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.sec-k .kicker .who { color: var(--ink-2); }
h2.h2 { font: 560 var(--t-h2)/1.14 var(--serif); letter-spacing: -.013em; margin: 0 0 14px; text-wrap: balance; }
h3.h3 { font: 560 var(--t-lead)/1.2 var(--serif); letter-spacing: -.008em; margin: 0 0 8px; }
.prose p { margin: 0 0 1.05em; hyphens: auto; -webkit-hyphens: auto; text-wrap: pretty; }
.prose p:last-child { margin-bottom: 0; }
.prose .sc { color: var(--ink); }
.hang { text-indent: -.52em; }
.sayer { display: flex; align-items: baseline; gap: 8px; font: 600 11.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--pencil); margin: 0 0 8px; }
.sayer .tm { font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.sayer .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c-mgr); align-self: center; }
.sayer.you .dot { background: var(--ink); }
.quote { margin: 0; padding: 0 0 0 36px; position: relative; font: italic 400 21px/1.42 var(--serif); color: var(--ink); }
.quote::before { content: "“"; position: absolute; left: 0; top: -.04em; font: 400 64px/1 var(--serif); color: var(--mane); }
.quote .cmd { font-style: normal; font: 500 14px/1 var(--mono); color: var(--i-mgr); background: var(--mane-soft); padding: 2px 6px; border-radius: 3px; margin-right: 4px; vertical-align: 2px; }
.quote-by { padding-left: 36px; margin-top: 8px; font: 500 12.5px/1.3 var(--sans); color: var(--pencil); }

/* ---- the plan, as chapters ---- */
.plan { margin: 28px 0 0; }
.plan-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.plan-h h2 { margin: 0; }
.plan-h .cnt { font: 500 12.5px/1 var(--sans); color: var(--pencil); font-variant-numeric: tabular-nums; }
.chapters { list-style: none; margin: 0; padding: 0; counter-reset: ch; }
.chap { display: grid; grid-template-columns: 38px 30px minmax(0, 1fr) auto; column-gap: 12px; align-items: start; padding: 9px 0 10px; position: relative; }
.chap::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 7px; background: linear-gradient(var(--rule), var(--rule)) center / 100% 1px no-repeat; filter: url(#wob); }
.chap:last-child::after { display: none; }
.chap .num { font: italic 500 17px/1.6 var(--serif); color: var(--pencil); text-align: right; font-variant-caps: normal; padding-top: 1px; }
.chap .bx { position: relative; width: 28px; height: 28px; margin-top: 2px; }
.chap .bx svg { position: absolute; inset: -2px; width: 32px; height: 32px; overflow: visible; }
.chap .bx .sq { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chap .bx .tk { fill: none; stroke: var(--ok); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 44; stroke-dashoffset: 44; }
.chap .bx .g { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px/1 var(--sans); color: var(--ink-2); }
.chap .ct { font: 480 20.5px/1.25 var(--serif); letter-spacing: -.006em; }
.chap .cs { font: 500 12.5px/1.35 var(--sans); color: var(--pencil); margin-top: 3px; }
.chap .cs b { font-weight: 600; color: var(--ink-2); }
.chap .st { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--pencil); padding-top: 9px; white-space: nowrap; }
.chap[data-s="done"] .tk { stroke-dashoffset: 0; }
.chap[data-s="done"] .bx .g { opacity: 0; }
.chap[data-s="done"] .ct { color: var(--ink-2); }
.chap[data-s="done"] .st { color: var(--ok); }
.chap[data-s="verify"] .st { color: var(--i-be); }
.chap[data-s="edit"] .st { color: var(--i-fe); }
.chap[data-s="ask"] .st { color: var(--i-rv); }
.chap[data-s="ask"] .bx .g { color: var(--i-rv); }
.chap[data-s="ask"] .bx .sq { stroke: var(--i-rv); }
.chap[data-s="ask"] .ct { text-decoration: underline wavy color-mix(in srgb, var(--c-rv) 70%, transparent) 1px; text-underline-offset: 5px; }
.chap[data-s="queued"] .ct, .chap[data-s="pending"] .ct { color: var(--ink-2); }
.chap.tickit .tk { animation: tick .7s cubic-bezier(.5, 0, .2, 1) both; }
@keyframes tick { from { stroke-dashoffset: 44; } }
.chap.tickit .bx .g { animation: fadeout .2s both; }
@keyframes fadeout { to { opacity: 0; } }
.chap[data-s="ask"] .bx .g { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translateX(2px); } }
.verdict { margin: 18px 0 0; padding: 14px 0 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); column-gap: 12px; position: relative; }
.verdict .vg { font: 500 20px/1.3 var(--sans); color: var(--i-mgr); text-align: right; padding-top: 3px; }
.verdict .vh { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); margin: 4px 0 6px; }
.verdict .vt { font: italic 400 21px/1.38 var(--serif); color: var(--ink); transition: opacity .3s; text-indent: -.42em; }
.verdict .vt .met { font-style: normal; font-weight: 560; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--c-ts) 45%, transparent) 58%, color-mix(in srgb, var(--c-ts) 45%, transparent) 94%, transparent 94%); }
.verdict.swap .vt { opacity: 0; }
.verdict.met .vg { color: var(--ok); }

/* ============ agents: a coloured leg ============ */
.a-mgr { --ac: var(--c-mgr); --ai: var(--i-mgr); } .a-be { --ac: var(--c-be); --ai: var(--i-be); } .a-fe { --ac: var(--c-fe); --ai: var(--i-fe); }
.a-sc { --ac: var(--c-sc); --ai: var(--i-sc); } .a-ts { --ac: var(--c-ts); --ai: var(--i-ts); }
.ag { display: inline-flex; align-items: baseline; gap: 6px; font: 600 12.5px/1 var(--sans); color: var(--ai); white-space: nowrap; }
.ag::before { content: ""; width: 8px; height: 13px; border-radius: 4px 4px 2px 2px; background: var(--ac); align-self: center; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 45%, transparent) inset; }
.ag.plain::before { display: none; }

/* ============ ledger of tool calls ============ */
.ledger { margin: 18px 0 6px; font: 400 var(--t-note)/1.4 var(--sans); }
.ledger-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.ledger-h .label { display: flex; gap: 8px; align-items: baseline; }
.ledger-h .label span { color: var(--faint); }
.ledger-h .exp { font: 600 11px/1 var(--sans); letter-spacing: .04em; border: 0; background: transparent; color: var(--pencil); padding: 4px 0 4px 8px; }
.ledger-h .exp:hover { color: var(--mane); }
.lg { display: grid; grid-template-columns: 16px 74px minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 2px; color: var(--ink); position: relative; }
.lg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-bottom: 1px dotted var(--rule-2); }
button.lg:hover { background: color-mix(in srgb, var(--paper-2) 80%, transparent); }
.lg .g { font: 600 13px var(--sans); color: var(--ok); text-align: center; }
.lg .g.run { color: var(--i-be); }
.lg .g.ed { color: var(--i-fe); }
.lg .tl { font: 600 12.5px var(--sans); color: var(--ink-2); }
.lg .ar { font: 400 12.5px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; font-variant-ligatures: none; }
.lg .du { font: 500 12px var(--sans); color: var(--pencil); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lg .du .chev { display: inline-block; transition: transform .15s; margin-left: 5px; color: var(--faint); }
.lg[aria-expanded="true"] .chev { transform: rotate(90deg); }
.lg-out { margin: 0 0 2px 24px; padding: 8px 10px 9px; background: var(--paper-2); font: 400 12px/1.5 var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; border-left: 1px solid var(--rule-2); }
.lg-out .src { display: block; font: 600 9.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); margin-bottom: 6px; }
.lg.live .ar::after, .caret { content: ""; }
.caret { display: inline-block; width: 1.5px; height: 1.05em; background: var(--ai, var(--ink)); vertical-align: -.16em; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ============ figures ============ */
.fig { margin: 24px 0 30px; position: relative; }
.fig-cap { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; flex-wrap: wrap; }
.fig-cap .no { font: italic 600 17px/1.2 var(--serif); color: var(--ink); white-space: nowrap; }
.fig-cap .no::after { content: " ·"; color: var(--faint); font-style: normal; }
.fig-cap .tx { font: 400 15.5px/1.35 var(--serif); color: var(--ink-2); }
.fig-cap .tx code { font-size: 12.5px; color: var(--ink); }
.fig-card { position: relative; background: var(--paper-2); border-radius: 2px; }
.fig-card::before { content: ""; position: absolute; inset: 0; border: 1.4px solid var(--line); border-radius: 2px; filter: url(#wobb); pointer-events: none; z-index: 2; }
.fig-card::after { content: ""; position: absolute; top: -1px; right: -1px; width: 24px; height: 24px; z-index: 3; background: linear-gradient(to top left, transparent calc(50% - .8px), var(--line) calc(50% - .8px), var(--line) calc(50% + .8px), transparent calc(50% + .8px)), linear-gradient(225deg, var(--paper) 50%, var(--paper-3) 50%); filter: drop-shadow(-1px 1px 1px color-mix(in srgb, var(--ink) 18%, transparent)); }
.fig-h { display: flex; align-items: center; gap: 10px; padding: 11px 36px 10px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.fig-h .fn { font: 600 13px/1.2 var(--mono); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.fig-h .kd { font: 700 10px/1 var(--sans); letter-spacing: .1em; padding: 3px 5px 3px; border-radius: 2px; background: var(--ai); color: var(--paper); }
.fig-h .pm { font: 600 12px/1 var(--sans); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
.fig-h .pm .p { color: var(--ai); } .fig-h .pm .m { color: var(--i-er); margin-left: 6px; }
.fig-act { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper-3) 40%, transparent); flex-wrap: wrap; align-items: center; }
.fig-act .sp { flex: 1; }
.fig-act .meta { font: 500 11.5px/1 var(--sans); color: var(--pencil); }
.code { margin: 0; padding: 8px 0 8px; overflow-x: auto; font: 400 12.6px/1.6 var(--mono); font-variant-ligatures: none; tab-size: 4; position: relative; counter-reset: ln; }
.code.clip { max-height: 214px; overflow-y: hidden; }
.code.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, var(--paper-2)); pointer-events: none; }
.cdl { display: grid; grid-template-columns: 38px 18px minmax(0, 1fr); white-space: pre; min-width: max-content; width: 100%; }
.cdl .n { text-align: right; padding-right: 10px; color: var(--faint); font-size: 11px; user-select: none; }
.cdl .s { text-align: center; color: var(--pencil); user-select: none; }
.cdl .t { padding-right: 14px; }
.cdl.add { background: color-mix(in srgb, var(--ac) 10%, var(--paper-2)); box-shadow: inset 3px 0 0 var(--ac); }
.cdl.add .s { color: var(--ai); font-weight: 700; }
.cdl.del { background: color-mix(in srgb, var(--c-er) 10%, var(--paper-2)); color: var(--pencil); }
.cdl.del .s { color: var(--i-er); font-weight: 700; }
.cdl.hh { color: var(--pencil); font-style: italic; background: color-mix(in srgb, var(--paper-3) 55%, transparent); }
.cdl.enter { animation: lineIn .35s ease-out both; }
@keyframes lineIn { from { opacity: 0; transform: translateY(3px); } }
.tk-k { color: var(--i-mgr); } .tk-s { color: var(--i-ts); } .tk-c { color: var(--pencil); font-style: italic; } .tk-n { color: var(--i-rv); } .tk-t { color: var(--i-fe); }
.fig.draw .fig-card::before { animation: penIn .8s ease-out both; }
@keyframes penIn { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0 0 0 0); } }
.fig.new .fig-card { animation: figIn .5s ease-out both; }
@keyframes figIn { from { opacity: 0; transform: translateY(10px); } }

/* ============ the workshop ============ */
.shop-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 12.5px/1.4 var(--sans); color: var(--pencil); margin: -4px 0 16px; }
.shop-meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tasks { margin: 0; padding: 0; }
.task-main { border-bottom: 1px solid var(--rule-2); }
.tasks .task:first-child .task-main { border-top: 1.4px solid var(--line); }
.task-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 11px 6px 11px 0; color: var(--ink); }
.task-h:hover { background: color-mix(in srgb, var(--paper-2) 70%, transparent); }
.task .tid { font: 700 12px/1 var(--sans); letter-spacing: .04em; color: var(--pencil); }
.task .tt { font: 500 17.5px/1.3 var(--serif); letter-spacing: -.004em; }
.task .tm { display: flex; align-items: center; gap: 12px; margin-top: 4px; font: 500 12px/1.2 var(--sans); color: var(--pencil); flex-wrap: wrap; }
.task .sdo { font: italic 400 14px var(--serif); color: var(--ink-2); }
.task .tsd { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--pencil); }
.task[data-s="merged"] .tsd { color: var(--ok); } .task[data-s="verify"] .tsd { color: var(--i-be); } .task[data-s="running"] .tsd { color: var(--i-fe); }
.task[data-s="blocked"] .tsd { color: var(--i-rv); } .task[data-s="submitted"] .tsd { color: var(--i-be); }
.task .rt { display: flex; align-items: center; gap: 14px; }
.task .chev { color: var(--faint); transition: transform .15s; font-size: 12px; }
.task.open .chev { transform: rotate(90deg); }
.task-b { padding: 4px 0 14px 46px; }
.task-b[hidden] { display: none; }
.doing { font: italic 400 16.5px/1.45 var(--serif); color: var(--ink-2); margin: 0 0 6px; }
.doing .gl { font-style: normal; color: var(--ai); margin-right: 6px; }
.stream { font: 400 var(--t-prose)/var(--lh) var(--serif); color: var(--ink); margin: 6px 0 8px; padding-left: 14px; border-left: 1px solid var(--rule-2); }
.stream .sayer { margin-bottom: 4px; }
.gate { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-top: 16px; padding: 10px 0 0; font: 500 12.5px/1.45 var(--sans); color: var(--pencil); border-top: 1px solid var(--rule); }
.gate .label { margin-right: 4px; }
.gate b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.gate .qh { font: 500 12.5px var(--mono); color: var(--ink); }

/* ---- letters (mail is data) ---- */
.letters { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.letter { position: relative; background: var(--paper-2); padding: 11px 14px 12px 50px; border-radius: 2px; }
.letter::before { content: ""; position: absolute; inset: 0; border: 1.2px solid var(--rule-2); border-radius: 2px; filter: url(#wobb); pointer-events: none; }
.letter .env { position: absolute; left: 13px; top: 13px; width: 24px; height: 18px; color: var(--ink-2); }
.letter .env svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.letter .lh { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font: 500 12px/1.3 var(--sans); color: var(--pencil); margin-bottom: 3px; }
.letter .lh .arrow { color: var(--faint); }
.letter .lh .tm { margin-left: auto; font-variant-numeric: tabular-nums; }
.letter .lt { font: italic 400 17px/1.45 var(--serif); color: var(--ink); overflow-wrap: anywhere; text-indent: -.42em; }
.letter.enter { animation: letterIn .55s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes letterIn { from { opacity: 0; transform: translateY(-14px) rotate(-1deg); } }
.letters-note { font: 500 12.5px/1.45 var(--sans); color: var(--pencil); margin: 10px 0 0; }
.reports { margin: 12px 0 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.report-l { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dotted var(--rule-2); font: 400 16px/1.4 var(--serif); }
.report-l .tid { font: 700 11px var(--sans); letter-spacing: .08em; color: var(--pencil); }
.report-l i { color: var(--ink-2); }
.report-l .tid-t { font: 500 12px var(--sans); color: var(--ok); }

/* ---- a break in the saga: compaction ---- */
.break { display: flex; align-items: center; gap: 14px; margin: 54px 0 12px; color: var(--line); }
.break::before, .break::after { content: ""; flex: 1; height: 7px; background: linear-gradient(var(--rule-2), var(--rule-2)) center / 100% 1.2px no-repeat; filter: url(#wob); }
.break svg { width: 128px; height: 34px; flex: none; overflow: visible; }
.break-t { text-align: center; font: italic 400 17px/1.5 var(--serif); color: var(--ink-2); max-width: 30em; margin: 0 auto; text-wrap: balance; }
.break-t .sc { font-style: normal; font-weight: 600; color: var(--i-mgr); }
.break-t .gl { font-style: normal; color: var(--i-mgr); }
.break-fold { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 0; font: 500 12px/1 var(--sans); color: var(--pencil); font-variant-numeric: tabular-nums; }
.break-fold .bar { display: block; height: 9px; background: var(--c-mgr); border-radius: 1px; filter: url(#wobs); }
.break-fold .bar.b { opacity: .5; }
.break.enter, .break-t.enter { animation: breakIn .8s ease-out both; }
@keyframes breakIn { from { opacity: 0; letter-spacing: .4em; } }

/* ============ the question: a ruled slip ============ */
.slipwrap { margin: 36px 0 0; }
.slip { position: relative; background: var(--slip); padding: 18px 22px 18px; border-radius: 2px; box-shadow: 0 1px 0 var(--edge), 0 14px 26px -18px var(--drop); }
.slip::before { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--line); border-radius: 2px; filter: url(#wobb); pointer-events: none; }
.slip-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.slip h3 { font: italic 500 29px/1.1 var(--serif); letter-spacing: -.012em; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.slip h3 .gl { font-style: normal; font-size: 21px; color: var(--i-rv); }
.slip .wt { font: 700 10.5px/1 var(--sans); letter-spacing: .11em; text-transform: uppercase; color: var(--i-rv); font-variant-numeric: tabular-nums; }
.slip .who { margin: 10px 0 0; font: 600 11.5px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--pencil); }
.slip .who b { color: var(--ai); }
.slip .cmdbox { margin: 10px 0 0; padding: 9px 12px; background: color-mix(in srgb, var(--ink) 6%, var(--slip)); font: 500 14.5px/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; position: relative; }
.slip .cmdbox .cwd { display: block; font: 500 11.5px var(--sans); color: var(--pencil); margin-top: 2px; }
.slip .why { margin: 10px 0 0; font: italic 400 16.5px/1.5 var(--serif); color: var(--ink-2); }
.slip .why b { font-style: normal; font: 700 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--pencil); margin-right: 6px; }
.pause { position: relative; height: 9px; margin: 14px 0 6px; background: linear-gradient(var(--rule-2), var(--rule-2)) center / 100% 1.2px no-repeat; filter: url(#wob); }
.pause i { position: absolute; left: 0; top: 3px; height: 3px; width: 0; background: var(--ink); border-radius: 2px; }
.pause-t { font: 500 12.5px/1.3 var(--sans); color: var(--pencil); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pause-t .rdy { color: var(--ok); font-weight: 600; }
.choices { margin: 10px 0 0; display: grid; gap: 0; }
.choice { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; padding: 9px 8px 9px 4px; font: 500 17px/1.35 var(--serif); color: var(--ink); border-top: 1px solid color-mix(in srgb, var(--line) 35%, transparent); }
.choice:first-child { border-top-color: var(--line); }
.choice .kn { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1.4px solid var(--ink); border-radius: 3px; font: 700 13px/1 var(--sans); background: var(--paper); }
.choice .kn::before { content: attr(data-k); }
.choice code { font-size: 13px; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 2px; }
.choice .esc { font: 500 11.5px var(--sans); color: var(--pencil); }
.choice:hover:not([aria-disabled="true"]) { background: var(--hl); }
.choice[aria-disabled="true"] { color: var(--pencil); cursor: not-allowed; }
.choice[aria-disabled="true"] .kn { border-color: var(--rule-2); color: var(--faint); }
.tellbox { margin-top: 12px; display: grid; gap: 8px; }
.tellbox textarea { width: 100%; min-height: 70px; resize: vertical; border: 1.4px solid var(--line); background: var(--paper); border-radius: 2px; padding: 8px 10px; font: 400 17px/1.45 var(--serif); }
.tellbox .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* long and short labels of the three answers */
.choice .lab-short, .choice .lab-xs { display: none; }
/* docked: the same slip, folded to a strip that rides above the composer while its place in the page is out of sight */
.slip.docked { margin: 0; padding: 8px 14px 8px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "h cmd wt" "ch ch ch" "pz pz pz"; column-gap: 12px; row-gap: 6px; align-items: center; background-image: none; }
.slip.docked .slip-h { display: contents; }
.slip.docked h3 { grid-area: h; font-size: 21px; white-space: nowrap; } .slip.docked h3 .gl { font-size: 16px; }
.slip.docked .wt { grid-area: wt; font-size: 10px; white-space: nowrap; }
.slip.docked .who, .slip.docked .why, .slip.docked .tellhint, .slip.docked .more { display: none; }
.slip.docked .cmdbox { grid-area: cmd; margin: 0; padding: 3px 8px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slip.docked .cmdbox::before { content: attr(data-by); font: 700 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ai); margin-right: 8px; }
.slip.docked .cmdbox .cwd { display: inline; margin-left: 8px; }
.slip.docked .pause { grid-area: pz; margin: 0; align-self: center; }
.slip.docked .pause-t { display: none; }
.slip.docked[data-armed="false"] { grid-template-areas: "h cmd wt" "ch ch ch" "pz pz pz" "pt pt pt"; }
.slip.docked[data-armed="false"] .pause-t { display: flex; grid-area: pt; font-size: 11.5px; }
.slip.docked .choices { grid-area: ch; display: grid; grid-template-columns: .7fr 1.5fr 1.5fr; gap: 6px; margin: 0; }
.slip.docked .choice { display: flex; gap: 8px; width: auto; padding: 4px 10px 4px 5px; border: 1px solid var(--line); border-radius: 3px; background: color-mix(in srgb, var(--paper) 70%, transparent); font-size: 15px; white-space: nowrap; min-width: 0; overflow: hidden; }
.slip.docked .choice:first-child { border-top-color: var(--line); }
.slip.docked .choice .kn { width: 22px; height: 22px; font-size: 12px; flex: none; }
.slip.docked .choice .esc { display: none; }
.slip.docked .choice .lab-long { display: none; } .slip.docked .choice .lab-short { display: inline; overflow: hidden; text-overflow: ellipsis; }
.slip.docked .tellbox { grid-column: 1 / -1; }
.slip.docked .choice:hover:not([aria-disabled="true"]) { background: var(--hl); }
.slip.docked .choice[aria-disabled="true"] { border-color: var(--rule-2); }
.slip.docked .pause-live { display: block; }
.slip.settled { background: transparent; box-shadow: none; padding: 10px 0 10px; background-image: none; }
.slip.settled::before { display: none; }
.settled-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font: 500 14px/1.4 var(--sans); color: var(--ink-2); border-top: 1.4px solid var(--line); border-bottom: 1px solid var(--rule-2); padding: 10px 0; margin: 28px 0 0; }
.settled-line .gl { color: var(--ok); font-weight: 700; }
.settled-line b { color: var(--ink); }
.settled-line .tm { color: var(--pencil); font-variant-numeric: tabular-nums; }
.slip .okstamp { display: none; }

/* ============ asides: slash commands that only look ============ */
.aside { position: relative; margin: 26px 0 0; padding: 14px 18px 16px; background: var(--paper-2); border-radius: 2px; animation: figIn .35s ease-out both; }
.aside::before { content: ""; position: absolute; inset: 0; border: 1.3px dashed var(--line); border-radius: 2px; filter: url(#wobb); pointer-events: none; }
.aside-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.aside-h .label b { color: var(--ink); font: 600 12px var(--mono); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.aside .x { border: 0; background: transparent; color: var(--pencil); padding: 2px 6px; font-size: 18px; line-height: 1; }
.aside .x:hover { color: var(--ink); }
.aside .tb { font: 400 var(--t-note)/1.5 var(--sans); }
.aside .tb .lr { padding: 3px 0; font-size: 13.5px; }
.aside .tb p { margin: 0 0 6px; font: 400 16px/1.5 var(--serif); }
.aside .tb ul { margin: 0; padding-left: 18px; font: 400 15.5px/1.5 var(--serif); }
.aside .tb .go { margin-top: 8px; }
.aside .hlp { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font: 400 13.5px/1.45 var(--sans); }
.aside .hlp code { font-size: 12.5px; color: var(--i-mgr); font-weight: 500; }
.aside .hlp h4 { grid-column: 1 / -1; margin: 10px 0 2px; }

/* ---- your own words, sent from the composer ---- */
.said { margin: 38px 0 0; }
.said .queued { display: inline-flex; gap: 6px; align-items: baseline; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--i-wr); margin-left: 10px; }
.reply { margin-top: 14px; }

/* ============ the composer: a writing card ============ */
.dock { position: sticky; bottom: 0; z-index: 12; padding: 0 0 8px; margin-top: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock::before { content: ""; position: absolute; left: calc(var(--pad-l) * -1); right: calc(var(--margin-w) + var(--gap) - 6px); bottom: 0; top: -34px; background: linear-gradient(transparent, var(--paper) 54%); pointer-events: none; }
.dock .blk { position: relative; }
.dock-slot { margin: 0 0 10px; }
.dock-slot:empty { display: none; }
.card { position: relative; background: var(--paper); border-radius: 3px; padding: 7px 12px 8px 14px; box-shadow: 0 1px 0 var(--edge), 0 18px 34px -20px var(--drop); }
.card::before { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--ink); border-radius: 3px; filter: url(#wobb); pointer-events: none; }
.status { display: flex; align-items: center; gap: 10px; font: 500 12.5px/1.3 var(--sans); color: var(--pencil); padding-bottom: 3px; min-height: 28px; }
.status .spin { color: var(--i-mgr); font-size: 14px; display: inline-block; width: 1.1em; text-align: center; }
.status b { color: var(--ink); font-weight: 600; }
.status .nums { font-variant-numeric: tabular-nums; white-space: nowrap; }
.status .grow { flex: 1; }
.status.paused .spin { color: var(--i-wr); }
.btn.tiny { font-size: 11.5px; padding: 4px 8px 5px; gap: 5px; border-color: var(--rule-2); color: var(--ink-2); background: transparent; }
.btn.tiny .ic { width: 14px; height: 14px; vertical-align: -2px; }
.btn.tiny kbd { margin-left: 2px; }
.qline { font: 500 12.5px/1.4 var(--sans); color: var(--ink-2); padding: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
.qline .gl { color: var(--i-wr); }
.qline .qt { font-family: var(--serif); font-size: 15px; font-style: italic; }
.write { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 6px; align-items: start; border-top: 1px solid var(--rule); padding-top: 6px; }
.write .pr { font: 600 17px/1.5 var(--sans); color: var(--mane); padding-top: 3px; }
.write textarea { width: 100%; border: 0; background: transparent; resize: none; font: 400 17.5px/1.5 var(--serif); color: var(--ink); padding: 3px 0; min-height: 30px; max-height: 190px; outline: none; display: block; }
.write textarea::placeholder { color: var(--pencil); opacity: 1; font-style: italic; }
.acts { display: inline-flex; gap: 8px; align-items: center; padding-top: 1px; }
.modes { display: inline-flex; border: 1.2px solid var(--line); border-radius: 3px; overflow: hidden; }
.modes button { border: 0; border-right: 1px solid var(--rule-2); background: transparent; font: 600 11.5px/1 var(--sans); padding: 6px 9px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.modes button:last-child { border-right: 0; }
.modes button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.modes button:hover:not([aria-checked="true"]) { background: var(--paper-2); }
.modes button:focus-visible { outline-offset: -2px; }
.danger-chip { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--on-er); background: repeating-linear-gradient(135deg, var(--i-er) 0 8px, color-mix(in srgb, var(--i-er) 82%, #000) 8px 16px); padding: 6px 9px; border-radius: 3px; }
.hint { font: 500 11.5px/1 var(--sans); color: var(--pencil); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 500 11.5px/1.3 var(--sans); color: var(--pencil); padding: 7px 2px 0; flex-wrap: wrap; }
.foot-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.foot .mono { font-size: 11px; }

/* ---- slash / @ menus ---- */
.menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--paper); border-radius: 3px; box-shadow: 0 20px 40px -18px var(--drop), 0 0 0 1.4px var(--line); max-height: min(340px, 44vh); overflow-y: auto; padding: 6px; z-index: 30; }
.menu-g { font: 600 10px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase; color: var(--pencil); padding: 9px 8px 5px; }
.mi { display: grid; grid-template-columns: max-content 1fr; gap: 0 12px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 3px; }
.mi .c { font: 600 13.5px var(--mono); color: var(--i-mgr); }
.mi .c i { font-style: normal; color: var(--pencil); font-weight: 400; margin-left: 6px; font-size: 12px; }
.mi .d { font: 400 13px/1.35 var(--sans); color: var(--ink-2); }
.mi[aria-selected="true"], .mi:hover { background: var(--hl); }
.mi mark { background: transparent; color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }

/* ============ overlays ============ */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fadeIn .15s both; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { position: fixed; z-index: 50; left: 50%; top: 11vh; transform: translateX(-50%); width: min(660px, calc(100vw - 24px)); max-height: 78vh; display: flex; flex-direction: column; background: var(--paper); border-radius: 3px; box-shadow: 0 40px 90px -30px var(--drop), 0 0 0 1.5px var(--ink); animation: modalIn .18s ease-out both; }
@keyframes modalIn { from { opacity: 0; transform: translate(-50%, 8px); } }
.pal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--rule-2); }
.pal-head .gl { color: var(--mane); font-size: 18px; }
.pal-head input { flex: 1; border: 0; background: transparent; font: 400 21px/1.3 var(--serif); outline: none; color: var(--ink); min-width: 0; }
.pal-head input::placeholder { color: var(--pencil); font-style: italic; opacity: 1; }
.pal-list { overflow-y: auto; padding: 6px 8px 8px; min-height: 120px; }
.pal-g { font: 500 12.5px/1 var(--serif); font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--pencil); padding: 12px 8px 4px; display: flex; gap: 8px; align-items: center; }
.pal-g::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.pi { display: grid; grid-template-columns: 22px max-content minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 3px; }
.pi .ik { color: var(--pencil); text-align: center; font: 600 12px var(--sans); }
.pi .nm { font: 600 13.5px var(--mono); color: var(--ink); }
.pi .nm i { font-style: normal; font-weight: 400; color: var(--pencil); font-size: 12px; margin-left: 6px; }
.pi .ds { font: 400 13px/1.35 var(--sans); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .ky { font: 500 11px var(--sans); color: var(--pencil); }
.pi[aria-selected="true"] { background: var(--hl); }
.pi mark { background: transparent; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }
.pi.nav .nm { font-family: var(--serif); font-size: 16px; font-weight: 500; }
.pal-foot { display: flex; gap: 14px; align-items: center; padding: 8px 16px 10px; border-top: 1px solid var(--rule); font: 500 11.5px/1 var(--sans); color: var(--pencil); }
.pal-foot .sp { flex: 1; }
.pal-empty { padding: 26px 16px; text-align: center; font: italic 17px var(--serif); color: var(--pencil); }
.sheetm { width: min(780px, calc(100vw - 24px)); top: 7vh; max-height: 86vh; }
.sheetm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 10px 22px; border-bottom: 1px solid var(--rule-2); }
.sheetm-head h2 { margin: 0; font: 560 24px/1.2 var(--serif); letter-spacing: -.01em; }
.sheetm-body { overflow-y: auto; padding: 16px 22px 22px; }
.sheetm-body .fig { margin-top: 6px; }
.md { font: 400 13px/1.55 var(--mono); white-space: pre-wrap; background: var(--paper-2); padding: 16px 18px; border: 1px solid var(--rule-2); color: var(--ink); overflow-wrap: anywhere; margin: 0; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; }
.mlist li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--rule); }
.mlist li:first-child { border-top: 0; }
.mlist .pick { text-align: left; border: 0; background: transparent; padding: 4px 6px; display: block; border-radius: 3px; }
.mlist .pick:hover { background: var(--hl); }
.mlist .mr { display: block; font: 600 14px var(--mono); }
.mlist .md2 { display: block; font: 400 12.5px/1.4 var(--sans); color: var(--pencil); margin-top: 2px; }
.mlist .mp { font: 500 12.5px var(--sans); color: var(--ink-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mlist .star { border: 0; background: transparent; font-size: 18px; color: var(--c-wr); padding: 0 4px; }

/* ============ ends and colophons ============ */
.endline { display: flex; align-items: center; gap: 14px; margin: 46px 0 14px; }
.endline .rule { flex: 1; height: 7px; background: linear-gradient(var(--line), var(--line)) center / 100% 1.4px no-repeat; filter: url(#wob); }
.endline .endt { font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.endline .endt .gl { color: var(--ok); }
.endacts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 40px; justify-content: flex-start; }
.letters-note { font: 400 var(--t-note)/1.5 var(--sans); color: var(--pencil); margin: 12px 0 0; }
.dim { color: var(--pencil); }
.endline .endt .nu { text-transform: none; letter-spacing: .04em; font-size: 13px; }

/* ============ the other pages ============ */
.page { padding-bottom: 60px; }
h1.title.small { font-size: 46px; line-height: 1.04; margin-top: 22px; }
h1.title.mono-t { font-family: var(--mono); font-size: 36px; font-weight: 500; letter-spacing: -.02em; }
.page .masthead .deck { max-width: 31em; }
.lede { font: 400 21px/1.5 var(--serif); color: var(--ink); margin: 0; text-wrap: pretty; }
.lede .sc { font-style: normal; }
.numlist { margin: 6px 0 0; padding-left: 1.5em; font: 400 17px/1.55 var(--serif); }
.numlist.plain { list-style: none; padding-left: 0; }
.numlist li { margin-bottom: 8px; padding-left: .3em; }
.numlist li::marker { font: 600 13px var(--sans); color: var(--i-er); }
.empty { font: italic 17px var(--serif); color: var(--pencil); padding: 18px 0; }

/* ---- report ---- */
.tledger { margin-top: 6px; }
.lr.big { font: 400 17px/1.4 var(--serif); padding: 5px 0; }
.lr.big .v { font: 600 17px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }
.lr.big.est .v::after { content: ""; }
.lr.big > i { transform: translateY(-4px); border-bottom-color: var(--faint); }
.rfig { margin: 6px 0 0; }
.rfig figcaption { font: 400 15px/1.45 var(--serif); color: var(--ink-2); margin-top: 10px; }
.rfig figcaption b { font-style: italic; font-weight: 600; color: var(--ink); }
.rulerfig { width: 100%; height: auto; display: block; overflow: visible; }
.rulerfig .brk { fill: none; stroke: var(--line); stroke-width: 1.4; }
.rulerfig .rl { font: 500 11px var(--sans); fill: var(--pencil); letter-spacing: .02em; }
.rulerfig .rseg { stroke: var(--ink); stroke-width: 1.4; }
.rulerfig .gl2 { font: 700 13px var(--sans); fill: var(--on-mark); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.rulerfig .ticks line { stroke: var(--line); stroke-width: 1.1; }
.rulerfig text { font-family: var(--sans); }
.rulerfig .ticks text { font: 500 10.5px var(--sans); fill: var(--pencil); stroke: none; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin-top: 14px; }
.lg2 { display: grid; grid-template-columns: 14px 28px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dotted var(--rule-2); font: 400 14px/1.3 var(--sans); color: var(--ink-2); }

}

/* ============ motion ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; scroll-behavior: auto !important; }
  .si .pip, .chip.waitchip .gl, .chap[data-s="ask"] .bx .g { animation: none !important; }
  .caret { animation: none !important; }
  .leg { animation: none !important; }
  .chap .bx .tk { transition: none; }
}
:root[data-anim="off"] *, :root[data-anim="off"] *::before { animation-duration: .001s !important; animation-iteration-count: 1 !important; }

/* ============ print: the report is the one worth printing ============ */
@media print {
  :root { --bg: #fff; --paper: #fff; --desk: #fff; }
  body { overflow: visible; height: auto; }
  .rail, .top, .dock, .newpill, .toasts, .scrim, .modal, .skip { display: none !important; }
  .app, .work { display: block; height: auto; } .scroll { overflow: visible; padding: 0; }
  .sheet { box-shadow: none; max-width: none; }
  .view[hidden] { display: none !important; }
}

/* ============ short windows and phones: the docked slip folds to a single strip ============ */
.crumbs .cur.p { display: none; }
@media (max-width: 1359px) { .crumbs .br { display: none; } }
@media (max-height: 800px), (max-width: 760px) {
  .slip.docked { grid-template-areas: "h cmd ch"; grid-template-columns: auto minmax(0, 1fr) auto; padding: 7px 12px 9px; row-gap: 0; position: relative; }

  .slip.docked .choices { display: flex; gap: 5px; }

  .slip.docked .choices { display: grid; grid-template-columns: .8fr 1.1fr .9fr; gap: 6px; }

  .foot-l .hint { display: none; }

  .crumbs .cp, .crumbs .sep, .crumbs .br { display: none; } .crumbs .cur.p { display: inline; } .crumbs .cur { font-size: 16px; }

import "sort"

// MaxSize is the largest page a client may ask for.
const MaxSize = 48

// Item is one thing the shop sells. Prices are in cents.
type Item struct {
	ID         string \`json:"id"\`
	Name       string \`json:"name"\`
	PriceCents int64  \`json:"price_cents"\`
}

// Page is one page of the catalogue, counted from 1.
type Page struct {
	Items []Item \`json:"items"\`
	Page  int    \`json:"page"\`
	Pages int    \`json:"pages"\`
	Total int    \`json:"total"\`
}

// Store holds the catalogue in memory, sorted by ID.
type Store struct{ rows []Item }

// New returns a Store over rows, sorted by ID.
func New(rows []Item) *Store {
	s := &Store{rows: append([]Item(nil), rows...)}
	sort.Slice(s.rows, func(i, j int) bool { return s.rows[i].ID < s.rows[j].ID })
	return s
}

// List returns page number page (from 1) of at most size items. A page below 1 is page 1,
// a page past the end is the last page, and a size outside 1..MaxSize is clamped.
func (s *Store) List(page, size int) Page {
	size = min(max(size, 1), MaxSize)
	pages := (len(s.rows) + size - 1) / size
	page = min(max(page, 1), max(pages, 1))
	lo := (page - 1) * size
	hi := min(lo+size, len(s.rows))
	return Page{Items: s.rows[lo:hi], Page: page, Pages: pages, Total: len(s.rows)}
}`,

/* ---------- a small syntax tinter for Go and JS ---------- */
const KW_GO = new Set('package import func return const var type struct interface if else for range map chan go defer switch case default nil true false break continue'.split(' '));
const KW_JS = new Set('const let var function async await return if else for of in new true false null undefined class import export from'.split(' '));
const TY = new Set('string int int64 int32 bool error float64 byte rune any'.split(' '));
const TOK = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+|.)/g;
function tint(src, lang) {
  const kw = lang === 'js' ? KW_JS : KW_GO; const frag = document.createDocumentFragment();
  const push = (txt, cls) => frag.append(cls ? h('span', { class: cls }, txt) : document.createTextNode(txt));
  let m; TOK.lastIndex = 0;
  while ((m = TOK.exec(src))) {
    if (m[1]) push(m[1], 'tk-c'); else if (m[2]) push(m[2], 'tk-s'); else if (m[3]) push(m[3], 'tk-n');
    else if (m[4]) push(m[4], kw.has(m[4]) ? 'tk-k' : (TY.has(m[4]) ? 'tk-t' : '')); else push(m[5] || '', '');
    if (m[0] === '') break;
  }
  return frag;
}

    const mr = b.getBoundingClientRect(); let top = mr.top - sr.top + 4; if (top < prev) top = prev;
    n.style.top = top.toFixed(1) + 'px'; prev = top + n.offsetHeight + 12; maxB = prev;
  });

function layoutSoon() { clearTimeout(notesTimer); notesTimer = setTimeout(() => requestAnimationFrame(layoutNotes), 60); }
function openRail() { $('#rail').classList.add('open'); $('#scrim').hidden = false; $('#scrim').classList.add('railscrim'); $('#btn-menu').setAttribute('aria-expanded', 'true'); }
function closeRail() { $('#rail').classList.remove('open'); $('#scrim').classList.remove('railscrim'); if ($('#sheetm').hidden && $('#palette').hidden) $('#scrim').hidden = true; $('#btn-menu').setAttribute('aria-expanded', 'false'); }

/* ---------- the command palette ---------- */
const PAL = { sel: 0, items: [], all: [] };
function paletteAll() {
  const arg = a => a && !a.startsWith('[');
  const pages = [
    ['Read the saga', 'Build the shop, as a document', '', () => go('saga'), 'nav'], ['Report', 'tokens, cost, the six prompt layers, hit ratio per request', 'ctrl+t', () => go('report'), 'nav'],
    ['Team', 'the eight legs, their states and tasks', 'ctrl+g', () => go('team'), 'nav'], ['Checkpoints', 'where the files stood, and Restore', '/rewind', () => go('ckpt'), 'nav'],
    ['Library', 'every saga, and clearing out the old', '/sessions', () => go('library'), 'nav'], ['Settings', 'model, permissions, trust, tool servers, providers, the team', '', () => go('prefs'), 'nav'],
  ].map(([n, d, k, r, kind]) => ({ g: 'Pages', ik: '▸', name: n, desc: d, key: k, run: r, kind }));
  const web = [
    ['Export saga as Markdown', 'a plain-text copy of this saga', () => openExport()], ['Lamp mode', 'warm dark paper, for the evening', toggleLamp], ['Expand tool output', 'open every ledger line', () => { go('saga'); expandAllOutputs(); }, 'ctrl+o'],
    ['Interrupt or resume the turn', 'esc: stop the turn and pause the goal', interrupt, 'esc'], ['Run the sample again', 'the sample saga from the start', () => restartSaga()],
  ].map(([n, d, r, k]) => ({ g: 'On this page', ik: '◇', name: n, desc: d, key: k || '', run: r, kind: 'nav' }));
  const slash = SLASH.map(s => ({ g: 'Slash commands · ' + s[0], ik: '/', name: s[1], arg: s[2], desc: s[3], key: '', run: () => { if (arg(s[2])) { go('saga'); const ta = $('#ta'); ta.value = s[1] + ' '; ta.focus(); growTa(); } else runSlash(s[1], ''); } }));
  const cli = CLI_CMDS.map(c => ({ g: 'The command line', ik: '$', name: c[0], desc: c[1], key: '', run: () => go('leaf', 'cli:' + c[0]) }));
  const sagas = SAGAS.slice(1).map(s => ({ g: 'Sagas', ik: '↺', name: s.title, desc: s.when + ' · ' + s.model + ' · ' + money(s.cost), key: '', run: () => openSaga(s.id), kind: 'nav' }));
  return [...pages, ...web, ...slash, ...cli, ...sagas];
}
function openPalette(prefill) {
  PAL.all = paletteAll(); $('#palette').hidden = false; $('#scrim').hidden = false; $('#scrim').classList.remove('railscrim');
  const inp = $('#pal-input'); inp.value = prefill || ''; PAL.ret = document.activeElement; filterPalette(); inp.focus();
}
function closePalette() { $('#palette').hidden = true; if ($('#sheetm').hidden) $('#scrim').hidden = true; PAL.ret && PAL.ret.focus && PAL.ret.focus({ preventScroll: true }); }
function filterPalette() {
  const q = $('#pal-input').value.trim().toLowerCase(); const toks = q.split(/\s+/).filter(Boolean);
  let items = PAL.all.filter(i => { const hay = (i.name + ' ' + i.desc + ' ' + i.g).toLowerCase(); return toks.every(t => hay.includes(t)); });
  if (q) items.sort((a, b) => score(b, q) - score(a, q));
  items = items.slice(0, 70); PAL.items = items; PAL.sel = 0;
  const list = $('#pal-list'); list.replaceChildren(); let g = '';
  if (!items.length) list.append(h('div', { class: 'pal-empty' }, 'Nothing by that name.'));
  items.forEach((it, i) => {
    if (it.g !== g) { g = it.g; list.append(h('div', { class: 'pal-g' }, g)); }
    list.append(h('button', { class: 'pi ' + (it.kind || ''), type: 'button', role: 'option', id: 'pi-' + i, 'aria-selected': String(i === 0), tabindex: '-1', onmousemove: () => { if (PAL.sel !== i) { PAL.sel = i; paintPal(); } }, onclick: () => runPal(i) },
      h('span', { class: 'ik gl' }, it.ik), h('span', { class: 'nm' }, hilite(it.name, q), it.arg && h('i', {}, it.arg)), h('span', { class: 'ds' }, it.desc), h('span', { class: 'ky' }, it.key || '')));
  });
  $('#pal-count').textContent = items.length + (items.length === 1 ? ' match' : ' matches');
  $('#pal-input').setAttribute('aria-activedescendant', 'pi-0');
}
const score = (i, q) => (i.name.toLowerCase().startsWith(q) ? 3 : i.name.toLowerCase().includes(q) ? 2 : 0) + (i.g === 'Pages' ? .5 : 0);
function paintPal() { $$('.pi', $('#pal-list')).forEach((b, i) => b.setAttribute('aria-selected', String(i === PAL.sel))); const e = $('#pi-' + PAL.sel); e && e.scrollIntoView({ block: 'nearest' }); $('#pal-input').setAttribute('aria-activedescendant', 'pi-' + PAL.sel); }
function runPal(i) { const it = PAL.items[i]; if (!it) return; closePalette(); setTimeout(() => it.run(), 20); }

/* ---------- lamp, restart ---------- */
function setLamp(on) { document.documentElement.dataset.theme = on ? 'dark' : 'light'; $('#btn-lamp').setAttribute('aria-pressed', String(on)); try { localStorage.setItem('saga-lamp', on ? '1' : '0'); } catch (e) { } }
function toggleLamp() { setLamp(document.documentElement.dataset.theme !== 'dark'); toast(document.documentElement.dataset.theme === 'dark' ? 'Lamp mode: warm dark paper.' : 'Daylight: cream paper.'); }
function restartSaga(msg) {
  Object.assign(S, freshState()); Object.keys(D).forEach(k => delete D[k]); D.task = {}; D.fig = {}; D.chap = [];
  CAM.q.length = 0; CAM.hold = 0; buildSaga(); renderPlanStrip(); scheduleScript(); wireComposer(); renderChips(); renderStatus(); renderCounters(); renderRail(); go('saga'); $('#main').scrollTop = 0;
  S.q.last = performance.now(); placeSlip(); meterLoop();
  toast(msg || 'The sample saga starts again.');
}
function buildSaga() {
  const root = $('#v-saga'); root.replaceChildren();
  const sheet = h('div', { class: 'sheet' }); D.sheet = sheet;
  D.end = h('div', { id: 'live-end', 'aria-hidden': 'true' });
  const [slipFlow, dock] = buildDock();
  sheet.append(masthead(), planBlock(), askedBlock(), sec1(), reportsBlock(), sec2(), ...workshop(), lettersBlock(), D.end, slipFlow, dock);
  root.append(sheet);
  const slip = buildSlip(); $('#slip-flow').append(slip); D.sagaBuilt = true;
  renderGate(); renderShopMeta(); fillIcons(root);
}

/* ---------- global keys ---------- */
function inField(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
document.addEventListener('keydown', e => {
  const k = e.key;
  /* a question takes keys only after the keyboard has been quiet: typing ahead goes to the prompt */
  if (S.view === 'saga' && S.q.open && !S.q.answer && !S.q.tell && ['1', '2', '3'].includes(k) && !e.ctrlKey && !e.metaKey && !e.altKey && (!inField(e.target) || e.target.id === 'ta') && $('#palette').hidden && $('#sheetm').hidden) {
    if (slipArmedNow()) { e.preventDefault(); S.q.armed = true; answer(k); return; }
  }
  if (!['Shift', 'Control', 'Alt', 'Meta'].includes(k)) bumpQuiet();
  if (S.view === 'saga' && !inField(e.target) && ['PageDown', 'PageUp', 'Home', 'End', ' ', 'ArrowDown', 'ArrowUp'].includes(k)) stopFollow();
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); $('#palette').hidden ? openPalette() : closePalette(); return; }
  if ((e.ctrlKey && k.toLowerCase() === 't') || (e.altKey && k.toLowerCase() === 't')) { e.preventDefault(); go('report'); return; }
  if ((e.ctrlKey && k.toLowerCase() === 'g') || (e.altKey && k.toLowerCase() === 'g')) { e.preventDefault(); go('team'); return; }
  if (e.ctrlKey && k.toLowerCase() === 'o') { e.preventDefault(); if (S.view !== 'saga') go('saga'); expandAllOutputs(); return; }
  if (k === 'Escape') {
    if (!$('#palette').hidden) { closePalette(); return; }
    if (!$('#sheetm').hidden) { closeModal(); return; }
    if ($('#rail').classList.contains('open')) { closeRail(); return; }
    if (S.view === 'saga' && S.q.open && !S.q.answer) { if (S.q.tell) { S.q.tell = false; renderSlip(); return; } if (slipArmedNow()) { answer('3'); return; } }
    if (S.view === 'saga' && !S.finished && (document.activeElement === $('#ta') || document.activeElement === document.body || document.activeElement === $('#main'))) { interrupt(); return; }
  }
  if (k === '/' && !inField(e.target) && S.view === 'saga' && $('#palette').hidden && $('#sheetm').hidden) { e.preventDefault(); const ta = $('#ta'); ta.focus(); ta.value = '/'; growTa(); updateMenu(); return; }
  if (k === '?' && !inField(e.target) && $('#palette').hidden) { e.preventDefault(); openHelp(); }
});
function wirePalette() {
  const inp = $('#pal-input');
  inp.addEventListener('input', filterPalette);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.items.length - 1, PAL.sel + 1); paintPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.sel = Math.max(0, PAL.sel - 1); paintPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(PAL.sel); }
    else if (e.key === 'PageDown') { e.preventDefault(); PAL.sel = Math.min(PAL.items.length - 1, PAL.sel + 8); paintPal(); }
    else if (e.key === 'PageUp') { e.preventDefault(); PAL.sel = Math.max(0, PAL.sel - 8); paintPal(); }
  });
  $('#scrim').addEventListener('click', () => { if (!$('#palette').hidden) closePalette(); else if (!$('#sheetm').hidden) closeModal(); else closeRail(); });
  $('#sheetm-x').addEventListener('click', closeModal);
  /* keep tab focus inside an open dialog */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return; const d = !$('#palette').hidden ? $('#palette') : (!$('#sheetm').hidden ? $('#sheetm') : null); if (!d) return;
    const f = $$('button:not([disabled]), input, select, textarea, [tabindex="0"]', d).filter(x => x.offsetParent !== null); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
}

/* ---------- boot ---------- */
function boot() {
  CLI = window.CLI_DATA || CLI;
  try { if (localStorage.getItem('saga-lamp') === '1') setLamp(true); } catch (e) { }
  document.documentElement.dataset.theme = document.documentElement.dataset.theme || 'light';
  fillIcons(); wirePalette();
  $$('[data-go]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go(b.dataset.go); }));
  $('#btn-new').addEventListener('click', () => { toast('A new saga starts empty. In this mock, the sample saga starts again.'); restartSaga('A new saga: the sample starts again.'); });
  $('#rail-search').addEventListener('input', renderRail);
  $('#btn-lamp').addEventListener('click', toggleLamp);
  $('#btn-menu').addEventListener('click', () => $('#rail').classList.contains('open') ? closeRail() : openRail());
  $('#chip-mode').addEventListener('click', () => go('prefs', 'permissions'));
  $('#chip-model').addEventListener('click', openModels);
  $('#chip-warm').addEventListener('click', () => go('report'));
  $('#chip-wait').addEventListener('click', () => { go('saga'); $('#card')?.scrollIntoView({ block: 'end', behavior: 'smooth' }); });
  $('#newpill').addEventListener('click', () => { const m = $('#main'); const t = D.pillTarget; resumeFollow(); if (t && t.isConnected) camPush('', t, { now: true }); else m.scrollTo({ top: m.scrollHeight, behavior: reduceMotion() ? 'auto' : 'smooth' }); S.unseen = 0; $('#newpill').hidden = true; });
  /* a hand on the page ends the following */

  mainEl.addEventListener('pointerdown', e => { if (e.target === mainEl) stopFollow(); });
  $('#main').addEventListener('scroll', () => { requestAnimationFrame(() => { placeSlip(); updateStrip(); placePill(); if (!S.follow && S.view === 'saga' && atBottom()) resumeFollow(); if (atBottom() || (D.pillTarget && elVisible(D.pillTarget) && S.follow)) { S.unseen = 0; $('#newpill').hidden = true; } }); }, { passive: true });
  addEventListener('resize', () => { placeSlip(); layoutNotes(); updateStrip(); placePill(); });

  new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', $('#dock').offsetHeight + 'px')).observe($('#dock'));

}
function elVisible(el) { const m = $('#main').getBoundingClientRect(), r = el.getBoundingClientRect(); return r.bottom > m.top + 40 && r.top < m.bottom - 140; }
window.addEventListener('DOMContentLoaded', boot);
