<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleipnir Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%20role%3D%27img%27%20aria-label%3D%27Sleipnir%27%3E%3Ctitle%3ESleipnir%3C%2Ftitle%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2324232e%27%2F%3E%3Crect%20x%3D%2713.5%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2714%27%20rx%3D%271.7%27%20fill%3D%27%23bb9af7%27%2F%3E%3Crect%20x%3D%2717.6%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2716%27%20rx%3D%271.7%27%20fill%3D%27%237aa2f7%27%2F%3E%3Crect%20x%3D%2721.7%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2712%27%20rx%3D%271.7%27%20fill%3D%27%237aa2f7%27%2F%3E%3Crect%20x%3D%2725.8%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2716%27%20rx%3D%271.7%27%20fill%3D%27%237dcfff%27%2F%3E%3Crect%20x%3D%2729.9%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2714%27%20rx%3D%271.7%27%20fill%3D%27%237dcfff%27%2F%3E%3Crect%20x%3D%2734.0%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2716%27%20rx%3D%271.7%27%20fill%3D%27%239ece6a%27%2F%3E%3Crect%20x%3D%2738.1%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2712%27%20rx%3D%271.7%27%20fill%3D%27%23e0af68%27%2F%3E%3Crect%20x%3D%2742.2%27%20y%3D%2735%27%20width%3D%273.4%27%20height%3D%2715%27%20rx%3D%271.7%27%20fill%3D%27%23ff9e64%27%2F%3E%3Cpath%20d%3D%27M13%2028%20C11%2023%2014%2020%2020%2021%20L40%2021%20C45%2021%2047%2019%2048%2014%20L46%209%20L51%209%20L53%206%20L55%2010%20L61%2016%20C62%2019%2060%2022%2057%2021%20L53%2020%20L50%2026%20C48%2033%2042%2037%2036%2037%20L22%2037%20C16%2037%2013%2033%2013%2028%20Z%27%20fill%3D%27%23e9e7f5%27%2F%3E%3Cpath%20d%3D%27M13%2026%20C8%2026%205%2030%205%2035%20C8%2032%2010%2031%2013%2032%20Z%27%20fill%3D%27%23b79cf9%27%2F%3E%3Cpath%20d%3D%27M44%2013%20L41%2019%20M47%2012%20L44%2019%27%20stroke%3D%27%23b79cf9%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2754%27%20cy%3D%2713%27%20r%3D%271.6%27%20fill%3D%27%2324232e%27%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e17; --bg1:#0f1220; --bg2:#161a2c; --bg3:#1e233b;
  --line:#2a2e45; --line2:#3b4263;
  --fg:#c0caf5; --fg1:#a9b1d6; --dim:#7a84ad; --faint:#565f89;
  --purple:#bb9af7; --blue:#7aa2f7; --sky:#7dcfff; --teal:#73daca;
  --green:#9ece6a; --amber:#e0af68; --orange:#ff9e64; --red:#f7768e;
  --mane:#7048e8; --on:#0b0e17; --ink:#24232e; --hoof:#3a3850; --horse:#e6e5f3; --horse-mane:#8e6cf0;
  --flash-amber:#4a3416; --flash-red:#4a1d2c; --flash-q:#33220f; --pulse:#3a2d12; --scrim:rgba(5,6,12,.72); --selbg:#3d4a86; --selfg:#ffffff;
  --lyr-a:#9477d9; --lyr-b:#8467c9; --lyr-c:#7456b8; --lyr-s:#5d4b92;
  --g0:#5b7be4; --g1:#7aa2f7; --g2:#7dcfff; --g3:#9ece6a; --g4:#e0af68; --g5:#ff9e64;
  --add-bg:#17301f; --del-bg:#341a2b; --add-hl:#2c6a42; --del-hl:#7a2c47;
  --sel:#222845; --hit:#e0af68; --hit-on:#0b0e17;
  --fs:14px; --lh:21px;
  --font:'JetBrains Mono','DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 var(--fs)/var(--lh) var(--font);font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
::selection{background:var(--selbg);color:var(--selfg)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--purple);outline-offset:1px;border-radius:2px}
a{color:var(--blue)}
b,.b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:99;background:var(--purple);color:var(--on);padding:0 1ch;font-weight:700}
.skip:focus{top:4px}

#app{height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);position:relative;min-width:0;overflow:hidden}

/* colour classes: role colours are tokens, glyphs carry the state too */
.c-purple{color:var(--purple)}.c-blue{color:var(--blue)}.c-sky{color:var(--sky)}.c-teal{color:var(--teal)}
.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-orange{color:var(--orange)}.c-red{color:var(--red)}
.c-dim,.dim{color:var(--dim)}.c-fg1{color:var(--fg1)}.c-fg{color:var(--fg)}
.bg-purple{background:var(--purple)}.bg-blue{background:var(--blue)}.bg-sky{background:var(--sky)}.bg-teal{background:var(--teal)}
.bg-green{background:var(--green)}.bg-amber{background:var(--amber)}.bg-orange{background:var(--orange)}.bg-red{background:var(--red)}
.g{display:inline-block;width:1ch;text-align:center;overflow:visible;white-space:nowrap}
.sep{color:var(--dim)}
.nw{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- tmux-like status bar ---------- */
#bar{flex:none;height:30px;display:flex;align-items:stretch;background:var(--bg1);border-bottom:1px solid var(--line);position:relative;z-index:30;padding:0 8px 0 0;gap:0;white-space:nowrap}
#bar .brand{display:flex;align-items:center;padding:0 1.5ch;color:var(--on);background:var(--purple);font-weight:700;letter-spacing:.02em;flex:none}
#bar .brand svg{width:16px;height:16px;margin-right:.8ch;flex:none}
#tabs{display:flex;align-items:stretch;min-width:0;overflow:hidden;flex:0 1 auto}
.tab{display:flex;align-items:center;padding:0 1.2ch;color:var(--fg1);position:relative;height:100%;flex:none}
.tab:hover{background:var(--bg2);color:var(--fg)}
.tab[aria-selected=true]{background:var(--bg3);color:var(--fg);font-weight:700;box-shadow:inset 0 -2px 0 var(--purple)}
.tab .fl{display:inline-block;min-width:1ch;text-align:center;font-weight:700}
.tab.bell{animation:bell 1.1s steps(2,jump-none) 3}
@keyframes bell{0%,100%{background:var(--bg1)}50%{background:var(--flash-amber)}}
#bar .sp{flex:1;min-width:8px}
.bar2{display:flex;align-items:stretch;flex:none;min-width:0}
.bsec{display:flex;align-items:center;padding:0 1.2ch;color:var(--fg1);gap:.8ch;flex:none}
.bsec+.bsec{border-left:1px solid var(--line)}
#conn{color:var(--fg1)}
#conn .dot{color:var(--green)}
#conn:hover{background:var(--bg2);color:var(--fg)}
.tg{padding:0 1.2ch;display:flex;align-items:center;color:var(--fg1);height:100%}
.tg:hover{background:var(--bg2);color:var(--fg)}
#warm{display:flex;align-items:center;gap:.8ch;padding:0 1.2ch}
#warm .mt{display:inline-flex;gap:1px;height:9px}
#warm .mt i{width:5px;background:currentColor;display:block}
#warm .mt i.off{opacity:.22}
#warm.hot{color:var(--amber)}#warm.low{color:var(--red)}#warm.cold{color:var(--dim)}
#warm.flash{animation:flashr .5s steps(2,jump-none) 4}
@keyframes flashr{50%{background:var(--flash-red)}}
#warm.pulse{animation:pulsea .7s ease-out 1}
@keyframes pulsea{0%{background:var(--pulse)}100%{background:transparent}}
#clk{color:var(--dim);padding:0 1.2ch}
.mockchip{align-self:center;white-space:nowrap;border:1px solid var(--line2);color:var(--fg1);padding:0 1ch;height:19px;line-height:17px;font-size:12px;border-radius:3px;margin-left:.6ch;flex:none}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#sbw{flex:1;min-height:0;position:relative}
#sb{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
#sb::-webkit-scrollbar{width:10px}#sb::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg)}
.col{width:100%;max-width:calc(132ch + 40px);margin:0 auto;padding:0 20px}
#sbc{padding-top:21px;padding-bottom:10px;min-height:100%;border-left:0}
.sess{display:block}
.sess[hidden]{display:none}
#rail{position:absolute;right:0;top:0;bottom:0;width:8px;pointer-events:none;z-index:3}
#rail i{position:absolute;right:1px;width:6px;height:3px;border-radius:0;background:var(--faint)}
#jump{position:absolute;right:22px;bottom:10px;z-index:6;background:var(--bg3);border:1px solid var(--line2);color:var(--fg);padding:0 1.2ch;height:23px;line-height:21px;border-radius:3px}
#jump:hover{background:var(--purple);color:var(--on)}
#srch{position:absolute;right:22px;top:8px;z-index:8;display:flex;align-items:center;gap:1ch;background:var(--bg1);border:1px solid var(--line2);border-radius:6px;padding:3px 1.2ch;box-shadow:none}
#srch input{background:transparent;border:0;width:22ch;color:var(--fg);caret-shape:block}
#srch .n{color:var(--dim);min-width:7ch;text-align:right}
mark.hit{background:var(--hit);color:var(--hit-on);border-radius:1px}
mark.hit.cur{background:var(--fg);color:var(--bg);outline:1px solid var(--purple)}

/* ---------- scrollback rows ---------- */
.r{display:grid;grid-template-columns:2ch minmax(0,1fr);column-gap:1ch;position:relative}
.r>.m{text-align:center;white-space:nowrap;overflow:visible}
.r>.bd{min-width:0;overflow-wrap:anywhere}
.r[data-t]:hover::after{content:attr(data-t);position:absolute;right:-1px;top:0;color:var(--dim);font-size:12px;background:var(--bg);padding-left:1ch}
.gap{height:21px}
.you .bd{font-weight:700;color:var(--fg)}
.you .bd .cmd{color:var(--sky)}
.you.q .bd{font-weight:400}
.say .bd{color:var(--fg)}
.say .m{color:var(--faint)}
.say.mgr .m{color:var(--purple)}
.say p{margin:0}
.say code,.bd code{color:var(--sky)}
.note{color:var(--dim)}
.note .bd b{color:var(--fg1)}
.plan{display:grid;grid-template-columns:2ch minmax(0,1fr);column-gap:1ch}
.plan .n{color:var(--dim);text-align:right}
.toolrow .m{color:var(--green)}
.toolrow.run .m{color:var(--amber)}
.toolrow.err .m{color:var(--red)}
.toolrow .nm{color:var(--sky);font-weight:700}
.toolrow .res{color:var(--green);margin-left:1.5ch;white-space:nowrap}
.toolrow .res.dim{color:var(--dim)}
.toolrow.err .res{color:var(--red)}
.toolrow .arg{color:var(--fg)}
.toolrow .tl{display:flex;gap:1ch;align-items:baseline;min-width:0}
.toolrow .tl .arg{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--dim)}
.out{margin-top:0;position:relative;color:var(--fg1)}
.out pre{padding-left:2ch;text-indent:-2ch}
.out .more{margin-left:2ch}
.out .ln::before{content:"⎿ ";color:var(--faint);text-indent:0}
.out .more{color:var(--dim);padding:0}
.out .more:hover{color:var(--fg);text-decoration:underline}
.out .cp,.cb .cp{position:absolute;right:0;top:0;opacity:0;transition:opacity .12s;background:var(--bg3);border:1px solid var(--line2);color:var(--fg1);padding:0 1ch;font-size:12px;line-height:19px;height:21px;border-radius:3px}
.out:hover .cp,.cb:hover .cp,.cp:focus-visible{opacity:1}
.cp:hover{color:var(--fg);border-color:var(--purple)}
.cb>.more{margin-left:12ch;color:var(--dim);padding:0}
.cb>.more:hover{color:var(--fg);text-decoration:underline}

/* worker feed lines */
.feed{display:block}
.fl{display:grid;grid-template-columns:2ch 6ch 7ch minmax(0,auto) minmax(0,1fr);column-gap:1ch;color:var(--fg1);align-items:baseline;position:relative}
.fl:hover{background:var(--bg1)}
.fl[data-t]:hover::after{content:attr(data-t);position:absolute;right:0;top:0;color:var(--dim);font-size:12px;background:var(--bg1);padding-left:1ch}
.fl>.gd{position:relative;text-align:center;align-self:stretch}
.fl>.gd:not(.c-amber)::before{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;border-left:1px solid var(--line2)}
.fl>.gd.c-amber{color:var(--amber)}
.fl .id{font-weight:700;text-align:left;padding:0;display:block;overflow:hidden;white-space:nowrap}
.fl .id:hover,.agb:hover{text-decoration:underline}
.fl .tn{color:var(--sky)}
.fl .tn.w{color:var(--amber)}
.fl .tn.e{color:var(--blue)}
.fl .ar{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.fl .ar .path{color:var(--fg);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;cursor:pointer}
.fl .ar .path:hover{text-decoration-color:var(--purple);color:var(--purple)}
.fl .rs{color:var(--green);white-space:nowrap;text-align:left;margin-left:1ch}
.fl .rs.dim{color:var(--dim)}
.fl .rs.a{color:var(--amber)}
.fl.ask .tn{color:var(--orange)}
.fl.say .ar{color:var(--fg1);white-space:normal;overflow:visible}
.fl.say .tn{color:var(--dim)}
.flx{margin:0 0 0 3ch}
.agb{font-weight:700;padding:0;display:inline;cursor:pointer}
.agb::before{content:"";}

/* diffs */
.cb{position:relative;margin:0}
.diff{display:grid;grid-template-columns:5ch 5ch 2ch minmax(0,1fr);column-gap:0;font-size:inherit;border-left:2px solid var(--line);margin-top:0}
.diff .d{display:contents}
.diff .d>span{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.diff .ol,.diff .nl{color:var(--dim);text-align:right;padding-right:1ch;user-select:none}
.diff .sg{text-align:center;color:var(--dim);user-select:none}
.diff .tx{color:var(--fg1);padding-right:1ch}
.diff .d.add>span{background:var(--add-bg)}
.diff .d.del>span{background:var(--del-bg)}
.diff .d.add .sg{font-weight:700}
.diff .d.del .tx{color:var(--red)}
.diff .d.add .tx{color:var(--fg)}
.diff .d.del .ol,.diff .d.del .sg{color:var(--red)}
.diff .d.add .nl,.diff .d.add .sg{color:var(--green)}
.diff .d.add.by-be-1 .sg{color:var(--blue)}.diff .d.add.by-be-2 .sg{color:var(--blue)}.diff .d.add.by-fe-1 .sg{color:var(--sky)}.diff .d.add.by-ts-1 .sg{color:var(--green)}
.diff .d.hunk>span{color:var(--purple);background:transparent;opacity:.9}
.diff i.hl{font-style:normal;background:var(--add-hl);color:var(--selfg)}
.diff .d.del i.hl{background:var(--del-hl)}
.diff .ctx .tx{color:var(--dim)}
.diff .caret::after{content:"";display:inline-block;width:1ch;height:1.05em;background:var(--purple);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cap-file{display:flex;gap:1ch;color:var(--fg1);flex-wrap:wrap;align-items:baseline}
.cap-file .path{color:var(--fg);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;cursor:pointer}
.cap-file .path:hover{color:var(--purple)}
.stat-add{color:var(--green)}.stat-del{color:var(--red)}

/* special rows */
.brk{color:var(--red)}
.brk .lb{font-weight:700}
.brk .m{color:var(--red)}
.brk .why{color:var(--dim)}
.brk .lb{color:var(--red)}
.flashrow{animation:rowflash 2s ease-out 1}
@keyframes rowflash{0%{background:var(--flash-red)}100%{background:transparent}}
.cmpt .m{color:var(--purple)}
.cmpt .lb{color:var(--purple);font-weight:700}
.lyr{display:inline-flex;height:13px;vertical-align:-1px;margin:0 .6ch;border:0}
.lyr i{display:block;height:100%}
.lyr .a{background:var(--lyr-a)}.lyr .b{background:var(--lyr-b)}.lyr .c{background:var(--lyr-c)}
.lyr.small{opacity:.85}
.lyr.small .a,.lyr.small .b,.lyr.small .c{background:var(--lyr-s)}
.mailr .m{color:var(--amber)}
.mailr .q{color:var(--fg)}
.mailr .meta{color:var(--dim)}
.rule{color:var(--dim);display:flex;gap:1ch;align-items:center}
.rule::before{content:"";width:3ch;border-top:1px solid var(--faint)}
.gm .m{color:var(--purple)}
.gm .bd b{color:var(--purple)}
.ok{color:var(--green)}
.warnrow .m{color:var(--amber)}
.you .tm{display:none}
.pastechip{background:var(--bg3);color:var(--fg1);padding:0 1ch;border-radius:3px}
.cursor{display:inline-block;width:1ch;height:1.1em;background:var(--fg);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;margin-left:1px}

/* ---------- live region ---------- */
#live{flex:none;position:relative;background:var(--bg);border-top:1px solid var(--line);z-index:20}
#live .col{padding-top:5px;padding-bottom:6px}
#goal{display:flex;gap:1ch;color:var(--dim);white-space:nowrap;overflow:hidden;min-height:21px;cursor:default;align-items:baseline}
#goal .gl{color:var(--purple);font-weight:700}
#goal .gp{letter-spacing:.2ch;font-weight:700}
#goal .gv{overflow:hidden;text-overflow:ellipsis;min-width:0}
#goal:hover .gv{color:var(--fg1)}
#status{display:flex;gap:1ch;align-items:baseline;min-height:21px;white-space:nowrap;overflow:hidden}
#status .sp{color:var(--purple);width:1ch;text-align:center;flex:none}
#status .who{color:var(--purple);font-weight:700}
#status .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
#status .sd{color:var(--dim)}
#status .nm{cursor:help;border-bottom:1px dotted var(--faint)}
#status .esc{color:var(--dim);margin-left:auto;padding-left:1ch;flex:none}
#queued{color:var(--dim);display:flex;gap:1ch;align-items:baseline;min-height:21px;white-space:nowrap;overflow:hidden}
#queued .qg{color:var(--amber)}
#queued .qt{color:var(--fg1);overflow:hidden;text-overflow:ellipsis;min-width:0}
#queued button{color:var(--sky);text-decoration:underline;text-underline-offset:3px;flex:none}
#queued button:hover{color:var(--fg)}

#q{margin:6px 0 6px;border:1px solid var(--orange);border-radius:6px;background:var(--bg1);position:relative;padding:0 2ch 2px 2ch}
#q.bell{animation:qbell .9s steps(2,jump-none) 4}
@keyframes qbell{50%{background:var(--flash-q);border-color:var(--amber)}}
#q .qt{position:absolute;top:-11px;left:1.5ch;background:var(--bg);padding:0 1ch;color:var(--orange);font-weight:700;display:flex;gap:1ch;max-width:calc(100% - 3ch);white-space:nowrap;overflow:hidden}
#q .qt .ag{color:var(--blue)}
#q .qn{position:absolute;top:-11px;right:1.5ch;background:var(--bg);padding:0 1ch;color:var(--dim);white-space:nowrap}
#q .qcmd{display:flex;gap:2ch;margin-top:10px;align-items:baseline}
#q .qcmd code{color:var(--fg);font-weight:700;background:var(--bg3);padding:0 1ch;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
#q .qcmd .cwd{color:var(--dim);white-space:nowrap;flex:none}
#q .qcmd .cwd b{color:var(--fg1);font-weight:400}
#q .qwhy{color:var(--fg1)}
#q .qwhy b{color:var(--dim);font-weight:400}
#q .qopts{margin:8px 0 0;display:grid;gap:0}
.qo{display:grid;grid-template-columns:2ch 3ch minmax(0,1fr) auto;column-gap:1ch;padding:0 1ch;margin:0 -1ch;color:var(--dim);cursor:default;width:calc(100% + 2ch);align-items:baseline;border-radius:3px}
.qo .ky{color:var(--dim);font-weight:700}
.qo .pt{color:var(--orange);font-weight:700;visibility:hidden}
.qo .kh{color:var(--dim)}
#q.armed .qo{color:var(--fg);cursor:pointer}
#q.armed .qo .ky{color:var(--orange)}
#q.armed .qo:hover,#q.armed .qo.sel{background:var(--sel)}
#q.armed .qo.sel .pt{visibility:visible}
#q.armed .qo:hover .pt{visibility:visible}
#q .qo b{font-weight:700}
#q .qpause{display:flex;gap:1.5ch;align-items:center;margin-top:5px;color:var(--dim)}
#q .qpause .mt{display:inline-flex;gap:2px;flex:none}
#q .qpause .mt i{display:block;width:6px;height:11px;background:var(--faint)}
#q .qpause .mt i.on{background:var(--amber)}
#q.armed .qpause .mt i.on{background:var(--green)}
#q .qpause .wt{margin-left:auto;color:var(--dim);white-space:nowrap}
#q .qpause .rd{color:var(--green);font-weight:700;white-space:nowrap}
#q .qdiff{margin-top:4px}
#q .qbot{display:block}
#q .qo .sh{display:none}
#q.mini,#q.compact{padding:0 2ch 3px;margin:10px 0 4px}
#q.mini .qwhy,#q.mini .qcmd .cwd{display:none}
#q.compact .qwhy{margin-top:1px}
#q.mini .qcmd,#q.compact .qcmd{margin-top:8px}
#q.mini .qbot,#q.compact .qbot{display:flex;align-items:center;gap:2ch;flex-wrap:wrap;margin-top:2px}
#q.mini .qopts,#q.compact .qopts{display:flex;gap:2ch;margin:0;flex-wrap:wrap}
#q.mini .qo,#q.compact .qo{width:auto;margin:0;grid-template-columns:2ch 1.5ch auto;padding:0 1ch}
#q.mini .qo .lg,#q.compact .qo .lg{display:none}#q.mini .qo .sh,#q.compact .qo .sh{display:inline}
#q.mini .qpause,#q.compact .qpause{margin:0 0 0 auto}
#q.mini .qpause .wt,#q.compact .qpause .wt{margin-left:0}

#inwrap{position:relative}
#box{display:flex;gap:1ch;align-items:flex-start;border:1px solid var(--line2);border-radius:6px;padding:2px 1.5ch 2px 1.2ch;background:var(--bg);min-height:27px}
#box:focus-within{border-color:var(--purple)}
#box .pr{color:var(--purple);font-weight:700;width:1ch;flex:none;text-align:center;line-height:21px;padding-top:1px}
#box.ins .pr{color:var(--orange)}
#in{flex:1;min-width:0;background:transparent;border:0;resize:none;padding:1px 0;color:var(--fg);caret-color:var(--purple);caret-shape:block;line-height:21px;height:23px;max-height:168px;overflow-y:auto;scrollbar-width:thin}
#in:focus-visible{outline:none}
#in::placeholder{color:var(--dim);font-style:italic;opacity:1}
#box .mdhint{color:var(--dim);font-size:12px;line-height:21px;padding-top:1px;flex:none;white-space:nowrap}
#foot{display:flex;gap:2ch;justify-content:space-between;color:var(--dim);white-space:nowrap;margin-top:3px}
#foot .l,#foot .r2{display:flex;gap:1ch;min-width:0;align-items:baseline}
#foot .l{flex:0 1 auto;overflow:hidden}
#foot .r2{overflow:hidden;justify-content:flex-end;flex:0 1 auto}
#foot button{color:var(--dim);padding:0;white-space:nowrap}
#foot button:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
#foot .mode{font-weight:700}
#foot .mode.m-accept-edits{color:var(--amber)}
#foot .mode.m-plan{color:var(--sky)}
#foot .mode.m-bypass,#foot .mode.m-yolo{background:var(--red);color:var(--on);padding:0 1ch;border-radius:3px}
#foot .ss{color:var(--dim)}
#foot .sid{color:var(--dim)}

/* palette popup */
#pal{position:absolute;left:0;right:0;bottom:calc(100% + 6px);border:1px solid var(--line2);border-radius:6px;background:var(--bg1);z-index:40;display:flex;flex-direction:column;max-height:min(46vh,372px)}
#pal .ph{display:flex;justify-content:space-between;padding:2px 1.5ch;color:var(--dim);border-bottom:1px solid var(--line);flex:none;gap:2ch;white-space:nowrap;overflow:hidden}
#pal .ph b{color:var(--fg1);font-weight:700}
#pal .pl{overflow-y:auto;flex:1;min-height:0;padding:3px 0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#pal .gh{padding:0 1.5ch;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.po{display:grid;grid-template-columns:2ch 24ch minmax(0,1fr) auto;column-gap:1ch;padding:0 1.5ch;align-items:baseline;cursor:pointer;white-space:nowrap}
.po .pt{color:var(--purple);visibility:hidden;font-weight:700}
.po .nm{color:var(--sky);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.po.arg{grid-template-columns:2ch 38ch minmax(0,1fr) auto}
.po .nm .sl{color:var(--dim);font-weight:400}
.po .nm .a{color:var(--dim);font-weight:400}
.po .ds{color:var(--dim);overflow:hidden;text-overflow:ellipsis;min-width:0}
.po .rh{color:var(--dim);font-size:12px;padding-left:1ch}
.po.sel,.po:hover{background:var(--sel)}
.po.sel .pt{visibility:visible}
.po.sel .ds{color:var(--fg1)}
.po .nm u{text-decoration:none;color:var(--amber);border-bottom:1px solid var(--amber)}
#pal .pe{padding:6px 1.5ch;color:var(--dim)}
#pal .pf{border-top:1px solid var(--line);padding:2px 1.5ch;color:var(--dim);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb{display:inline-block;background:var(--bg3);color:var(--fg);padding:0 .8ch;border-radius:3px;font-size:12px;line-height:17px;border:1px solid var(--line2);font-weight:700;white-space:nowrap}

/* ---------- pages ---------- */
#page{position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
#page .pgw{width:100%;max-width:calc(168ch + 40px);margin:0 auto;padding:0 20px 14px}
.pghd{display:flex;gap:1ch;align-items:baseline;padding-top:8px;position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:6px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.pghd .nm{color:var(--purple);font-weight:700}
.pghd .ti{color:var(--fg);font-weight:700}
.pghd .sp{flex:1}
.pghd .st{color:var(--dim);display:flex;gap:1ch}
.pghd .st .live{color:var(--green)}
.pghd .x{color:var(--dim);padding:0 1ch;border:1px solid var(--line2);border-radius:3px;font-size:12px;line-height:19px;height:21px;flex:none}
.pghd .x:hover{color:var(--fg);border-color:var(--purple)}
.pgft{color:var(--dim);margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.fr{position:relative;border:1px solid var(--line);margin-top:19px;padding:11px 1.5ch 6px;min-width:0}
.fr>.ft{position:absolute;top:-11px;left:1.5ch;padding:0 1ch;background:var(--bg);color:var(--fg);font-weight:700;height:21px;line-height:21px;white-space:nowrap;max-width:calc(100% - 3ch);overflow:hidden;text-overflow:ellipsis}
.fr>.ft2{position:absolute;top:-11px;right:1.5ch;padding:0 1ch;background:var(--bg);color:var(--dim);height:21px;line-height:21px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px}
.pgsec{margin-top:6px}
table.t{border-collapse:collapse;width:100%}
table.t th{color:var(--dim);font-weight:400;text-align:left;padding:0 1.5ch 0 0;white-space:nowrap}
table.t td{padding:0 1.5ch 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40ch}
table.t th.ra,table.t td.ra{text-align:right}
table.t tr.row:hover td{background:var(--bg2)}
table.t tr.sel td{background:var(--sel)}
table.t td.wrap{white-space:normal}
table.t td.fx{max-width:none}
table.t tr.row{cursor:default}
.hp{cursor:help}
.hp:hover{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--dim)}
.bar{display:inline-flex;height:14px;vertical-align:-2px;background:var(--bg2);width:20ch;overflow:hidden;border-radius:0}
.bar i{display:block;height:100%}
.hbar{display:flex;height:21px;background:var(--bg2);width:100%;overflow:hidden}
.hbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--on);font-weight:700;overflow:hidden;white-space:nowrap;min-width:0}
.sv{display:inline-flex;gap:1px;align-items:flex-end;height:15px;vertical-align:-2px}
.sv i{display:block;width:5px;background:var(--green)}
.sv i.m{background:var(--amber)}.sv i.l{background:var(--red)}
.sv i.z{background:var(--red);height:2px!important}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:2ch}
.kv dt{color:var(--dim)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.kv{margin:0}
.lead{color:var(--fg1);margin:0}
.tagc{display:inline-block;padding:0 .8ch;border:1px solid var(--line2);border-radius:3px;color:var(--fg1);font-size:12px;line-height:17px;margin-right:.6ch;white-space:nowrap}
.tagc.warn{border-color:var(--red);color:var(--red)}
.tagc.ok{border-color:var(--green);color:var(--green)}
.tagc.am{border-color:var(--amber);color:var(--amber)}
.btn{display:inline-block;border:1px solid var(--line2);color:var(--fg1);padding:0 1.2ch;height:23px;line-height:21px;border-radius:3px;white-space:nowrap;background:var(--bg)}
.btn:hover{border-color:var(--purple);color:var(--fg)}
.btn.pri{background:var(--purple);color:var(--on);border-color:var(--purple);font-weight:700}
.btn.pri:hover{filter:brightness(1.1);color:var(--on)}
.btn.dng{border-color:var(--red);color:var(--red)}
.btn.dng:hover{background:var(--red);color:var(--on)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:1ch;flex-wrap:wrap;margin-top:8px}
.inp{background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:0 1ch;height:23px;color:var(--fg);min-width:0}
.inp:focus{border-color:var(--purple)}
.inp::placeholder{color:var(--dim)}
select.inp{padding-right:1ch}
.toggle{display:inline-flex;gap:1ch;align-items:center;cursor:pointer}
.toggle .sw{width:5ch;height:19px;border:1px solid var(--line2);border-radius:10px;position:relative;background:var(--bg)}
.toggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--dim)}
.toggle[aria-checked=true] .sw{border-color:var(--green)}
.toggle[aria-checked=true] .sw::after{left:calc(100% - 15px);background:var(--green)}
.toggle .tx{min-width:3ch}

/* cockpit */
.cp-top{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);column-gap:20px}
.horse{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px}
#hcv{display:block;image-rendering:pixelated;max-width:100%}
.hlabs{position:relative;height:21px;width:100%}
.hlabs button{position:absolute;transform:translateX(-50%);font-size:12px;padding:0 3px;line-height:21px;border-radius:2px;white-space:nowrap}
.hlabs button:hover{background:var(--bg3)}
.hcap{color:var(--dim);margin-top:2px;text-align:center}
.pfx .hd{display:flex;gap:1.5ch;align-items:baseline;flex-wrap:wrap}
.pfx .hd b{font-weight:700}
.pfx .wm{display:inline-flex;align-items:center;gap:.8ch}
.pfx .wm .mt{display:inline-flex;gap:2px}
.pfx .wm .mt i{display:block;width:7px;height:11px;background:currentColor}
.pfx .wm .mt i.off{opacity:.2}
.pfx .wm.hot{color:var(--amber)}.pfx .wm.low{color:var(--red)}.pfx .wm.cold{color:var(--dim)}
.pbar{display:flex;height:34px;margin-top:10px;background:var(--bg2);position:relative}
.pbar i{display:block;height:100%}
.pbar.flash{animation:pflash .55s steps(2,jump-none) 4}
@keyframes pflash{50%{opacity:.4}}
.pbar.fl2 i{background:var(--red)!important}
.glab{display:flex;margin-top:2px;font-weight:700}
.glab span{display:block;white-space:nowrap}
.riders{display:grid;grid-template-columns:repeat(8,1fr);margin-top:2px;text-align:center}
.riders .rd{display:flex;flex-direction:column;align-items:center}
.riders .ln{width:0;height:46px;border-left:2px solid var(--blue)}
.riders .ln.idle{border-left:2px dashed var(--faint)}
.riders .ln.bad{border-left-color:var(--red)}
.riders button{padding:0 2px;font-weight:700;text-align:center}
.riders button.off{color:var(--dim);font-weight:400}
.riders button:hover{text-decoration:underline}
.pfx .note{color:var(--dim);margin-top:6px}
.ag-id{font-weight:700}
.pmini{display:inline-flex;height:13px;width:15ch;background:var(--bg2);vertical-align:-2px;overflow:hidden}
.pmini i{display:block;height:100%}
.gantt svg{display:block;width:100%;height:auto}
.gantt .lbl{font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:2ch;min-height:105px}
.board h4{margin:0;font-weight:700;font-size:inherit;display:flex;gap:1ch}
.board .tk{display:flex;gap:1ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.board .tk:hover{background:var(--bg2)}
.tkid{font-weight:700}
.cp-bot{display:grid;grid-template-columns:1.25fr 1.5fr .9fr .9fr;column-gap:20px}
.mailp .ml{display:grid;grid-template-columns:2ch auto minmax(0,1fr);column-gap:1ch;white-space:nowrap;overflow:hidden}
.mailp .ml .tx{overflow:hidden;text-overflow:ellipsis;color:var(--fg1)}
.mailp .fut{opacity:1;color:var(--dim)}
.tally{display:grid;grid-template-columns:auto 1fr auto;column-gap:1.5ch;max-width:24ch}
.glyphs{display:flex;gap:1ch;margin-bottom:6px;flex-wrap:wrap}

/* pane (agent transcript) */
#pane{position:absolute;top:0;right:0;bottom:0;width:min(62ch,92%);background:var(--bg1);border-left:1px solid var(--line2);z-index:15;display:flex;flex-direction:column}
#pane .ph{display:flex;gap:1ch;padding:3px 1.5ch;border-bottom:1px solid var(--line);align-items:baseline;flex:none;background:var(--bg2)}
#pane .ph .t{font-weight:700}
#pane .ph .sp{flex:1}
#pane .pb{flex:1;min-height:0;overflow-y:auto;padding:8px 1.5ch;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#pane .pf2{border-top:1px solid var(--line);padding:3px 1.5ch;color:var(--dim);flex:none}
.xbtn{color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:0 1ch;font-size:12px;line-height:19px;height:21px}
.xbtn:hover{color:var(--fg);border-color:var(--purple)}

/* dialog */
#dlgb{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px}
#dlg{background:var(--bg1);border:1px solid var(--line2);border-radius:6px;width:min(100%,112ch);max-height:100%;display:flex;flex-direction:column;position:relative;margin-top:10px}
#dlg>.dh{display:flex;gap:1ch;align-items:baseline;padding:3px 1.5ch;border-bottom:1px solid var(--line);flex:none}
#dlg>.dh .t{font-weight:700}
#dlg>.dh .sp{flex:1}
#dlg>.db{padding:8px 1.5ch;overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#dlg>.df{border-top:1px solid var(--line);padding:3px 1.5ch;color:var(--dim);flex:none}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:4ch}
.keys .kr{display:grid;grid-template-columns:20ch 1fr;column-gap:1ch;align-items:baseline;padding:1px 0}
.keys h4{grid-column:1/-1;margin:10px 0 2px;color:var(--purple);font-size:inherit}
.keys h4:first-child{margin-top:0}

/* tooltip */
#tip{position:fixed;z-index:200;max-width:46ch;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:3px 1.2ch;color:var(--fg);font-size:12px;line-height:18px;pointer-events:none;white-space:pre-wrap}
#tip b{color:var(--amber)}

/* toast */
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;background:var(--bg3);border:1px solid var(--line2);color:var(--fg);padding:2px 1.5ch;border-radius:4px;z-index:90;white-space:nowrap}

/* stub pages */
pre.help{background:var(--bg1);border:1px solid var(--line);padding:6px 1.5ch;color:var(--fg1);overflow-x:auto;white-space:pre;overflow-wrap:normal}
pre.help .fl-c{color:var(--sky)}
.stubn{color:var(--dim);margin-top:8px}
.cmdline{display:flex;gap:1ch;align-items:center;background:var(--bg1);border:1px solid var(--line);border-radius:4px;padding:2px 1.5ch;margin-top:8px}
.cmdline code{color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdline .dl{color:var(--green)}

/* list pages */
.lrow{display:grid;column-gap:1.5ch;align-items:baseline;white-space:nowrap}
.lsel{background:var(--sel)}

/* mono / NO_COLOR */
#app.mono{
  --purple:var(--fg);--blue:var(--fg);--sky:var(--fg);--teal:var(--fg);--green:var(--fg);--amber:var(--fg);--orange:var(--fg);--red:var(--fg);
  --mane:var(--fg);--horse:#d9dcee;--horse-mane:#9aa3c8;--g0:var(--fg);--g1:var(--fg);--g2:var(--fg);--g3:var(--fg);--g4:var(--fg);--g5:var(--fg);--lyr-a:var(--fg);--lyr-b:var(--fg);--lyr-c:var(--fg);--lyr-s:var(--fg);--selbg:var(--fg);--selfg:var(--bg);--flash-red:var(--bg3);--flash-amber:var(--bg3);--flash-q:var(--bg3);--add-bg:transparent;--del-bg:transparent;--add-hl:transparent;--del-hl:transparent;--sel:var(--fg);
  --dim:#8a93b8;
}
#app.mono *{text-shadow:none}
#app.mono .sel,#app.mono .po.sel,#app.mono #q.armed .qo.sel,#app.mono table.t tr.sel td,#app.mono .lsel{background:var(--fg);color:var(--bg)}
#app.mono .po.sel *,#app.mono #q.armed .qo.sel *,#app.mono table.t tr.sel td *,#app.mono .lsel *{color:var(--bg)!important}
#app.mono .tab[aria-selected=true]{background:var(--fg);color:var(--bg)}
#app.mono #bar .brand{background:var(--fg)}
#app.mono .brk .lb,#app.mono .brk .m{background:var(--fg);color:var(--bg);padding:0 1ch}
#app.mono .brk .m{padding:0}
#app.mono .diff .d.add .tx{font-weight:700}
#app.mono .diff .d.add .sg,#app.mono .diff .d.del .sg{font-weight:700}
#app.mono .diff .d.del .tx{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px}
#app.mono .diff i.hl{background:var(--fg);color:var(--bg)}
#app.mono .diff .d.add>span{box-shadow:inset 2px 0 0 var(--fg)}
#app.mono #q{border-color:var(--fg);border-style:double;border-width:3px}
#app.mono #q .qt{background:var(--fg);color:var(--bg)}
#app.mono #q .qt *{color:var(--bg)!important}
#app.mono .btn.pri,#app.mono .skip{background:var(--fg);color:var(--bg)}
#app.mono #foot .mode.m-bypass,#app.mono #foot .mode.m-yolo{background:var(--fg);color:var(--bg)}
#app.mono .lyr i{background:var(--fg)!important}
#app.mono .lyr .a{opacity:1}#app.mono .lyr .b{opacity:.7}#app.mono .lyr .c{opacity:.45}
#app.mono .lyr.small i{opacity:.4}
#app.mono .bar i,#app.mono .hbar i,#app.mono .pmini i,#app.mono .pbar i,#app.mono .sv i{background:var(--fg)!important;color:var(--bg)}
#app.mono .sv i.m{opacity:.55}#app.mono .sv i.l,#app.mono .sv i.z{opacity:.9;outline:1px solid var(--fg);background:var(--bg)!important}
#app.mono .riders .ln{border-left-color:var(--fg)}
#app.mono .fr>.ft,#app.mono #q .qn{outline:0}
#app.mono mark.hit{background:var(--fg);color:var(--bg);text-decoration:underline}
#app.mono mark.hit.cur{outline:2px solid var(--fg)}
#app.mono .tagc.warn{background:var(--fg);color:var(--bg)}
#app.mono .flashrow{animation:none}
#app.mono #q .qpause .mt i.on{background:var(--fg)}
#app.mono .cursor,#app.mono .diff .caret::after{background:var(--fg)}
#app.mono #warm.low{background:var(--fg);color:var(--bg)}
#app.mono #q.armed .qo .ky{background:var(--fg);color:var(--bg);padding:0 .5ch}

const D_ITEMS=(()=>{const src=`package catalog

import "sort"

// MaxSize is the largest page a client may ask for.
const MaxSize = 48

// Item is one thing the shop sells. Prices are in cents.
type Item struct {
	ID         string \`json:"id"\`
	Name       string \`json:"name"\`
	PriceCents int64  \`json:"price_cents"\`
}

// Page is one page of the catalogue, counted from 1.
type Page struct {
	Items []Item \`json:"items"\`
	Page  int    \`json:"page"\`
	Pages int    \`json:"pages"\`
	Total int    \`json:"total"\`
}

// Store holds the catalogue in memory, sorted by ID.
type Store struct{ rows []Item }

// New returns a Store over rows, sorted by ID.
func New(rows []Item) *Store {
	s := &Store{rows: append([]Item(nil), rows...)}
	sort.Slice(s.rows, func(i, j int) bool { return s.rows[i].ID < s.rows[j].ID })
	return s
}

// List returns page number page (from 1) of at most size items. A page below 1 is page 1,
// a page past the end is the last page, and a size outside 1..MaxSize is clamped.
func (s *Store) List(page, size int) Page {
	size = min(max(size, 1), MaxSize)
	pages := (len(s.rows) + size - 1) / size
	page = min(max(page, 1), max(pages, 1))
	lo := (page - 1) * size
	hi := min(lo+size, len(s.rows))
	return Page{Items: s.rows[lo:hi], Page: page, Pages: pages, Total: len(s.rows)}
}`;return src.split('\n').map((t,i)=>['+',0,i+1,t]);})();

/* ===== sim engine ===== */
function at(delay,fn){S.q.push([S.t+delay,fn]);S.q.sort((a,b)=>a[0]-b[0])}
function stream(el,text,cps,done,o){o=o||{};S.streams.push({el,text,i:o.start||0,cps:cps||44,done,acc:0,o})}
function setState(id,state,doing,opts={}){
  const a=S.ag[id];if(!a)return;
  const tt=sess(),was=a.state;
  const working=s=>['think','tool','edit'].includes(s);
  const g=S.gantt[id]||(S.gantt[id]=[]);
  const open=g[g.length-1];
  if(open&&open.e==null&&(!working(state)||open.st!==state)){open.e=tt}
  if(working(state)&&(!open||open.e!=null))g.push({s:tt,e:null,st:state});
  a.state=state;if(doing!=null)a.doing=doing;
}
function warmRefill(id){S.warm=S.warmMax;S.warmFlash=.7;if(id&&S.ag[id])S.ag[id].lr=sess()}
function bump(id,dTok,dCost){const a=S.ag[id];a.tok+=dTok;a.cost+=dCost;S.cost+=dCost}
function step(dt){
  S.t+=dt;
  S.spinner+=dt*10;
  while(S.q.length&&S.q[0][0]<=S.t){const e=S.q.shift();try{e[1]()}catch(err){console.error(err)}}
  // streams
  for(let k=S.streams.length-1;k>=0;k--){
    const s=S.streams[k];s.acc+=dt*s.cps;const n=Math.floor(s.acc);
    if(n>0){s.acc-=n;s.i=Math.min(s.text.length,s.i+n);
      const part=s.text.slice(0,s.i);
      s.el.innerHTML=(s.o.html?s.o.html(part):esc(part))+(s.i<s.text.length&&!s.o.start?'<span class="cursor"></span>':'');
      if(A.stick&&A.tab===1)sbEl().scrollTop=sbEl().scrollHeight}
    if(s.i>=s.text.length){S.streams.splice(k,1);if(s.done)s.done()}
  }
  // counters
  if(!S.final){
    const w=actives().length;
    S.up+=dt*(12+w*14);S.down+=dt*(2+w*3);
    S.cost+=dt*.00011*(1+w);
    S.tot.cr+=dt*(40+w*70);S.tot.unc+=dt*(3+w*3);S.tot.out+=dt*(4+w*4);
    S.ids.forEach(id=>{const a=S.ag[id];if(['think','tool','edit'].includes(a.state)){a.tok+=dt*(18+Math.random()*6);a.cost+=dt*.00004}});
    if(S.queue.head&&S.queue.head.t0!=null)S.queue.head.t0+=dt;
  }
  S.warm=Math.max(0,S.warm-dt);
  if(S.warmFlash>0)S.warmFlash=Math.max(0,S.warmFlash-dt);
  if(S.prefixBad>0)S.prefixBad=Math.max(0,S.prefixBad-dt);
  if(S.q1.open&&!S.answered)S.q1.waits+=dt;
}

let horse={img:null,t:0};
function drawHorse(ts){
  const cv=$('#hcv');if(!cv||!A.page||A.page.id!=='cockpit')return;
  const sc=Math.max(5,Math.min(8,Math.floor(Math.min(cv.parentElement.clientWidth-10,600)/SPRITE.w)));
  const dpr=window.devicePixelRatio||1,w=SPRITE.w*sc,h=SPRITE.h*sc;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px'}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.imageSmoothingEnabled=false;
  const css=getComputedStyle($('#app'));const col=n=>css.getPropertyValue('--'+n).trim();const T={body:col('horse')||'#e6e5f3',mane:col('horse-mane')||'#8e6cf0',ink:col('ink')||'#24232e',hoof:col('hoof')||'#3a3850'};
  const px=(x,y,c,a)=>{g.globalAlpha=a==null?1:a;g.fillStyle=c;g.fillRect(x*sc,y*sc,sc,sc)};
  const mono=A.mono;
  SPRITE.body.forEach((row,y)=>{for(let x=0;x<row.length;x++){const c=row[x];if(c==='.')continue;px(x,y,c==='b'?T.body:c==='m'?T.mane:T.ink)}});
  const t=(ts||0)/1000,frame=Math.floor(t*(reduced()?0:7));
  S.ids.forEach((id,k)=>{
    const a=S.ag[id],working=['think','tool','edit'].includes(a.state);
    const cc=col(LEGC[k])||'#7aa2f7';let alpha=working?1:a.state==='done'?.6:a.state==='ask'?(Math.floor(t*2)%2?1:.45):.7;
    if(reduced()&&a.state==='ask')alpha=.9;
    const ph=working?(frame+k)%4:3;
    const pts=SPRITE.legs[k][ph];
    pts.forEach(([x,y],i)=>{px(x,y,cc,alpha)});
    // hoof: darken the lowest pixel of the leg
    let low=pts[0];pts.forEach(p=>{if(p[1]>=low[1])low=p});px(low[0],low[1],T.hoof,1);
    if(a.state==='ask'||a.state==='wait'){}
  });
  g.globalAlpha=1;
  // labels under the hips, once
  const hl=$('#hlab');if(hl&&!hl.dataset.ok||hl&&hl.dataset.sc!==String(sc)){hl.dataset.ok=1;hl.dataset.sc=sc;hl.style.width=w+'px';hl.innerHTML=S.ids.map((id,k)=>`<button type="button" data-ag="${id}" class="c-${ROLES[S.ag[id].role]}" style="left:${(SPRITE.hips[k]+.5)*sc}px">${id.replace('-','')}</button>`).join('')}
  const hc=$('#hcap');if(hc){const n=0;hc.textContent='one leg per agent · ✎ ⚙ ◇ move · ✉ ◌ stand · ✓ rests · ? blinks'}
}

  ${fr('models',`<table class="t" role="grid"><thead><tr><th style="width:3ch"></th><th>model</th><th class="ra">context</th><th class="ra hide-sm">in $/M</th><th class="ra">out $/M</th><th class="hide-sm">takes</th><th class="hide-md">via</th></tr></thead><tbody>${L.length?L.map((m,i)=>`<tr class="row ${i===A.sessSel?'sel':''}" data-mrow="${i}" data-ref="${m.r}"><td><button type="button" class="${A.favs[m.r]?'c-amber':'dim'}" data-fav="${m.r}" aria-pressed="${!!A.favs[m.r]}" aria-label="${A.favs[m.r]?'unstar':'star'} ${m.r}">${A.favs[m.r]?'★':'☆'}</button></td><td class="b ${m.r===A.model?'c-purple':''}">${m.r===A.model?'● ':''}${esc(m.r)}${m.r===A.model?' <span class="dim" style="font-weight:400">(current)</span>':''}</td><td class="ra">${m.ctx}</td><td class="ra hide-sm">${price(m.cin)}</td><td class="ra">${price(m.cout)}</td><td class="hide-sm">${m.tools?'<span class="tagc">tools</span>':''}${m.rea?'<span class="tagc">reasoning</span>':''}</td><td class="dim hide-md">${esc(m.via)}</td></tr>`).join(''):`<tr><td colspan="7" class="dim wrap">no model matches these filters</td></tr>`}</tbody></table>`,{r:`${L.length} of ${MODELS.length}`})}

function copyText(txt,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='copied';setTimeout(()=>{btn.textContent=o},1200)}else toast('copied')};
  try{navigator.clipboard.writeText(txt).then(done,()=>fb())}catch(e){fb()}
  function fb(){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}catch(e){toast('copy failed: select the text instead')}}
}

function showTip(el){

  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;

function score(q,name,desc){
  q=q.toLowerCase();const n=name.toLowerCase();if(!q)return 1;
  if(n===q)return 1000;if(n.startsWith(q))return 500-n.length;
  const i=n.indexOf(q);if(i>=0)return 300-i;
  let j=0,g=0;for(let k=0;k<n.length&&j<q.length;k++){if(n[k]===q[j])j++;else if(j>0)g++}
  if(j===q.length)return 100-g;
  if(desc&&desc.toLowerCase().includes(q))return 20;return 0;
}
function hlName(q,name){
  q=q.toLowerCase();if(!q)return esc(name);const n=name.toLowerCase();
  let i=n.indexOf(q);if(i>=0)return esc(name.slice(0,i))+'<u>'+esc(name.slice(i,i+q.length))+'</u>'+esc(name.slice(i+q.length));
  let j=0,o='';for(let k=0;k<name.length;k++){if(j<q.length&&n[k]===q[j]){o+='<u>'+esc(name[k])+'</u>';j++}else o+=esc(name[k])}
  return j===q.length?o:esc(name);
}

function popCompute(){

    return {kind:'hist',title:'history · ctrl+r',items,empty:'no earlier line matches'};
  }

    const m=/^\/(\S*)(\s+)?([\s\S]*)$/.exec(v);const name=m[1].toLowerCase(),hasSp=!!m[2];
    if(hasSp){
      const src=ARGSRC[name];if(!src)return null;
      const f=m[3].toLowerCase();
      const items=src().filter(x=>!f||x.v.toLowerCase().includes(f)).map(x=>({kind:'arg',cmd:name,nm:x.v,hl:hlName(f,x.v),val:x.v,d:x.d,danger:x.danger,rhs:''}));
      return {kind:'arg',title:'/'+name,items,empty:'nothing matches',sticky:true};
    }
    const f=name;let items;
    if(!f){items=[];CMD_GROUPS.forEach((g,gi)=>{items.push({head:g});CMDS.filter(c=>c.g===gi).forEach(c=>items.push(cmdItem(c)))});items.push({head:'sleipnir program commands (open a page here)'});SHELL.forEach(s=>items.push(shItem(s)));items.push({head:'this window (web only)'});WEBCMDS.forEach(s=>items.push(webItem(s)))}
    else{const sc=[];CMDS.forEach(c=>{const s=score(f,c.n,c.d);if(s>0)sc.push([s,cmdItem(c,f)])});SHELL.forEach(c=>{const s=score(f,c.n,c.d);if(s>0)sc.push([s-5,shItem(c,f)])});WEBCMDS.forEach(c=>{const s=score(f,c.n,c.d);if(s>0)sc.push([s-8,webItem(c,f)])});sc.sort((a,b)=>b[0]-a[0]);items=sc.map(x=>x[1])}

  return null;

function popUpdate(keepSel){

const SRCH={marks:[],cur:-1,box:null};
function searchRoot(){return A.page?$('#pgbody'):curHost()}
function clearMarks(){$$('mark.hit').forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()});SRCH.marks=[];SRCH.cur=-1}
function doSearch(){
  clearMarks();const q=$('#srin').value;
  if(q.length<2){$('#srn').textContent='0/0';return}
  const root=searchRoot();if(!root)return;
  const ql=q.toLowerCase();const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentNode;if(!p||p.closest('button.cp,script,style,canvas'))return NodeFilter.FILTER_REJECT;return n.nodeValue.toLowerCase().includes(ql)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue,low=txt.toLowerCase();let i=0,last=0;const frag=document.createDocumentFragment();let found=false;
    while((i=low.indexOf(ql,last))>=0){found=true;if(i>last)frag.appendChild(document.createTextNode(txt.slice(last,i)));const m=document.createElement('mark');m.className='hit';m.textContent=txt.slice(i,i+q.length);frag.appendChild(m);last=i+q.length}
    if(found){if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));n.parentNode.replaceChild(frag,n)}
  });
  SRCH.marks=$$('mark.hit',root);
  if(SRCH.marks.length){SRCH.cur=SRCH.marks.length-1;jumpMark(0)}
  else $('#srn').textContent='0/0';
  drawSearchRail();
}
function jumpMark(d){
  const n=SRCH.marks.length;if(!n)return;
  if(SRCH.marks[SRCH.cur])SRCH.marks[SRCH.cur].classList.remove('cur');
  SRCH.cur=(SRCH.cur+d+n)%n;const m=SRCH.marks[SRCH.cur];m.classList.add('cur');
  const hid=m.closest('[hidden]');if(hid){hid.hidden=false;const mb=hid.parentNode&&$('[data-more]',hid.parentNode);if(mb)mb.textContent='… collapse'}
  m.scrollIntoView({block:'center'});A.stick=false;
  $('#srn').textContent=(SRCH.cur+1)+'/'+n;
}
function drawSearchRail(){const rail=$('#rail');if(A.page||!SRCH.marks.length)return;const sb=sbEl(),H2=sb.scrollHeight;rail.innerHTML=SRCH.marks.map(m=>`<i style="top:${((SC.offsetTop+m.getBoundingClientRect().top-sb.getBoundingClientRect().top+sb.scrollTop)/H2*100).toFixed(2)}%;background:var(--amber);width:8px;right:0"></i>`).join('')}
function openSearch(){const s=$('#srch');s.hidden=false;const i=$('#srin');i.focus();i.select();if(i.value)doSearch()}

      if(it&&it.kind==='slash'&&IN.value.trim()!=='/'+it.c.n&&!/\s/.test(IN.value)){popComplete(it,true)}

    if(k==='Escape'){e.preventDefault();closePop();return}
  }
  // escape chain
  if(k==='Escape'){
    if(tipShown()){hideTip()}

    if(A.pane){e.preventDefault();closePane();return}

}
