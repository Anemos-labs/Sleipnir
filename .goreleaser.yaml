version: 2
project_name: sleipnir

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: sleipnir
    main: ./cmd/sleipnir
    binary: sleipnir
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - {goos: windows, goarch: arm64}
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "sleipnir_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md, docs/**/*]

checksum:
  name_template: checksums.txt

# One SBOM (SPDX JSON) per archive, published next to it. syft is installed by .github/workflows/release.yml, which
# attests the archives and checksums.txt as well.
sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]

# Nothing in this file publishes or writes release notes. .github/workflows/release.yml builds with --skip=publish and
# creates the release with `gh release create --generate-notes`, so the notes come from .github/release.yml (labels set by
# .github/workflows/pr.yml from the pull request titles) and a release is made in exactly one place, behind one gate.
changelog:
  disable: true
release:
  disable: true
