name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: go.mod is tidy (the release hook requires it)
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race)
        run: go test -race -count=1 -timeout 20m ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: build every target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/sleipnir
            echo "ok $t"
          done

  sim:
    name: cache-policy guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go test -count=1 ./internal/kv/sim
      - run: go run ./cmd/sleipnir sim --mode scenarios

  docs:
    name: documents agree with the code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: docs/CLI.md lists every flag and command of the binary
        run: sh scripts/gen-cli-docs.sh --check
      - name: README's simulator block is current
        run: |
          cp README.md /tmp/README.before
          sh scripts/readme-sim.sh
          diff -u /tmp/README.before README.md || { echo "README.md's sim block is stale: run make readme-sim"; exit 1; }
