name: coderabbit

# coderabbit-gate is a required check (.github/rulesets/main.json). It holds a merge while CodeRabbit is still reviewing
# the head commit, and while a finding CodeRabbit wrote in a review body has no answer. Review threads are not counted
# here: the ruleset already requires every thread to be resolved.
#
# CodeRabbit reports its own check run, named CodeRabbit, on each commit it looks at. The gate waits for that run, then
# reads how it ended. A finished review is enforced. A review CodeRabbit did not make (rate limited, plan limit reached,
# paused, skipped, failed) does not block: the gate passes with a notice that says why. A commit CodeRabbit never starts
# on within START_WAIT (the app is not installed, or is down) passes with a warning, so an outage cannot block every pull
# request.
#
# Findings outside the diff and nitpicks have no thread to resolve. Each one needs a pull request comment, written after
# the review by an account that is not a bot, that mentions @coderabbitai and names the finding's file path: say what was
# fixed, or why the finding does not apply.
#
# The script runs nothing from the pull request: it reads the event, then GitHub's API. Comments and CodeRabbit's check
# run do not start a pull_request workflow, so coderabbit-rerun.yml runs this workflow again when they change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: coderabbit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read # CodeRabbit's check run on the head commit
      issues: read # the pull request's comments
      pull-requests: read # the pull request and its reviews
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const BOT = 'coderabbitai[bot]';
            const START_WAIT = 10 * 60e3; // for CodeRabbit's check run to appear
            const DONE_WAIT = 35 * 60e3; // for it to finish
            const {owner, repo} = context.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.draft) {
              core.notice('Draft: CodeRabbit reviews this pull request once it is ready, and the gate runs again then.');
              return;
            }

            // The newest CodeRabbit check run on the commit the event names.
            const latest = async () => {
              const runs = await github.paginate(github.rest.checks.listForRef,
                {owner, repo, ref: sha, check_name: 'CodeRabbit', filter: 'all', per_page: 100});
              return runs.filter((r) => r.app && r.app.slug === 'coderabbitai').sort((a, b) => b.id - a.id)[0];
            };
            const start = Date.now();
            let run = await latest();
            while (Date.now() - start < DONE_WAIT && (run ? run.status !== 'completed' : Date.now() - start < START_WAIT)) {
              await sleep(30e3);
              run = await latest();
            }

            const blocking = [];
            if (!run) {
              core.warning(`CodeRabbit reported no check on ${sha.slice(0, 7)} within ${START_WAIT / 60e3} minutes (not installed, or unavailable). Not blocking.`);
            } else if (run.status !== 'completed') {
              blocking.push(`CodeRabbit is still reviewing ${sha.slice(0, 7)}. This gate runs again when its check completes.`);
            } else {
              const result = `${run.output.title || ''}: ${(run.output.summary || '').split('\n')[0]}`;
              if (run.conclusion === 'success') {
                core.info(`CodeRabbit reviewed ${sha.slice(0, 7)} (${result}).`);
              } else {
                // Rate limits, a used-up plan, a pause, a skip, a failure: CodeRabbit did not review this commit.
                core.notice(`CodeRabbit did not review ${sha.slice(0, 7)} (${run.conclusion}, ${result}). Not blocking; findings of earlier reviews still apply.`);
              }
            }

            // Findings of review bodies, read from the "Prompt to fix review comments" block CodeRabbit appends:
            //   Outside diff comments:            (or Nitpick comments:)
            //   Review comments at @PATH:
            //   - Line N: TEXT                    (or - Around line A-B: TEXT)
            const bodyFindings = (body) => {
              const out = [];
              let section = '', path = '';
              for (const raw of body.split('\n')) {
                const line = raw.trim();
                let m;
                if (/^(Inline|Outside diff|Nitpick|Duplicate) comments:$/.test(line)) {
                  section = /^(Outside diff|Nitpick)/.test(line) ? line.replace(/ comments:$/, '') : '';
                  path = '';
                } else if (line === '---' || line.startsWith('```')) {
                  section = '';
                } else if (section && (m = /^Review comments at @(.+):$/.exec(line))) {
                  path = m[1];
                } else if (section && path && (m = /^- (?:Around line|Line)s? ([0-9-]+): (.*)$/.exec(line))) {
                  out.push({section, path, line: m[1], text: m[2]});
                } else if (section && path && line && out.length && out[out.length - 1].path === path) {
                  const last = out[out.length - 1]; // the finding's text goes on over the next lines
                  if (last.text.length < 240) last.text += ' ' + line;
                }
              }
              return out;
            };
            // How many such findings the review says it has, so a format change cannot hide them.
            const declared = (body) => {
              let n = 0;
              for (const m of body.matchAll(/(Outside diff range comments|Nitpick comments)\s*(?:\((\d+)\)|:\s*(\d+))/g)) {
                n += Number(m[2] || m[3]);
              }
              return n;
            };

            const reviews = await github.paginate(github.rest.pulls.listReviews,
              {owner, repo, pull_number: number, per_page: 100});
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: number, per_page: 100});
            const answers = comments.filter((c) => c.user && c.user.type !== 'Bot' && /@coderabbitai\b/i.test(c.body || ''));
            const answered = (after, path) => answers.some((c) =>
              new Date(c.created_at) > new Date(after) && (path === '' || (c.body || '').includes(path)));

            const seen = new Set();
            for (const r of reviews) {
              if (!r.user || r.user.login !== BOT || !r.body) continue;
              const found = bodyFindings(r.body);
              const missing = declared(r.body) - found.length;
              if (missing > 0 && !answered(r.submitted_at, '')) {
                blocking.push(`${r.html_url}: ${missing} finding(s) outside the diff or nitpick(s) the gate could not read; answer them in a comment that mentions @coderabbitai.`);
              }
              for (const f of found) {
                const key = `${f.section}|${f.path}|${f.line}|${f.text.slice(0, 80)}`;
                if (seen.has(key)) continue;
                seen.add(key);
                if (!answered(r.submitted_at, f.path)) {
                  blocking.push(`${f.section} finding at ${f.path}:${f.line} (${r.html_url}): ${f.text.slice(0, 240)}`);
                }
              }
            }

            await core.summary.addHeading('CodeRabbit gate', 3)
              .addRaw(run ? `CodeRabbit check on ${sha.slice(0, 7)}: ${run.status} ${run.conclusion || ''} (${run.output.title || ''})` : 'No CodeRabbit check on this commit.')
              .addList(blocking.length ? blocking : ['Nothing blocks the merge.'])
              .write();
            if (blocking.length) {
              core.setFailed(`${blocking.length} item(s) block the merge. Fix each finding, or answer it in a pull request comment that mentions @coderabbitai and names its file path.\n` + blocking.join('\n'));
            }
